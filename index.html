<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>人生经历打卡</title>
<style>
  /* ========== LOADING SCREEN ========== */
  #loadingScreen {
    position: fixed;
    inset: 0;
    z-index: 99999;
    background: #1a0e0a;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.8s ease;
  }
  #loadingScreen.fade-out { opacity: 0; pointer-events: none; }
  #loadingCanvas { display: block; }
  #loadingText {
    position: absolute;
    bottom: 18%;
    left: 50%;
    transform: translateX(-50%);
    color: #fce8d8;
    font-size: 16px;
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.5s;
    text-align: center;
    white-space: nowrap;
    text-shadow: 0 0 12px rgba(255,200,150,0.5);
    letter-spacing: 2px;
  }
  #loadingText.show { opacity: 1; }
  #loadingHint {
    position: absolute;
    bottom: 10%;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(252,232,216,0.4);
    font-size: 12px;
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:0.7} }
  
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  :root {
    --bg: #fdf8f4;
    --card: #ffffff;
    --card-alt: #fefaf6;
    --primary: #c47a5e;
    --primary-light: #d4957a;
    --primary-dark: #a8624a;
    --accent: #fce8d8;
    --accent2: #f5d8c5;
    --text: #3e2d23;
    --text-light: #8b6f5e;
    --text-muted: #b5a090;
    --border: #f0ddd0;
    --success: #7cb89a;
    --danger: #d4837a;
    --danger-bg: #fdf0ef;
    --shadow: 0 2px 16px rgba(180, 140, 100, 0.10);
    --shadow-hover: 0 4px 20px rgba(180, 140, 100, 0.18);
    --radius: 16px;
    --radius-sm: 10px;
  }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 80px;
    -webkit-font-smoothing: antialiased;
  }
  
  /* ========== HEADER ========== */
  .header {
    background: linear-gradient(145deg, #d4a574 0%, #c47a5e 50%, #b86248 100%);
    padding: 24px 16px 28px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(160, 100, 60, 0.25);
  }
  .header h1 {
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 1px;
    margin-bottom: 14px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.12);
  }
  .progress-outer {
    background: rgba(255,255,255,0.22);
    border-radius: 20px;
    height: 12px;
    overflow: hidden;
    margin: 0 auto 8px;
    max-width: 300px;
    backdrop-filter: blur(4px);
  }
  .progress-inner {
    height: 100%;
    border-radius: 20px;
    background: linear-gradient(90deg, #fce8d8, #ffffff);
    transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    width: 0%;
    position: relative;
  }
  .progress-inner::after {
    content: '';
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 30px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5));
    border-radius: 20px;
  }
  .progress-text {
    font-size: 12px;
    color: rgba(255,255,255,0.92);
    font-weight: 500;
    letter-spacing: 0.5px;
  }
  
  /* ========== CHAPTER ========== */
  .chapter {
    margin: 14px 12px 0;
    border-radius: var(--radius);
    background: var(--card);
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: box-shadow 0.2s;
  }
  .chapter:first-child { margin-top: 12px; }
  .chapter-header {
    display: flex;
    align-items: center;
    padding: 15px 16px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    transition: background 0.2s;
  }
  .chapter-header:active { background: var(--card-alt); }
  .chapter-icon {
    font-size: 22px;
    margin-right: 11px;
    flex-shrink: 0;
    width: 28px;
    text-align: center;
  }
  .chapter-body { flex: 1; min-width: 0; }
  .chapter-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
  }
  .chapter-sub {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .chapter-right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    margin-left: 8px;
  }
  .chapter-count {
    font-size: 12px;
    color: var(--primary);
    font-weight: 600;
    background: var(--accent);
    padding: 2px 9px;
    border-radius: 20px;
  }
  .chapter-arrow {
    font-size: 11px;
    color: var(--text-muted);
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    display: inline-block;
  }
  .chapter.open .chapter-arrow { transform: rotate(180deg); }
  .chapter-items {
    display: none;
    padding: 0 10px 10px;
  }
  .chapter.open .chapter-items { display: block; }
  
  /* ========== EVENT ITEM ========== */
  .event-item {
    display: flex;
    align-items: flex-start;
    padding: 12px 10px;
    border-radius: var(--radius-sm);
    margin-bottom: 4px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  .event-item:active { background: var(--accent); transform: scale(0.985); }
  .event-check {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2.2px solid var(--border);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 10px;
    margin-top: 1px;
    transition: all 0.3s;
    font-size: 13px;
    background: var(--card);
  }
  .event-item.checked .event-check {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
    box-shadow: 0 2px 8px rgba(196, 122, 94, 0.35);
  }
  .event-info { flex: 1; min-width: 0; padding-top: 1px; }
  .event-name {
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
  }
  .event-item.checked .event-name {
    color: var(--text-muted);
    text-decoration: line-through;
    text-decoration-color: var(--border);
    text-decoration-thickness: 1.5px;
  }
  .event-meta {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .event-meta span { white-space: nowrap; }
  
  /* ========== MODAL ========== */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(62, 45, 35, 0.45);
    z-index: 1000;
    align-items: flex-end;
    justify-content: center;
    backdrop-filter: blur(2px);
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--card);
    border-radius: 22px 22px 0 0;
    width: 100%;
    max-width: 500px;
    max-height: 88vh;
    overflow-y: auto;
    padding: 28px 20px 36px;
    animation: slideUp 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    -webkit-overflow-scrolling: touch;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); opacity: 0.8; }
    to { transform: translateY(0); opacity: 1; }
  }
  .modal-title {
    font-size: 18px;
    font-weight: 700;
    text-align: center;
    color: var(--text);
    margin-bottom: 4px;
  }
  .modal-subtitle {
    font-size: 12px;
    color: var(--text-muted);
    text-align: center;
    margin-bottom: 20px;
  }
  .modal-event-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--primary);
    text-align: center;
    margin-bottom: 22px;
    padding: 12px 14px;
    background: var(--accent);
    border-radius: 12px;
    line-height: 1.5;
  }
  
  /* ========== FORM ========== */
  .form-group { margin-bottom: 18px; }
  .form-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-light);
    margin-bottom: 7px;
    display: block;
    padding-left: 2px;
  }
  .form-input {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 15px;
    color: var(--text);
    background: var(--card-alt);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    font-family: inherit;
    -webkit-appearance: none;
  }
  .form-input:focus {
    border-color: var(--primary-light);
    box-shadow: 0 0 0 3px rgba(196, 122, 94, 0.12);
  }
  
  /* ========== PHOTO UPLOAD ========== */
  .photo-upload {
    width: 100%;
    min-height: 130px;
    border: 2px dashed var(--border);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    overflow: hidden;
    position: relative;
    background: var(--card-alt);
  }
  .photo-upload:active { background: var(--accent); }
  .photo-upload.has-photo { border-style: solid; border-color: var(--accent2); }
  .photo-upload-icon { font-size: 30px; opacity: 0.35; }
  .photo-upload-text { font-size: 13px; color: var(--text-muted); margin-top: 6px; }
  .photo-preview {
    width: 100%;
    height: 210px;
    object-fit: cover;
    display: none;
    border-radius: 12px;
  }
  .photo-upload.has-photo .photo-preview { display: block; }
  .photo-upload.has-photo .photo-upload-icon,
  .photo-upload.has-photo .photo-upload-text { display: none; }
  .photo-remove {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 30px;
    height: 30px;
    background: rgba(62, 45, 35, 0.6);
    color: #fff;
    border: none;
    border-radius: 50%;
    font-size: 14px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }
  .photo-upload.has-photo .photo-remove { display: flex; }
  
  /* ========== BUTTONS ========== */
  .btn-row { display: flex; gap: 12px; margin-top: 22px; }
  .btn {
    flex: 1;
    padding: 13px 0;
    border: none;
    border-radius: 13px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { opacity: 0.75; transform: scale(0.97); }
  .btn-cancel { background: var(--card-alt); color: var(--text-light); border: 1.5px solid var(--border); }
  .btn-primary {
    background: linear-gradient(145deg, var(--primary-light), var(--primary-dark));
    color: #fff;
    box-shadow: 0 4px 14px rgba(196, 122, 94, 0.3);
  }
  .btn-danger { background: var(--danger-bg); color: var(--danger); border: 1.5px solid #f0d0cc; }
  .btn-delete-wrap { margin-top: 12px; }
  
  /* ========== BOTTOM BAR ========== */
  .bottom-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 -1px 12px rgba(0,0,0,0.05);
    display: flex;
    justify-content: space-around;
    padding: 10px 6px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    z-index: 100;
    border-top: 1px solid rgba(240, 221, 208, 0.5);
  }
  .bottom-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 10px;
    cursor: pointer;
    padding: 5px 14px;
    border-radius: 10px;
    transition: all 0.2s;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .bottom-btn:active { background: var(--accent); }
  .bottom-btn .icon { font-size: 20px; margin-bottom: 2px; line-height: 1; }
  .bottom-btn.active { color: var(--primary); }
  .bottom-btn.active .icon { filter: drop-shadow(0 1px 2px rgba(196,122,94,0.3)); }
  
  /* ========== TIMELINE VIEW ========== */
  .timeline-view { display: none; padding: 12px; }
  .timeline-view.show { display: block; }
  .main-list { display: block; }
  .main-list.hidden { display: none; }
  
  .timeline-item {
    display: flex;
    gap: 12px;
    margin-bottom: 14px;
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px;
    transition: box-shadow 0.2s;
  }
  .timeline-item:active { box-shadow: var(--shadow-hover); }
  .timeline-date {
    flex-shrink: 0;
    width: 54px;
    text-align: center;
    background: var(--accent);
    border-radius: 12px;
    padding: 10px 4px;
  }
  .timeline-day { font-size: 24px; font-weight: 800; color: var(--primary); line-height: 1; }
  .timeline-month { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
  .timeline-info { flex: 1; min-width: 0; }
  .timeline-chapter { font-size: 11px; color: var(--primary-light); margin-bottom: 4px; font-weight: 500; }
  .timeline-name { font-size: 14px; line-height: 1.5; color: var(--text); }
  .timeline-note {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 6px;
    padding: 6px 10px;
    background: var(--card-alt);
    border-radius: 8px;
    line-height: 1.5;
  }
  .timeline-photo {
    width: 100%;
    max-height: 190px;
    object-fit: cover;
    border-radius: 10px;
    margin-top: 10px;
  }
  .timeline-empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
    font-size: 14px;
    line-height: 1.8;
  }
  
  /* ========== STATS VIEW ========== */
  .stats-view { display: none; padding: 12px; }
  .stats-view.show { display: block; }
  
  .stats-hero {
    background: linear-gradient(145deg, #d4a574, #c47a5e, #b86248);
    border-radius: var(--radius);
    padding: 32px 20px;
    text-align: center;
    color: #fff;
    box-shadow: 0 6px 24px rgba(160, 100, 60, 0.3);
    margin-bottom: 14px;
  }
  .stats-hero-num { font-size: 52px; font-weight: 800; line-height: 1; letter-spacing: -2px; }
  .stats-hero-label { font-size: 13px; opacity: 0.85; margin-top: 6px; }
  .stats-hero-bar {
    background: rgba(255,255,255,0.2);
    border-radius: 20px;
    height: 8px;
    margin: 16px auto 0;
    max-width: 220px;
    overflow: hidden;
  }
  .stats-hero-fill {
    height: 100%;
    border-radius: 20px;
    background: #fff;
    transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }
  
  .stats-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px;
    margin-bottom: 12px;
  }
  .stats-card-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 14px;
  }
  .stats-chart {
    display: flex;
    align-items: flex-end;
    gap: 5px;
    height: 110px;
    padding: 0 2px;
  }
  .stats-bar-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100%;
    justify-content: flex-end;
  }
  .stats-bar {
    width: 100%;
    max-width: 30px;
    border-radius: 6px 6px 0 0;
    min-height: 3px;
    background: linear-gradient(0deg, var(--primary), var(--primary-light));
    transition: height 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .stats-bar-label {
    font-size: 9px;
    color: var(--text-muted);
    margin-top: 5px;
    text-align: center;
    line-height: 1.2;
  }
  
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    text-align: center;
  }
  .stats-grid-item { padding: 10px 4px; }
  .stats-grid-num {
    font-size: 22px;
    font-weight: 800;
    color: var(--primary);
    line-height: 1;
  }
  .stats-grid-label { font-size: 11px; color: var(--text-muted); margin-top: 5px; }
  
  /* ========== DATA PANEL ========== */
  .data-section {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 16px;
    margin: 12px;
  }
  .data-section h3 {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 6px;
    color: var(--text);
  }
  .data-section-desc {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 18px;
    line-height: 1.6;
  }
  .data-btn {
    display: block;
    width: 100%;
    padding: 13px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    background: var(--card-alt);
    color: var(--text);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    margin-bottom: 10px;
    text-align: center;
    transition: all 0.15s;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .data-btn:active { background: var(--accent); transform: scale(0.98); }
  .data-btn.primary {
    background: linear-gradient(145deg, var(--primary-light), var(--primary-dark));
    color: #fff;
    border-color: transparent;
    box-shadow: 0 4px 14px rgba(196,122,94,0.3);
  }
  .data-btn.danger {
    background: var(--danger-bg);
    color: var(--danger);
    border-color: #f0d0cc;
  }
  
  /* ========== PHOTO VIEWER ========== */
  .photo-viewer {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(30, 20, 15, 0.95);
    z-index: 2000;
    align-items: center;
    justify-content: center;
    padding: 20px;
    backdrop-filter: blur(8px);
  }
  .photo-viewer.show { display: flex; }
  .photo-viewer img {
    max-width: 100%;
    max-height: 85vh;
    border-radius: 10px;
    object-fit: contain;
  }
  .photo-viewer-hint {
    position: absolute;
    bottom: 40px;
    color: rgba(255,255,255,0.4);
    font-size: 12px;
  }
  
  /* ========== TOAST ========== */
  .toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(62, 45, 35, 0.88);
    backdrop-filter: blur(8px);
    color: #fff;
    padding: 12px 26px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 500;
    z-index: 9999;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }
  
  /* ========== SCROLLBAR ========== */
  ::-webkit-scrollbar { width: 0; height: 0; }
  * { scrollbar-width: none; }
</style>
</head>
<body>

<!-- ========== LOADING SCREEN ========== -->
<div id="loadingScreen">
  <canvas id="loadingCanvas"></canvas>
  <div id="loadingText"></div>
  <div id="loadingHint">正在孕育生命…</div>
</div>

<!-- HEADER -->
<div class="header">
  <h1>🌅 人生经历打卡</h1>
  <div class="progress-outer">
    <div class="progress-inner" id="progressFill"></div>
  </div>
  <div class="progress-text" id="progressText">已点亮 0 / 96 个经历</div>
</div>

<!-- MAIN LIST -->
<div class="main-list" id="mainList"></div>

<!-- TIMELINE VIEW -->
<div class="timeline-view" id="timelineView"></div>

<!-- STATS VIEW -->
<div class="stats-view" id="statsView"></div>

<!-- BOTTOM BAR -->
<div class="bottom-bar">
  <button class="bottom-btn active" onclick="switchTab('list')" id="tabList">
    <span class="icon">📋</span>清单
  </button>
  <button class="bottom-btn" onclick="switchTab('timeline')" id="tabTimeline">
    <span class="icon">🗓️</span>时光轴
  </button>
  <button class="bottom-btn" onclick="switchTab('stats')" id="tabStats">
    <span class="icon">📊</span>统计
  </button>
  <button class="bottom-btn" onclick="showDataPanel()" id="tabData">
    <span class="icon">⚙️</span>数据
  </button>
</div>

<!-- CHECK-IN MODAL -->
<div class="modal-overlay" id="checkinModal">
  <div class="modal">
    <div class="modal-title">✅ 打卡记录</div>
    <div class="modal-subtitle">记录这一刻，属于你的人生</div>
    <div class="modal-event-name" id="modalEventName"></div>
    <div class="form-group">
      <label class="form-label">📅 打卡日期</label>
      <input type="date" class="form-input" id="checkinDate">
    </div>
    <div class="form-group">
      <label class="form-label">📷 记录照片（可选）</label>
      <div class="photo-upload" id="photoUpload" onclick="document.getElementById('photoInput').click()">
        <span class="photo-upload-icon">📷</span>
        <span class="photo-upload-text">点击上传照片</span>

<script>
// ========= LOADING ANIMATION ==========
(function(){
  var canvas = document.getElementById("loadingCanvas");
  if(!canvas) return;
  var ctx = canvas.getContext("2d");
  var screen = document.getElementById("loadingScreen");
  var textEl = document.getElementById("loadingText");

  function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener("resize", resize);

  function W(){ return canvas.width; }
  function H(){ return canvas.height; }
  function cx(){ return canvas.width/2; }
  function cy(){ return canvas.height/2; }

  // ===== Particle system =====
  var particles = [];
  function spawnP(x, y, count, colorFn, speed, life){
    for(var i=0;i<count;i++){
      var a = Math.random()*Math.PI*2;
      var s = speed * (0.3+Math.random()*0.7);
      var c = colorFn ? colorFn() : "rgba(255,220,140,0.8)";
      particles.push({x:x, y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s,
        life:life||60, maxLife:life||60, r:1+Math.random()*2.5,
        color:c});
    }
  }
  function tickP(){
    for(var i=particles.length-1;i>=0;i--){
      var p=particles[i];
      p.x+=p.vx; p.y+=p.vy; p.life--;
      if(p.life<=0){ particles.splice(i,1); }
    }
  }
  function drawP(){
    for(var i=0;i<particles.length;i++){
      var p=particles[i];
      var a = p.life / p.maxLife;
      ctx.globalAlpha = a * 0.8;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r*a, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  var frame = 0, animDone = false;
  var FPS = 60, SPD = 1000/FPS;

  function loop(){
    if(animDone) return;
    ctx.clearRect(0, 0, W(), H());

    // ===== Phase 1: Two orbs approach (Milky White + Light Yellow) =====
    if(frame < 120){
      var t = frame / 120;
      var ease = t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2;
      var maxDist = W() * 0.38;
      var xLeft  = cx() - maxDist * (1 - ease);
      var xRight = cx() + maxDist * (1 - ease);
      var orbY = cy() + Math.sin(frame*0.04)*4;

      // Left orb trail particles
      if(frame % 2 === 0){
        spawnP(xLeft, orbY, 1, function(){ return "rgba(220,230,255,"+(0.3+Math.random()*0.3)+")"; }, 0.3, 35);
        spawnP(xRight, orbY, 1, function(){ return "rgba(255,230,160,"+(0.3+Math.random()*0.3)+")"; }, 0.3, 35);
      }

      // Left orb: milky white (阴)
      var oL_o = ctx.createRadialGradient(xLeft, orbY, 0, xLeft, orbY, 50+t*20);
      oL_o.addColorStop(0, "rgba(230,240,255,0.12)");
      oL_o.addColorStop(1, "rgba(230,240,255,0)");
      ctx.fillStyle = oL_o;
      ctx.beginPath(); ctx.arc(xLeft, orbY, 50+t*20, 0, Math.PI*2); ctx.fill();
      var oL_c = ctx.createRadialGradient(xLeft-4, orbY-4, 0, xLeft, orbY, 18);
      oL_c.addColorStop(0, "rgba(255,255,255,0.95)");
      oL_c.addColorStop(0.6, "rgba(210,225,255,0.8)");
      oL_c.addColorStop(1, "rgba(180,200,240,0.4)");
      ctx.fillStyle = oL_c;
      ctx.beginPath(); ctx.arc(xLeft, orbY, 18, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.85)";
      ctx.beginPath(); ctx.arc(xLeft, orbY, 7, 0, Math.PI*2); ctx.fill();

      // Right orb: light yellow/gold (阳)
      var oR_o = ctx.createRadialGradient(xRight, orbY, 0, xRight, orbY, 50+t*20);
      oR_o.addColorStop(0, "rgba(255,230,150,0.13)");
      oR_o.addColorStop(1, "rgba(255,230,150,0)");
      ctx.fillStyle = oR_o;
      ctx.beginPath(); ctx.arc(xRight, orbY, 50+t*20, 0, Math.PI*2); ctx.fill();
      var oR_c = ctx.createRadialGradient(xRight+4, orbY-4, 0, xRight, orbY, 18);
      oR_c.addColorStop(0, "rgba(255,255,230,0.95)");
      oR_c.addColorStop(0.6, "rgba(255,220,130,0.8)");
      oR_c.addColorStop(1, "rgba(255,200,100,0.4)");
      ctx.fillStyle = oR_c;
      ctx.beginPath(); ctx.arc(xRight, orbY, 18, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "rgba(255,255,200,0.85)";
      ctx.beginPath(); ctx.arc(xRight, orbY, 7, 0, Math.PI*2); ctx.fill();
    }
    } else if(frame < 200){
      // ===== Phase 2: Merge + Golden Flash (阴阳融合 -> 金丹初成) =====
      var t = (frame - 120) / 80;
      var ease = 1 - Math.pow(1 - t, 3);
      var flash = Math.sin(t * Math.PI);

      // Flash burst
      ctx.save();
      ctx.globalAlpha = flash * 0.35;
      ctx.fillStyle = "#fffbe6";
      ctx.beginPath(); ctx.arc(cx(), cy(), W()*0.7*flash, 0, Math.PI*2); ctx.fill();
      ctx.restore();

      // Radial shockwave rings
      if(t < 0.6){
        var ringR = (t/0.6) * Math.max(W(),H())*0.45;
        ctx.save();
        ctx.globalAlpha = (1-t/0.6) * 0.4;
        ctx.strokeStyle = "rgba(255,220,140,0.8)";
        ctx.lineWidth = 3*(1-t/0.6)+1;
        ctx.beginPath(); ctx.arc(cx(), cy(), ringR, 0, Math.PI*2); ctx.stroke();
        ctx.strokeStyle = "rgba(255,240,200,0.5)";
        ctx.lineWidth = 6*(1-t/0.6)+1;
        ctx.beginPath(); ctx.arc(cx(), cy(), ringR*1.05, 0, Math.PI*2); ctx.stroke();
        ctx.restore();
      }

      // Merged golden core (growing)
      var coreR = 8 + ease * 45;
      var coreGlow = ctx.createRadialGradient(cx(), cy(), 0, cx(), cy(), coreR * 2.5);
      coreGlow.addColorStop(0, "rgba(255,220,100,"+(0.3+flash*0.2)+")");
      coreGlow.addColorStop(0.4, "rgba(255,180,60,0.1)");
      coreGlow.addColorStop(1, "rgba(255,180,60,0)");
      ctx.fillStyle = coreGlow;
      ctx.beginPath(); ctx.arc(cx(), cy(), coreR*2.5, 0, Math.PI*2); ctx.fill();

      // Golden dan core
      var danGrad = ctx.createRadialGradient(cx()-coreR*0.2, cy()-coreR*0.2, 0, cx(), cy(), coreR);
      danGrad.addColorStop(0, "rgba(255,250,220,0.98)");
      danGrad.addColorStop(0.5, "rgba(255,200,80,0.95)");
      danGrad.addColorStop(0.85, "rgba(220,150,40,0.9)");
      danGrad.addColorStop(1, "rgba(180,120,30,0.8)");
      ctx.fillStyle = danGrad;
      ctx.beginPath(); ctx.arc(cx(), cy(), coreR, 0, Math.PI*2); ctx.fill();

      // Surface swirl on golden dan
      ctx.save();
      ctx.globalAlpha = 0.25;
      ctx.strokeStyle = "rgba(255,255,200,0.7)";
      ctx.lineWidth = 1.2;
      for(var s=0; s<3; s++){
        var soff = s*2.1 + frame*0.03;
        ctx.beginPath();
        for(var a=0;a<=Math.PI*2;a+=0.08){
          var rr = coreR * (0.3 + 0.55*Math.sin(a*2+soff));
          var px = cx() + Math.cos(a)*rr;
          var py = cy() + Math.sin(a)*rr;
          if(a===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
        }
        ctx.closePath(); ctx.stroke();
      }
      ctx.restore();

      // Burst particles
      if(frame % 2 === 0 && t < 0.7){
        spawnP(cx(), cy(), 3, function(){
          return "hsl("+(35+Math.random()*25)+","+(80+Math.random()*20)+"%,"+(65+Math.random()*20)+"%)";
        }, 1.5+Math.random()*2, 40+Math.random()*20);
      }
    }
    } else if(frame < 340){
      // ===== Phase 3: Golden Dan charges, rotates, cracks (金丹蕴养) =====
      var t = (frame - 200) / 140;
      var pulse = Math.sin(frame * 0.04) * 0.5 + 0.5;
      var rotateAngle = frame * 0.008;
      var coreR = 50 + pulse * 5;

      // Outer aura (multiple layers)
      for(var L=0; L<3; L++){
        var Lr = coreR * (1.3 + L*0.45 + Math.sin(frame*0.03+L)*0.1);
        var Lg = ctx.createRadialGradient(cx(), cy(), coreR*0.8, cx(), cy(), Lr);
        Lg.addColorStop(0, "rgba(255,200,80,"+(0.08 - L*0.02)+")");
        Lg.addColorStop(1, "rgba(255,180,60,0)");
        ctx.fillStyle = Lg;
        ctx.beginPath(); ctx.arc(cx(), cy(), Lr, 0, Math.PI*2); ctx.fill();
      }

      // Golden dan body (with rotation)
      ctx.save();
      ctx.translate(cx(), cy());
      ctx.rotate(rotateAngle);

      var danGrad2 = ctx.createRadialGradient(-coreR*0.15, -coreR*0.15, 0, 0, 0, coreR);
      danGrad2.addColorStop(0, "rgba(255,252,230,0.98)");
      danGrad2.addColorStop(0.4, "rgba(255,210,90,0.95)");
      danGrad2.addColorStop(0.75, "rgba(220,160,50,0.92)");
      danGrad2.addColorStop(1, "rgba(180,120,30,0.88)");
      ctx.fillStyle = danGrad2;
      ctx.beginPath(); ctx.arc(0, 0, coreR, 0, Math.PI*2); ctx.fill();

      // Dan surface: Tao symbol hints
      ctx.globalAlpha = 0.18;
      ctx.strokeStyle = "rgba(255,255,200,0.7)";
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(0, 0, coreR*0.35, -Math.PI/2, Math.PI*1.5); ctx.stroke();
      ctx.beginPath(); ctx.arc(-coreR*0.12, 0, coreR*0.22, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc( coreR*0.12, 0, coreR*0.22, 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = "rgba(255,255,200,0.5)";
      ctx.beginPath(); ctx.arc(-coreR*0.12, 0, coreR*0.06, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc( coreR*0.12, 0, coreR*0.06, 0, Math.PI*2); ctx.fill();

      // Surface crack lines (t > 0.35)
      if(t > 0.35){
        var crackAlpha = Math.min(1, (t-0.35)/0.2);
        ctx.globalAlpha = crackAlpha * 0.6;
        ctx.strokeStyle = "rgba(255,100,30,0.8)";
        ctx.lineWidth = 1.8;
        ctx.lineCap = "round";
        for(var c=0; c<6; c++){
          var ca = c*(Math.PI/3) + frame*0.01;
          var innerR = coreR * (0.2 + Math.sin(frame*0.05+c)*0.1);
          var outerR = coreR * (0.75 + Math.sin(frame*0.03+c)*0.15);
          ctx.beginPath();
          ctx.moveTo(Math.cos(ca)*innerR, Math.sin(ca)*innerR);
          ctx.quadraticCurveTo(
            Math.cos(ca+0.2)*outerR*0.7, Math.sin(ca+0.2)*outerR*0.7,
            Math.cos(ca)*outerR, Math.sin(ca)*outerR);
          ctx.stroke();
        }
        ctx.globalAlpha = crackAlpha * 0.35;
        ctx.fillStyle = "rgba(255,180,50,0.7)";
        ctx.beginPath(); ctx.arc(0, 0, coreR*1.05, 0, Math.PI*2); ctx.fill();
      }
      ctx.restore();

      // Floating rune particles
      if(frame % 4 === 0){
        var fa = Math.random()*Math.PI*2;
        var fd = coreR*1.2 + Math.random()*40;
        spawnP(cx()+Math.cos(fa)*fd, cy()+Math.sin(fa)*fd, 1,
          function(){ return "rgba(255,220,140,"+(0.3+Math.random()*0.3)+")"; }, 0.2, 50);
      }

      // Intense golden glow (building to shatter)
      if(t > 0.6){
        var intensity = (t-0.6)/0.4 * pulse;
        ctx.save();
        ctx.globalAlpha = intensity * 0.18;
        ctx.fillStyle = "#fffbe6";
        ctx.beginPath(); ctx.arc(cx(), cy(), coreR*(1.5+intensity*0.8), 0, Math.PI*2); ctx.fill();
        ctx.restore();
      }
    }
    } else if(frame < 500){
      // ===== Phase 4: Golden Dan shatters, Yuan Ying emerges (金丹破碎,元婴出世) =====
      var t = (frame - 340) / 160;
      var ease = 1 - Math.pow(1 - Math.min(t,1), 3);

      // === Part A: Dan shatters (t 0~0.35) ===
      if(t < 0.4){
        var st = t / 0.4;
        var stEase = 1 - Math.pow(1-st, 2);

        // Shockwave burst
        var burstR = stEase * Math.max(W(),H())*0.5;
        ctx.save();
        ctx.globalAlpha = (1-stEase)*0.3;
        ctx.strokeStyle = "rgba(255,220,120,0.9)";
        ctx.lineWidth = 4*(1-stEase)+1;
        ctx.beginPath(); ctx.arc(cx(), cy(), burstR, 0, Math.PI*2); ctx.stroke();
        ctx.restore();

        // Shatter particles
        if(frame % 2 === 0){
          for(var i=0;i<5;i++){
            var sa = Math.random()*Math.PI*2;
            var sd = 20 + Math.random()*30;
            spawnP(cx()+Math.cos(sa)*sd, cy()+Math.sin(sa)*sd, 1,
              function(){ return "rgba("+(200+Math.random()*55)+","+(140+Math.random()*80)+","+(30+Math.random()*40)+",0.8)"; },
              2+Math.random()*3, 35+Math.random()*25);
          }
        }

        // Remaining dan core (cracking apart)
        var remR = 50 * (1 - stEase*0.7);
        ctx.save();
        ctx.globalAlpha = 1 - stEase*0.6;
        var remGrad = ctx.createRadialGradient(cx(), cy(), 0, cx(), cy(), remR);
        remGrad.addColorStop(0, "rgba(255,240,200,0.9)");
        remGrad.addColorStop(1, "rgba(220,160,50,0.7)");
        ctx.fillStyle = remGrad;
        for(var f=0;f<6;f++){
          var fa2 = f*(Math.PI/3) + stEase*2;
          var fr = remR * (0.4 + 0.6*(1-stEase*0.5));
          ctx.beginPath();
          ctx.arc(cx()+Math.cos(fa2)*remR*0.2*stEase, cy()+Math.sin(fa2)*remR*0.2*stEase, fr*0.55, fa2, fa2+Math.PI/3);
          ctx.arc(cx(), cy(), remR*0.3, fa2+Math.PI/3, fa2, true);
          ctx.fill();
        }
        ctx.restore();
      }

      // === Part B: Yuan Ying emerges (t 0.15~1.0) ===
      if(t > 0.15){
        var yt = Math.min(1, (t - 0.15) / 0.7);
        var yAlpha = yt < 0.3 ? yt/0.3 : 1;
        var yScale = 0.2 + yt * 0.8;

        // Power glow behind yuan ying
        var yyGlow = ctx.createRadialGradient(cx(), cy()-20, 0, cx(), cy()-20, 80+yScale*30);
        yyGlow.addColorStop(0, "rgba(255,230,150,"+(yAlpha*0.25)+")");
        yyGlow.addColorStop(0.5, "rgba(255,200,80,"+(yAlpha*0.1)+")");
        yyGlow.addColorStop(1, "rgba(255,200,80,0)");
        ctx.fillStyle = yyGlow;
        ctx.beginPath(); ctx.arc(cx(), cy()-20, 80+yScale*30, 0, Math.PI*2); ctx.fill();

        ctx.save();
        ctx.globalAlpha = yAlpha;
        ctx.translate(cx(), cy() - 20);
        ctx.scale(yScale, yScale);

        var yySkin = "rgba(255,230,180,0.92)";

        // Head
        var headG = ctx.createRadialGradient(-3, -52, 2, 0, -52, 22);
        headG.addColorStop(0, "rgba(255,240,210,0.95)");
        headG.addColorStop(1, yySkin);
        ctx.fillStyle = headG;
        ctx.beginPath(); ctx.arc(0, -52, 22, 0, Math.PI*2); ctx.fill();
        // Golden mark on forehead
        ctx.fillStyle = "rgba(255,220,100,0.6)";
        ctx.beginPath(); ctx.arc(0, -58, 4, 0, Math.PI*2); ctx.fill();

        // Eyes (closed, serene)
        ctx.strokeStyle = "rgba(200,170,140,0.7)";
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(-8, -50); ctx.quadraticCurveTo(-3, -48, 2, -50); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(2, -50);  ctx.quadraticCurveTo( 7, -48, 12,-50); ctx.stroke();

        // Ears
        ctx.fillStyle = yySkin;
        ctx.beginPath(); ctx.ellipse(-20, -50, 5, 8, -0.1, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse( 20, -50, 5, 8,  0.1, 0, Math.PI*2); ctx.fill();

        // Torso (lotus position)
        ctx.fillStyle = yySkin;
        ctx.beginPath(); ctx.ellipse(0, -18, 18, 24, 0, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = "rgba(255,220,120,0.5)";
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(-16, -8); ctx.quadraticCurveTo(0, -5, 16, -8); ctx.stroke();

        // Arms (hands at heart in mudra)
        ctx.strokeStyle = yySkin;
        ctx.lineWidth = 8;
        ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(-14, -28); ctx.quadraticCurveTo(-22, -18, -12, -10); ctx.stroke();
        ctx.beginPath(); ctx.moveTo( 14, -28); ctx.quadraticCurveTo( 22, -18,  12, -10); ctx.stroke();
        ctx.fillStyle = "rgba(255,240,210,0.95)";
        ctx.beginPath(); ctx.ellipse(-2, -8, 6, 9, 0.1, 0, Math.PI*2); ctx.fill();

        // Legs (lotus position)
        ctx.lineWidth = 9;
        ctx.beginPath(); ctx.moveTo(-10, 8);  ctx.quadraticCurveTo(-25, 18, -30, 30); ctx.stroke();
        ctx.beginPath(); ctx.moveTo( 10, 8);  ctx.quadraticCurveTo( 25, 18,  30, 30); ctx.stroke();

        ctx.restore();

        // "我tm来了" text
        if(yt > 0.35 && textEl && !textEl.classList.contains("show")){
          textEl.textContent = "我tm来了";
          textEl.classList.add("show");
        }
      }
    }
    } else {
      // ===== Phase 5: Fade out =====
      var t = Math.min(1, (frame - 500) / 40);
      if(screen) screen.style.opacity = 1 - t;
      if(t >= 1){
        animDone = true;
        if(screen){
          screen.classList.add("fade-out");
          setTimeout(function(){ screen.style.display = "none"; }, 800);
        }
        return;
      }
    }

    // Draw particles on top of everything
    tickP();
    drawP();

    frame++;
    setTimeout(function(){ requestAnimationFrame(loop); }, SPD);
  }

  setTimeout(function(){ requestAnimationFrame(loop); }, 100);
})();

var ALL_EVENTS = [];
CHAPTERS.forEach(function(ch, ci) {
  ch.events.forEach(function(ev, ei) {
    ALL_EVENTS.push({ id: ci + '-' + ei, chapter: ci, name: ev });
  });
});
var TOTAL = ALL_EVENTS.length;

// ========== STATE ==========
var checkinData = {};
var currentEventId = null;
var tempPhotoData = null;

// ========== INIT ==========
function init() {
  loadData();
  renderList();
  updateProgress();
  document.getElementById('checkinDate').value = new Date().toISOString().split('T')[0];
}

function loadData() {
  try {
    var raw = localStorage.getItem('lifeCheckinData');
    if (raw) checkinData = JSON.parse(raw);
  } catch(e) { checkinData = {}; }
}

function saveData() {
  localStorage.setItem('lifeCheckinData', JSON.stringify(checkinData));
}

// ========== RENDER LIST ==========
function renderList() {
  var container = document.getElementById('mainList');
  container.innerHTML = '';
  CHAPTERS.forEach(function(ch, ci) {
    var chapterDiv = document.createElement('div');
    chapterDiv.className = 'chapter open';
    chapterDiv.id = 'chapter-' + ci;

    var checkedCount = 0;
    ch.events.forEach(function(_, ei) {
      if (checkinData[ci + '-' + ei]) checkedCount++;
    });

    chapterDiv.innerHTML =
      '<div class="chapter-header" onclick="toggleChapter(' + ci + ')">' +
        '<span class="chapter-icon">' + ch.icon + '</span>' +
        '<div class="chapter-body">' +
          '<div class="chapter-title">' + escapeHtml(ch.title) + '</div>' +
          '<div class="chapter-sub">' + escapeHtml(ch.subtitle) + '</div>' +
        '</div>' +
        '<div class="chapter-right">' +
          '<span class="chapter-count">' + checkedCount + '/' + ch.events.length + '</span>' +
          '<span class="chapter-arrow">▼</span>' +
        '</div>' +
      '</div>' +
      '<div class="chapter-items">' +
        ch.events.map(function(ev, ei) {
          var id = ci + '-' + ei;
          var checked = checkinData[id];
          var metaHtml = checked ? renderMeta(checked) : '';
          return '' +
            '<div class="event-item' + (checked ? ' checked' : '') + '" onclick="openCheckin(\'' + id + '\')">' +
              '<div class="event-check">' + (checked ? '✓' : '') + '</div>' +
              '<div class="event-info">' +
                '<div class="event-name">' + escapeHtml(ev) + '</div>' +
                metaHtml +
              '</div>' +
            '</div>';
        }).join('') +
      '</div>';

    container.appendChild(chapterDiv);
  });
}

function renderMeta(data) {
  var parts = [];
  if (data.date) parts.push('📅 ' + data.date);
  if (data.photo) parts.push('📷 有照片');
  if (data.note) parts.push('💬 ' + escapeHtml(data.note.substring(0, 15)) + (data.note.length > 15 ? '…' : ''));
  if (parts.length === 0) return '';
  return '<div class="event-meta"><span>' + parts.join('</span><span>·</span><span>') + '</span></div>';
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.appendChild(document.createTextNode(str));
  return div.innerHTML;
}

function toggleChapter(ci) {
  var el = document.getElementById('chapter-' + ci);
  el.classList.toggle('open');
}

// ========== PROGRESS ==========
function updateProgress() {
  var done = Object.keys(checkinData).length;
  var pct = TOTAL > 0 ? Math.round(done / TOTAL * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = '已点亮 ' + done + ' / ' + TOTAL + ' 个经历（' + pct + '%）';
}

// ========== MODAL ==========
function openCheckin(eventId) {
  currentEventId = eventId;
  tempPhotoData = null;
  var ev = ALL_EVENTS.find(function(e) { return e.id === eventId; });
  document.getElementById('modalEventName').textContent = ev.name;

  var existing = checkinData[eventId];
  if (existing) {
    document.getElementById('checkinDate').value = existing.date || new Date().toISOString().split('T')[0];
    document.getElementById('checkinNote').value = existing.note || '';
    if (existing.photo) {
      showPhotoPreview(existing.photo);
    } else {
      clearPhotoPreview();
    }
    document.getElementById('deleteBtnWrap').style.display = 'block';
  } else {
    document.getElementById('checkinDate').value = new Date().toISOString().split('T')[0];
    document.getElementById('checkinNote').value = '';
    clearPhotoPreview();
    document.getElementById('deleteBtnWrap').style.display = 'none';
  }

  document.getElementById('checkinModal').classList.add('show');
}

function closeModal() {
  document.getElementById('checkinModal').classList.remove('show');
  currentEventId = null;
  tempPhotoData = null;
}

function submitCheckin() {
  if (!currentEventId) return;
  var date = document.getElementById('checkinDate').value;
  var note = document.getElementById('checkinNote').value.trim();

  checkinData[currentEventId] = {
    date: date,
    photo: tempPhotoData,
    note: note,
    timestamp: Date.now()
  };

  saveData();
  closeModal();
  renderList();
  updateProgress();
  showToast('🌟 打卡成功！');
}

function deleteCheckin() {
  if (!currentEventId) return;
  delete checkinData[currentEventId];
  saveData();
  closeModal();
  renderList();
  updateProgress();
  showToast('已删除打卡记录');
}

// ========== PHOTO ==========
function handlePhoto(e) {
  var file = e.target.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) {
    showToast('⚠️ 照片不能超过 5MB');
    return;
  }
  var reader = new FileReader();
  reader.onload = function(ev) {
    compressImage(ev.target.result, 600, 0.65).then(function(compressed) {
      tempPhotoData = compressed;
      showPhotoPreview(compressed);
    });
  };
  reader.readAsDataURL(file);
}

function compressImage(dataUrl, maxW, quality) {
  return new Promise(function(resolve) {
    var img = new Image();
    img.onload = function() {
      var w = img.width, h = img.height;
      if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = dataUrl;
  });
}

function showPhotoPreview(dataUrl) {
  var upload = document.getElementById('photoUpload');
  var preview = document.getElementById('photoPreview');
  preview.src = dataUrl;
  upload.classList.add('has-photo');
}

function clearPhotoPreview() {
  var upload = document.getElementById('photoUpload');
  var preview = document.getElementById('photoPreview');
  preview.src = '';
  upload.classList.remove('has-photo');
  document.getElementById('photoInput').value = '';
  tempPhotoData = null;
}

function removePhoto(e) {
  e.stopPropagation();
  tempPhotoData = null;
  clearPhotoPreview();
}

// ========== TABS ==========
function switchTab(tab) {
  document.getElementById('mainList').classList.toggle('hidden', tab !== 'list');
  document.getElementById('timelineView').classList.toggle('show', tab === 'timeline');
  document.getElementById('statsView').classList.toggle('show', tab === 'stats');
  document.getElementById('tabList').classList.toggle('active', tab === 'list');
  document.getElementById('tabTimeline').classList.toggle('active', tab === 'timeline');
  document.getElementById('tabStats').classList.toggle('active', tab === 'stats');
  document.getElementById('tabData').classList.toggle('active', false);

  if (tab === 'timeline') renderTimeline();
  if (tab === 'stats') renderStats();
}

// ========== TIMELINE ==========
function renderTimeline() {
  var container = document.getElementById('timelineView');
  var entries = [];
  ALL_EVENTS.forEach(function(ev) {
    var data = checkinData[ev.id];
    if (data && data.date) {
      entries.push({ id: ev.id, chapter: ev.chapter, name: ev.name, date: data.date, photo: data.photo, note: data.note });
    }
  });

  entries.sort(function(a, b) {
    if (a.date > b.date) return -1;
    if (a.date < b.date) return 1;
    return 0;
  });

  if (entries.length === 0) {
    container.innerHTML = '<div class="timeline-empty">🌱<br>还没有打卡记录<br>去清单里点亮你的第一个经历吧</div>';
    return;
  }

  container.innerHTML = entries.map(function(ev) {
    var ch = CHAPTERS[ev.chapter];
    var dateParts = ev.date.split('-');
    var photoHtml = ev.photo ? '<img class="timeline-photo" src="' + ev.photo + '" onclick="viewPhoto(\'' + ev.id + '\')">' : '';
    var noteHtml = ev.note ? '<div class="timeline-note">💬 ' + escapeHtml(ev.note) + '</div>' : '';
    return '' +
      '<div class="timeline-item">' +
        '<div class="timeline-date">' +
          '<div class="timeline-day">' + parseInt(dateParts[2]) + '</div>' +
          '<div class="timeline-month">' + dateParts[0] + '年' + parseInt(dateParts[1]) + '月</div>' +
        '</div>' +
        '<div class="timeline-info">' +
          '<div class="timeline-chapter">' + ch.icon + ' ' + ch.title + '</div>' +
          '<div class="timeline-name">' + escapeHtml(ev.name) + '</div>' +
          noteHtml +
          photoHtml +
        '</div>' +
      '</div>';
  }).join('');
}

function viewPhoto(eventId) {
  var data = checkinData[eventId];
  if (data && data.photo) {
    document.getElementById('photoViewerImg').src = data.photo;
    document.getElementById('photoViewer').classList.add('show');
  }
}

function closePhotoViewer() {
  document.getElementById('photoViewer').classList.remove('show');
}

// ========== STATS ==========
function renderStats() {
  var container = document.getElementById('statsView');
  var done = Object.keys(checkinData).length;
  var pct = TOTAL > 0 ? Math.round(done / TOTAL * 100) : 0;

  var chapterStats = CHAPTERS.map(function(ch, ci) {
    var count = 0;
    ch.events.forEach(function(_, ei) { if (checkinData[ci + '-' + ei]) count++; });
    return { title: ch.title, icon: ch.icon, count: count, total: ch.events.length };
  });

  var photoCount = 0;
  Object.keys(checkinData).forEach(function(k) { if (checkinData[k].photo) photoCount++; });

  var recentDate = '';
  Object.keys(checkinData).forEach(function(k) {
    var d = checkinData[k].date;
    if (d && (!recentDate || d > recentDate)) recentDate = d;
  });

  var completedChapters = 0;
  chapterStats.forEach(function(s) { if (s.count === s.total) completedChapters++; });

  container.innerHTML = '' +
    '<div class="stats-hero">' +
      '<div class="stats-hero-num">' + done + '</div>' +
      '<div class="stats-hero-label">共 ' + TOTAL + ' 个经历，已完成 ' + pct + '%</div>' +
      '<div class="stats-hero-bar"><div class="stats-hero-fill" style="width:' + pct + '%"></div></div>' +
    '</div>' +
    '<div class="stats-card">' +
      '<div class="stats-card-title">📊 各章节完成度</div>' +
      '<div class="stats-chart">' +
        chapterStats.map(function(s) {
          var h = s.total > 0 ? Math.max(4, Math.round(s.count / s.total * 90)) : 4;
          return '' +
            '<div class="stats-bar-wrap">' +
              '<div class="stats-bar" style="height:' + h + 'px"></div>' +
              '<div class="stats-bar-label">' + s.icon + '<br>' + s.count + '/' + s.total + '</div>' +
            '</div>';
        }).join('') +
      '</div>' +
    '</div>' +
    '<div class="stats-card">' +
      '<div class="stats-grid">' +
        '<div class="stats-grid-item">' +
          '<div class="stats-grid-num">' + photoCount + '</div>' +
          '<div class="stats-grid-label">照片记录</div>' +
        '</div>' +
        '<div class="stats-grid-item">' +
          '<div class="stats-grid-num">' + (recentDate ? recentDate.replace(/-/g, '.') : '-') + '</div>' +
          '<div class="stats-grid-label">最近打卡</div>' +
        '</div>' +
        '<div class="stats-grid-item">' +
          '<div class="stats-grid-num">' + completedChapters + '</div>' +
          '<div class="stats-grid-label">已完成章节</div>' +
        '</div>' +
      '</div>' +
    '</div>';
}

// ========== DATA MANAGEMENT ==========
function showDataPanel() {
  document.getElementById('dataModal').classList.add('show');
}
function closeDataPanel() {
  document.getElementById('dataModal').classList.remove('show');
}

function exportData() {
  var dataStr = JSON.stringify(checkinData, null, 2);
  var blob = new Blob([dataStr], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = '人生打卡备份_' + new Date().toISOString().split('T')[0] + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('📤 数据已导出');
}

function importData(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    try {
      var imported = JSON.parse(ev.target.result);
      var count = Object.keys(imported).length;
      if (confirm('即将导入 ' + count + ' 条打卡记录\n\n确定 = 覆盖当前数据\n取消 = 合并数据')) {
        checkinData = imported;
      } else {
        Object.keys(imported).forEach(function(k) { checkinData[k] = imported[k]; });
      }
      saveData();
      renderList();
      updateProgress();
      showToast('📥 数据导入成功！');
    } catch(err) {
      showToast('⚠️ 文件格式不正确');
    }
  };
  reader.readAsText(file);
  document.getElementById('importInput').value = '';
  closeDataPanel();
}

function confirmClearData() {
  if (confirm('确定要清除所有打卡数据吗？\n\n此操作不可恢复！')) {
    checkinData = {};
    saveData();
    renderList();
    updateProgress();
    showToast('🗑️ 所有数据已清除');
    closeDataPanel();
  }
}

// ========== TOAST ==========
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 1800);
}

// ========== START ==========
init();
