  document.getElementById('ritualOverlay').classList.remove('show');
  // 检查是否有待显示的章节成就
  if (pendingAchievement >= 0) {
    setTimeout(function() { showAchievement(pendingAchievement); }, 300);
  } else {
    renderList();
    updateProgress();
  }
}

function spawnPetals(count) {
  var petals = ['🌸','🏵️','💮','🪷','🌺','✿'];
  for (var i = 0; i < count; i++) {
    (function(delay) {
      setTimeout(function() {
        var el = document.createElement('div');
        el.className = 'petal';
        el.textContent = petals[Math.floor(Math.random() * petals.length)];
        el.style.left = Math.random() * 100 + 'vw';
        el.style.top = '-30px';
        el.style.fontSize = (16 + Math.random() * 14) + 'px';
        el.style.animationDuration = (2.5 + Math.random() * 2) + 's';
        el.style.animationDelay = '0s';
        document.body.appendChild(el);
        setTimeout(function() { el.remove(); }, 5000);
      }, delay);
    })(i * 80);
  }
}

// ========== DAILY RECOMMEND ==========
function pickDailyRecommend() {
  var today = new Date().toISOString().split('T')[0];
  var saved = localStorage.getItem('lifeCheckinDaily');
  if (saved) {
    try {
      var obj = JSON.parse(saved);
      if (obj.date === today && ALL_EVENTS.some(function(e) { return e.id === obj.id; })) {
        // 检查今日推荐是否已完成，若完成则重新选
        if (!checkinData[obj.id]) return obj.id;
      }
    } catch(e) {}
  }
  // 选一个未完成的
  var pool = ALL_EVENTS.filter(function(e) { return !checkinData[e.id]; });
  if (pool.length === 0) return null;
  var pick = pool[Math.floor(Math.random() * pool.length)];
  localStorage.setItem('lifeCheckinDaily', JSON.stringify({ date: today, id: pick.id }));
  return pick.id;
}

// ========== CHAPTER ACHIEVEMENT ==========
var pendingAchievement = -1;

function checkChapterAchievement(chapterIdx) {
  var ch = CHAPTERS[chapterIdx];
  if (!ch) return;
  var allDone = ch.events.every(function(_, ei) { return !!checkinData[chapterIdx + '-' + ei]; });
  if (allDone) {
    pendingAchievement = chapterIdx;
  }
}

function showAchievement(chapterIdx) {
  var ch = CHAPTERS[chapterIdx];
  if (!ch) return;
  document.getElementById('achievementIcon').textContent = ch.icon;
  document.getElementById('achievementTitle').textContent = '🎊 章节圆满完成！';
  document.getElementById('achievementSub').textContent = '「' + ch.title + '」的所有经历都已打卡，太了不起！';
  document.getElementById('achievementOverlay').classList.add('show');
  spawnStars(12);
}

function closeAchievement() {
  document.getElementById('achievementOverlay').classList.remove('show');
  pendingAchievement = -1;
}

function spawnStars(count) {
  var stars = ['⭐','🌟','✨','💫','⚡','🔆'];
  var centerX = window.innerWidth / 2;
  var centerY = window.innerHeight / 2;
  for (var i = 0; i < count; i++) {
    (function(idx) {
      setTimeout(function() {
        var el = document.createElement('div');
        el.className = 'achievement-star';
        el.textContent = stars[Math.floor(Math.random() * stars.length)];
        el.style.left = centerX + 'px';
        el.style.top = centerY + 'px';
        var angle = (idx / count) * Math.PI * 2 + Math.random() * 0.5;
        var dist = 80 + Math.random() * 120;
        el.style.setProperty('--sx', Math.cos(angle) * dist + 'px');
        el.style.setProperty('--sy', Math.sin(angle) * dist + 'px');
        document.body.appendChild(el);
        setTimeout(function() { el.remove(); }, 1200);
      }, idx * 60);
    })(i);
  }
}

// ========== TOAST ==========
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 1800);
}

// ========== THEME TOOGLE ==========
function toggleTheme() {
  var html = document.documentElement;
  var isDark = html.classList.contains('dark-theme');
  // 添加过渡动画类
  html.classList.add('theme-transitioning');
  setTimeout(function() { html.classList.remove('theme-transitioning'); }, 500);

  if (isDark) {
    html.classList.remove('dark-theme');
    document.getElementById('themeToggle').textContent = '🌙';
    localStorage.setItem('lifeCheckinTheme', 'light');
  } else {
    html.classList.add('dark-theme');
    document.getElementById('themeToggle').textContent = '☀️';
    localStorage.setItem('lifeCheckinTheme', 'dark');
  }
}

function loadTheme() {
  var saved = localStorage.getItem('lifeCheckinTheme');
  if (saved === 'dark') {
    document.documentElement.classList.add('dark-theme');
    var btn = document.getElementById('themeToggle');
    if (btn) btn.textContent = '☀️';
  }
}

// ========== START ==========
loadTheme();
init();
</script>
