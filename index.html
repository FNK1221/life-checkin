<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>人生经历打卡</title>
<style>
  /* ========== LOADING SCREEN ========== */
  #loadingScreen {
    position: fixed;
    inset: 0;
    z-index: 99999;
    background: #1a0e0a;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.8s ease;
  }
  #loadingScreen.fade-out { opacity: 0; pointer-events: none; }
  #loadingCanvas { display: block; }
  #loadingText {
    position: absolute;
    bottom: 18%;
    left: 50%;
    transform: translateX(-50%);
    color: #fce8d8;
    font-size: 16px;
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.5s;
    text-align: center;
    white-space: nowrap;
    text-shadow: 0 0 12px rgba(255,200,150,0.5);
    letter-spacing: 2px;
  }
  #loadingText.show { opacity: 1; }
  #loadingHint {
    position: absolute;
    bottom: 10%;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(252,232,216,0.4);
    font-size: 12px;
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:0.7} }
  
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  :root {
    --bg: #fdf8f4;
    --card: #ffffff;
    --card-alt: #fefaf6;
    --primary: #c47a5e;
    --primary-light: #d4957a;
    --primary-dark: #a8624a;
    --accent: #fce8d8;
    --accent2: #f5d8c5;
    --text: #3e2d23;
    --text-light: #8b6f5e;
    --text-muted: #b5a090;
    --border: #f0ddd0;
    --success: #7cb89a;
    --danger: #d4837a;
    --danger-bg: #fdf0ef;
    --shadow: 0 2px 16px rgba(180, 140, 100, 0.10);
    --shadow-hover: 0 4px 20px rgba(180, 140, 100, 0.18);
    --radius: 16px;
    --radius-sm: 10px;
  }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 80px;
    -webkit-font-smoothing: antialiased;
  }
  
  /* ========== HEADER ========== */
  .header {
    background: linear-gradient(145deg, #d4a574 0%, #c47a5e 50%, #b86248 100%);
    padding: 24px 16px 28px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(160, 100, 60, 0.25);
  }
  .header h1 {
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 1px;
    margin-bottom: 14px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.12);
  }
  .progress-outer {
    background: rgba(255,255,255,0.22);
    border-radius: 20px;
    height: 12px;
    overflow: hidden;
    margin: 0 auto 8px;
    max-width: 300px;
    backdrop-filter: blur(4px);
  }
  .progress-inner {
    height: 100%;
    border-radius: 20px;
    background: linear-gradient(90deg, #fce8d8, #ffffff);
    transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    width: 0%;
    position: relative;
  }
  .progress-inner::after {
    content: '';
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 30px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5));
    border-radius: 20px;
  }
  .progress-text {
    font-size: 12px;
    color: rgba(255,255,255,0.92);
    font-weight: 500;
    letter-spacing: 0.5px;
  }
  
  /* ========== CHAPTER ========== */
  .chapter {
    margin: 14px 12px 0;
    border-radius: var(--radius);
    background: var(--card);
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: box-shadow 0.2s;
  }
  .chapter:first-child { margin-top: 12px; }
  .chapter-header {
    display: flex;
    align-items: center;
    padding: 15px 16px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    transition: background 0.2s;
  }
  .chapter-header:active { background: var(--card-alt); }
  .chapter-icon {
    font-size: 22px;
    margin-right: 11px;
    flex-shrink: 0;
    width: 28px;
    text-align: center;
  }
  .chapter-body { flex: 1; min-width: 0; }
  .chapter-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
  }
  .chapter-sub {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .chapter-right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    margin-left: 8px;
  }
  .chapter-count {
    font-size: 12px;
    color: var(--primary);
    font-weight: 600;
    background: var(--accent);
    padding: 2px 9px;
    border-radius: 20px;
  }
  .chapter-arrow {
    font-size: 11px;
    color: var(--text-muted);
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    display: inline-block;
  }
  .chapter.open .chapter-arrow { transform: rotate(180deg); }
  .chapter-items {
    display: none;
    padding: 0 10px 10px;
  }
  .chapter.open .chapter-items { display: block; }
  
  /* ========== EVENT ITEM ========== */
  .event-item {
    display: flex;
    align-items: flex-start;
    padding: 12px 10px;
    border-radius: var(--radius-sm);
    margin-bottom: 4px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  .event-item:active { background: var(--accent); transform: scale(0.985); }
  .event-check {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2.2px solid var(--border);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 10px;
    margin-top: 1px;
    transition: all 0.3s;
    font-size: 13px;
    background: var(--card);
  }
  .event-item.checked .event-check {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
    box-shadow: 0 2px 8px rgba(196, 122, 94, 0.35);
  }
  .event-info { flex: 1; min-width: 0; padding-top: 1px; }
  .event-name {
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
  }
  .event-item.checked .event-name {
    color: var(--text-muted);
    text-decoration: line-through;
    text-decoration-color: var(--border);
    text-decoration-thickness: 1.5px;
  }
  .event-meta {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .event-meta span { white-space: nowrap; }
  
  /* ========== MODAL ========== */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(62, 45, 35, 0.45);
    z-index: 1000;
    align-items: flex-end;
    justify-content: center;
    backdrop-filter: blur(2px);
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--card);
    border-radius: 22px 22px 0 0;
    width: 100%;
    max-width: 500px;
    max-height: 88vh;
    overflow-y: auto;
    padding: 28px 20px 36px;
    animation: slideUp 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    -webkit-overflow-scrolling: touch;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); opacity: 0.8; }
    to { transform: translateY(0); opacity: 1; }
  }
  .modal-title {
    font-size: 18px;
    font-weight: 700;
    text-align: center;
    color: var(--text);
    margin-bottom: 4px;
  }
  .modal-subtitle {
    font-size: 12px;
    color: var(--text-muted);
    text-align: center;
    margin-bottom: 20px;
  }
  .modal-event-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--primary);
    text-align: center;
    margin-bottom: 22px;
    padding: 12px 14px;
    background: var(--accent);
    border-radius: 12px;
    line-height: 1.5;
  }
  
  /* ========== FORM ========== */
  .form-group { margin-bottom: 18px; }
  .form-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-light);
    margin-bottom: 7px;
    display: block;
    padding-left: 2px;
  }
  .form-input {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 15px;
    color: var(--text);
    background: var(--card-alt);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    font-family: inherit;
    -webkit-appearance: none;
  }
  .form-input:focus {
    border-color: var(--primary-light);
    box-shadow: 0 0 0 3px rgba(196, 122, 94, 0.12);
  }
  
  /* ========== PHOTO UPLOAD ========== */
  .photo-upload {
    width: 100%;
    min-height: 130px;
    border: 2px dashed var(--border);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    overflow: hidden;
    position: relative;
    background: var(--card-alt);
  }
  .photo-upload:active { background: var(--accent); }
  .photo-upload.has-photo { border-style: solid; border-color: var(--accent2); }
  .photo-upload-icon { font-size: 30px; opacity: 0.35; }
  .photo-upload-text { font-size: 13px; color: var(--text-muted); margin-top: 6px; }
  .photo-preview {
    width: 100%;
    height: 210px;
    object-fit: cover;
    display: none;
    border-radius: 12px;
  }
  .photo-upload.has-photo .photo-preview { display: block; }
  .photo-upload.has-photo .photo-upload-icon,
  .photo-upload.has-photo .photo-upload-text { display: none; }
  .photo-remove {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 30px;
    height: 30px;
    background: rgba(62, 45, 35, 0.6);
    color: #fff;
    border: none;
    border-radius: 50%;
    font-size: 14px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }
  .photo-upload.has-photo .photo-remove { display: flex; }
  
  /* ========== BUTTONS ========== */
  .btn-row { display: flex; gap: 12px; margin-top: 22px; }
  .btn {
    flex: 1;
    padding: 13px 0;
    border: none;
    border-radius: 13px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { opacity: 0.75; transform: scale(0.97); }
  .btn-cancel { background: var(--card-alt); color: var(--text-light); border: 1.5px solid var(--border); }
  .btn-primary {
    background: linear-gradient(145deg, var(--primary-light), var(--primary-dark));
    color: #fff;
    box-shadow: 0 4px 14px rgba(196, 122, 94, 0.3);
  }
  .btn-danger { background: var(--danger-bg); color: var(--danger); border: 1.5px solid #f0d0cc; }
  .btn-delete-wrap { margin-top: 12px; }
  
  /* ========== BOTTOM BAR ========== */
  .bottom-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 -1px 12px rgba(0,0,0,0.05);
    display: flex;
    justify-content: space-around;
    padding: 10px 6px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    z-index: 100;
    border-top: 1px solid rgba(240, 221, 208, 0.5);
  }
  .bottom-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 10px;
    cursor: pointer;
    padding: 5px 14px;
    border-radius: 10px;
    transition: all 0.2s;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .bottom-btn:active { background: var(--accent); }
  .bottom-btn .icon { font-size: 20px; margin-bottom: 2px; line-height: 1; }
  .bottom-btn.active { color: var(--primary); }
  .bottom-btn.active .icon { filter: drop-shadow(0 1px 2px rgba(196,122,94,0.3)); }
  
  /* ========== TIMELINE VIEW ========== */
  .timeline-view { display: none; padding: 12px; }
  .timeline-view.show { display: block; }
  .main-list { display: block; }
  .main-list.hidden { display: none; }
  
  .timeline-item {
    display: flex;
    gap: 12px;
    margin-bottom: 14px;
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px;
    transition: box-shadow 0.2s;
  }
  .timeline-item:active { box-shadow: var(--shadow-hover); }
  .timeline-date {
    flex-shrink: 0;
    width: 54px;
    text-align: center;
    background: var(--accent);
    border-radius: 12px;
    padding: 10px 4px;
  }
  .timeline-day { font-size: 24px; font-weight: 800; color: var(--primary); line-height: 1; }
  .timeline-month { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
  .timeline-info { flex: 1; min-width: 0; }
  .timeline-chapter { font-size: 11px; color: var(--primary-light); margin-bottom: 4px; font-weight: 500; }
  .timeline-name { font-size: 14px; line-height: 1.5; color: var(--text); }
  .timeline-note {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 6px;
    padding: 6px 10px;
    background: var(--card-alt);
    border-radius: 8px;
    line-height: 1.5;
  }
  .timeline-photo {
    width: 100%;
    max-height: 190px;
    object-fit: cover;
    border-radius: 10px;
    margin-top: 10px;
  }
  .timeline-empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
    font-size: 14px;
    line-height: 1.8;
  }
  
  /* ========== STATS VIEW ========== */
  .stats-view { display: none; padding: 12px; }
  .stats-view.show { display: block; }
  
  .stats-hero {
    background: linear-gradient(145deg, #d4a574, #c47a5e, #b86248);
    border-radius: var(--radius);
    padding: 32px 20px;
    text-align: center;
    color: #fff;
    box-shadow: 0 6px 24px rgba(160, 100, 60, 0.3);
    margin-bottom: 14px;
  }
  .stats-hero-num { font-size: 52px; font-weight: 800; line-height: 1; letter-spacing: -2px; }
  .stats-hero-label { font-size: 13px; opacity: 0.85; margin-top: 6px; }
  .stats-hero-bar {
    background: rgba(255,255,255,0.2);
    border-radius: 20px;
    height: 8px;
    margin: 16px auto 0;
    max-width: 220px;
    overflow: hidden;
  }
  .stats-hero-fill {
    height: 100%;
    border-radius: 20px;
    background: #fff;
    transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }
  
  .stats-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px;
    margin-bottom: 12px;
  }
  .stats-card-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 14px;
  }
  .stats-chart {
    display: flex;
    align-items: flex-end;
    gap: 5px;
    height: 110px;
    padding: 0 2px;
  }
  .stats-bar-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100%;
    justify-content: flex-end;
  }
  .stats-bar {
    width: 100%;
    max-width: 30px;
    border-radius: 6px 6px 0 0;
    min-height: 3px;
    background: linear-gradient(0deg, var(--primary), var(--primary-light));
    transition: height 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .stats-bar-label {
    font-size: 9px;
    color: var(--text-muted);
    margin-top: 5px;
    text-align: center;
    line-height: 1.2;
  }
  
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    text-align: center;
  }
  .stats-grid-item { padding: 10px 4px; }
  .stats-grid-num {
    font-size: 22px;
    font-weight: 800;
    color: var(--primary);
    line-height: 1;
  }
  .stats-grid-label { font-size: 11px; color: var(--text-muted); margin-top: 5px; }
  
  /* ========== DATA PANEL ========== */
  .data-section {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 16px;
    margin: 12px;
  }
  .data-section h3 {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 6px;
    color: var(--text);
  }
  .data-section-desc {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 18px;
    line-height: 1.6;
  }
  .data-btn {
    display: block;
    width: 100%;
    padding: 13px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    background: var(--card-alt);
    color: var(--text);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    margin-bottom: 10px;
    text-align: center;
    transition: all 0.15s;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .data-btn:active { background: var(--accent); transform: scale(0.98); }
  .data-btn.primary {
    background: linear-gradient(145deg, var(--primary-light), var(--primary-dark));
    color: #fff;
    border-color: transparent;
    box-shadow: 0 4px 14px rgba(196,122,94,0.3);
  }
  .data-btn.danger {
    background: var(--danger-bg);
    color: var(--danger);
    border-color: #f0d0cc;
  }
  
  /* ========== PHOTO VIEWER ========== */
  .photo-viewer {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(30, 20, 15, 0.95);
    z-index: 2000;
    align-items: center;
    justify-content: center;
    padding: 20px;
    backdrop-filter: blur(8px);
  }
  .photo-viewer.show { display: flex; }
  .photo-viewer img {
    max-width: 100%;
    max-height: 85vh;
    border-radius: 10px;
    object-fit: contain;
  }
  .photo-viewer-hint {
    position: absolute;
    bottom: 40px;
    color: rgba(255,255,255,0.4);
    font-size: 12px;
  }
  
  /* ========== TOAST ========== */
  .toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(62, 45, 35, 0.88);
    backdrop-filter: blur(8px);
    color: #fff;
    padding: 12px 26px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 500;
    z-index: 9999;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }
  
  /* ========== SCROLLBAR ========== */
  ::-webkit-scrollbar { width: 0; height: 0; }
  * { scrollbar-width: none; }
</style>
</head>
<body>

<!-- ========== LOADING SCREEN ========== -->
<div id="loadingScreen">
  <canvas id="loadingCanvas"></canvas>
  <div id="loadingText"></div>
  <div id="loadingHint">正在孕育生命…</div>
</div>

<!-- HEADER -->
<div class="header">
  <h1>🌅 人生经历打卡</h1>
  <div class="progress-outer">
    <div class="progress-inner" id="progressFill"></div>
  </div>
  <div class="progress-text" id="progressText">已点亮 0 / 96 个经历</div>
</div>

<!-- MAIN LIST -->
<div class="main-list" id="mainList"></div>

<!-- TIMELINE VIEW -->
<div class="timeline-view" id="timelineView"></div>

<!-- STATS VIEW -->
<div class="stats-view" id="statsView"></div>

<!-- BOTTOM BAR -->
<div class="bottom-bar">
  <button class="bottom-btn active" onclick="switchTab('list')" id="tabList">
    <span class="icon">📋</span>清单
  </button>
  <button class="bottom-btn" onclick="switchTab('timeline')" id="tabTimeline">
    <span class="icon">🗓️</span>时光轴
  </button>
  <button class="bottom-btn" onclick="switchTab('stats')" id="tabStats">
    <span class="icon">📊</span>统计
  </button>
  <button class="bottom-btn" onclick="showDataPanel()" id="tabData">
    <span class="icon">⚙️</span>数据
  </button>
</div>

<!-- CHECK-IN MODAL -->
<div class="modal-overlay" id="checkinModal">
  <div class="modal">
    <div class="modal-title">✅ 打卡记录</div>
    <div class="modal-subtitle">记录这一刻，属于你的人生</div>
    <div class="modal-event-name" id="modalEventName"></div>
    <div class="form-group">
      <label class="form-label">📅 打卡日期</label>
      <input type="date" class="form-input" id="checkinDate">
    </div>
    <div class="form-group">
      <label class="form-label">📷 记录照片（可选）</label>
      <div class="photo-upload" id="photoUpload" onclick="document.getElementById('photoInput').click()">
        <span class="photo-upload-icon">📷</span>
        <span class="photo-upload-text">点击上传照片</span>
        <img class="photo-preview" id="photoPreview">
        <button class="photo-remove" onclick="removePhoto(event)">✕</button>
      </div>
      <input type="file" id="photoInput" accept="image/*" style="display:none" onchange="handlePhoto(event)">
    </div>
    <div class="form-group">
      <label class="form-label">💬 心情备注（可选）</label>
      <input type="text" class="form-input" id="checkinNote" placeholder="写点什么吧…" maxlength="100">
    </div>
    <div class="btn-row">
      <button class="btn btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="submitCheckin()">完成打卡</button>
    </div>
    <div class="btn-delete-wrap" id="deleteBtnWrap" style="display:none;">
      <button class="btn btn-danger" onclick="deleteCheckin()">🗑️ 删除此打卡记录</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="dataModal">
  <div class="modal">
    <div class="modal-title">⚙️ 数据管理</div>
    <div class="modal-subtitle">数据仅保存在本设备浏览器中</div>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:18px;">
      <button class="data-btn primary" onclick="exportData()">📤 导出数据（JSON 文件备份）</button>
      <button class="data-btn" onclick="document.getElementById('importInput').click()">📥 导入数据（恢复备份）</button>
      <input type="file" id="importInput" accept=".json" style="display:none" onchange="importData(event)">
      <button class="data-btn danger" onclick="confirmClearData()">🗑️ 清除所有打卡数据</button>
    </div>

  <img id="photoViewerImg">
  <div class="photo-viewer-hint">点击任意位置关闭</div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ========== LOADING ANIMATION ==========
(function(){
  const canvas = document.getElementById('loadingCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const screen = document.getElementById('loadingScreen');
  const textEl = document.getElementById('loadingText');

  function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
  resize();
  window.addEventListener('resize', resize);

  let frame = 0;
  let animDone = false;

  function loop(){
    if(animDone) return;
    frame++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const w = canvas.width, h = canvas.height;
    const cx = w/2, cy = h/2;

    if(frame < 100){
      // Phase 1: two dots approach from left and right
      const t = 1 - Math.pow(1 - frame/100, 3);
      const xLeft = -30 + (cx - 60 + 30) * t;
      const xRight = w + 30 - (w + 30 - (cx + 60)) * t;
      const dotY = cy;

      // Left dot (blue/purple - Yin)
      ctx.save();
      const g1 = ctx.createRadialGradient(xLeft, dotY, 0, xLeft, dotY, 30);
      g1.addColorStop(0, 'rgba(150,180,255,0.9)');
      g1.addColorStop(0.5, 'rgba(150,180,255,0.3)');
      g1.addColorStop(1, 'rgba(150,180,255,0)');
      ctx.fillStyle = g1;
      ctx.beginPath(); ctx.arc(xLeft, dotY, 30, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(150,180,255,0.95)';
      ctx.shadowColor = 'rgba(150,180,255,0.8)';
      ctx.shadowBlur = 15;
      ctx.beginPath(); ctx.arc(xLeft, dotY, 11, 0, Math.PI*2); ctx.fill();
      ctx.restore();

      // Right dot (orange/warm - Yang)
      ctx.save();
      const g2 = ctx.createRadialGradient(xRight, dotY, 0, xRight, dotY, 30);
      g2.addColorStop(0, 'rgba(255,180,100,0.9)');
      g2.addColorStop(0.5, 'rgba(255,180,100,0.3)');
      g2.addColorStop(1, 'rgba(255,180,100,0)');
      ctx.fillStyle = g2;
      ctx.beginPath(); ctx.arc(xRight, dotY, 30, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(255,180,100,0.95)';
      ctx.shadowColor = 'rgba(255,180,100,0.8)';
      ctx.shadowBlur = 15;
      ctx.beginPath(); ctx.arc(xRight, dotY, 11, 0, Math.PI*2); ctx.fill();
      ctx.restore();

    } else if(frame < 170){
      // Phase 2: merge + flash
      const t = (frame - 100) / 70;
      const flash = Math.sin(t * Math.PI);
      ctx.save();
      const g3 = ctx.createRadialGradient(cx, cy, 0, cx, cy, 80 + flash * 60);
      g3.addColorStop(0, 'rgba(255,220,170,0.9)');
      g3.addColorStop(0.4, 'rgba(255,200,140,0.4)');
      g3.addColorStop(1, 'rgba(255,200,140,0)');
      ctx.fillStyle = g3;
      ctx.beginPath(); ctx.arc(cx, cy, 80 + flash * 60, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(255,220,170,0.95)';
      ctx.shadowColor = 'rgba(255,200,140,0.8)';
      ctx.shadowBlur = 25 + flash * 20;
      ctx.beginPath(); ctx.arc(cx, cy, 18 + flash * 16, 0, Math.PI*2); ctx.fill();
      ctx.restore();

      // Sparkles
      if(frame % 3 === 0){
        for(let i = 0; i < 3; i++){
          const angle = Math.random() * Math.PI * 2;
          const dist = 15 + Math.random() * 50;
          ctx.fillStyle = `rgba(255,${180+Math.random()*60|0},${100+Math.random()*80|0},${0.3+Math.random()*0.4})`;
          ctx.beginPath(); ctx.arc(cx + Math.cos(angle)*dist, cy + Math.sin(angle)*dist, 2+Math.random()*3, 0, Math.PI*2); ctx.fill();
        }
      }

    } else if(frame < 280){
      // Phase 3: glowing ball transforms into amniotic sac with developing fetus
      const t = (frame - 170) / 110;
      const t2 = Math.pow(t, 0.7);  // ease-in curve

      // ---- Amniotic sac (translucent, watery) ----
      const sacW = 100 + t2 * 140;
      const sacH = 120 + t2 * 160;
      // sac glow
      const sacGlow = ctx.createRadialGradient(cx, cy + 10, 0, cx, cy + 10, sacW * 0.8);
      sacGlow.addColorStop(0, `rgba(180,220,255,${0.08 + t2*0.12})`);
      sacGlow.addColorStop(0.6, `rgba(140,200,240,${0.04 + t2*0.06})`);
      sacGlow.addColorStop(1, 'rgba(140,200,240,0)');
      ctx.fillStyle = sacGlow;
      ctx.beginPath(); ctx.ellipse(cx, cy + 10, sacW * 0.8, sacH * 0.8, 0, 0, Math.PI*2); ctx.fill();

      // sac wall (translucent membrane)
      ctx.save();
      ctx.globalAlpha = 0.12 + t2 * 0.18;
      ctx.strokeStyle = 'rgba(160,210,255,0.7)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(cx, cy + 10, sacW * 0.48, sacH * 0.48, 0, 0, Math.PI*2);
      ctx.stroke();
      // inner membrane hint
      ctx.globalAlpha = 0.06 + t2 * 0.08;
      ctx.strokeStyle = 'rgba(200,230,255,0.5)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.ellipse(cx, cy + 10, sacW * 0.52, sacH * 0.52, 0, 0, Math.PI*2);
      ctx.stroke();
      ctx.restore();

      // ---- Amniotic fluid ripples / light refraction ----
      if(t > 0.2){
        ctx.save();
        ctx.globalAlpha = 0.06 + Math.sin(frame*0.08)*0.03;
        for(let r = 0; r < 3; r++){
          const rr = 30 + r * 25 + Math.sin(frame*0.04 + r)*8;
          ctx.strokeStyle = 'rgba(180,220,255,0.4)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.ellipse(cx + Math.sin(frame*0.02+r)*5, cy + 10 + Math.cos(frame*0.03+r)*3, rr, rr*1.15, 0, 0, Math.PI*2);
          ctx.stroke();
        }
        ctx.restore();
      }

      // ---- Umbilical cord (visible from t > 0.35) ----
      if(t > 0.35){
        const ucAlpha = Math.min(1, (t - 0.35)/0.2);
        ctx.save();
        ctx.globalAlpha = ucAlpha * 0.55;
        ctx.strokeStyle = 'rgba(180,100,80,0.8)';
        ctx.lineWidth = 4 + Math.sin(frame*0.1)*1;
        ctx.lineCap = 'round';
        ctx.beginPath();
        // cord from top-center into fetus belly area
        const cx1 = cx + Math.sin(frame*0.05)*8;
        const cy1 = cy - sacH*0.38 + Math.sin(frame*0.07)*5;
        ctx.moveTo(cx, cy - sacH*0.46);
        ctx.quadraticCurveTo(cx - 15, cy - sacH*0.30, cx1, cy1);
        ctx.stroke();
        ctx.restore();
      }

      // ---- Fetus body (developing, curled in fetal position) ----
      if(t > 0.2){
        const ft = Math.min(1, (t - 0.2)/0.6);  // fetus appear t
        const fAlpha = ft * 0.85;
        const fScale = 0.3 + ft * 0.7;

        ctx.save();
        ctx.globalAlpha = fAlpha;
        ctx.translate(cx, cy + 10);
        ctx.scale(fScale, fScale);

        // -- Fetus skin tone (pinkish, translucent) --
        const skinColor = 'rgba(245,210,200,0.85)';
        const skinLight = 'rgba(255,225,215,0.9)';

        // -- Spine / body curl: draw fetus curled to the side --
        // Fetus in typical intrauterine position: head large, limbs curled

        // ** Head (proportionally large, ~1/3 of body size) **
        const hx = 0, hy = -52;
        const hr = 28;
        const headGrad = ctx.createRadialGradient(hx - 6, hy - 8, 2, hx, hy, hr);
        headGrad.addColorStop(0, skinLight);
        headGrad.addColorStop(1, skinColor);
        ctx.fillStyle = headGrad;
        ctx.beginPath(); ctx.arc(hx, hy, hr, 0, Math.PI*2); ctx.fill();

        // Fontanelle (soft spot on baby skull) — subtle darker area
        ctx.fillStyle = 'rgba(230,190,180,0.4)';
        ctx.beginPath(); ctx.arc(hx - 2, hy - 10, 10, 0, Math.PI*2); ctx.fill();

        // ** Eyes (fetal eyes are closed or barely formed) **
        ctx.fillStyle = 'rgba(200,170,160,0.6)';
        ctx.beginPath(); ctx.ellipse(hx - 9, hy + 2, 5, 2.5, 0, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(hx + 9, hy + 2, 5, 2.5, 0, 0, Math.PI*2); ctx.fill();

        // ** Ears **
        ctx.fillStyle = skinColor;
        ctx.beginPath(); ctx.ellipse(hx - 26, hy + 2, 6, 9, -0.15, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(hx + 26, hy + 2, 6, 9, 0.15, 0, Math.PI*2); ctx.fill();

        // ** Body (chest + abdomen, curled) **
        ctx.fillStyle = skinColor;
        ctx.beginPath();
        // torso ellipse, tilted
        ctx.ellipse(0, 8, 30, 38, 0.12, 0, Math.PI*2);
        ctx.fill();

        // belly button area (subtle)
        ctx.fillStyle = 'rgba(230,190,180,0.35)';
        ctx.beginPath(); ctx.arc(0, 22, 5, 0, Math.PI*2); ctx.fill();

        // ** Arms (curled, hands near face) **
        ctx.strokeStyle = skinColor;
        ctx.lineWidth = 12;
        ctx.lineCap = 'round';
        // left arm
        ctx.beginPath();
        ctx.moveTo(-18, -18);
        ctx.quadraticCurveTo(-38, -30, -30, -42);
        ctx.stroke();
        // right arm
        ctx.beginPath();
        ctx.moveTo(18, -18);
        ctx.quadraticCurveTo(38, -30, 30, -42);
        ctx.stroke();
        // hands (small, near face)
        ctx.fillStyle = skinLight;
        ctx.beginPath(); ctx.arc(-30, -44, 7, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc( 30, -44, 7, 0, Math.PI*2); ctx.fill();

        // ** Legs (curled up, knees toward chest) **
        ctx.lineWidth = 13;
        // left leg
        ctx.beginPath();
        ctx.moveTo(-12, 40);
        ctx.quadraticCurveTo(-28, 55, -22, 72);
        ctx.stroke();
        // right leg
        ctx.beginPath();
        ctx.moveTo(12, 40);
        ctx.quadraticCurveTo(28, 55, 22, 72);
        ctx.stroke();
        // feet
        ctx.fillStyle = skinColor;
        ctx.beginPath(); ctx.ellipse(-22, 74, 8, 5, 0.3, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse( 22, 74, 8, 5, -0.3, 0, Math.PI*2); ctx.fill();

        // -- Umbilical cord attachment to belly --
        if(t > 0.4){
          ctx.strokeStyle = 'rgba(180,100,80,0.7)';
          ctx.lineWidth = 5;
          ctx.beginPath();
          ctx.moveTo(0, 20);
          ctx.quadraticCurveTo(8, 35, 0, 50);
          ctx.stroke();
        }

        ctx.restore();
      }

      // ---- Fluid bubbles / particles ----
      if(frame % 4 === 0 && t > 0.3){
        for(let i = 0; i < 2; i++){
          const bx = cx + (Math.random() - 0.5) * sacW * 0.7;
          const by = (cy + 10) + (Math.random() - 0.5) * sacH * 0.7;
          const br = 1.5 + Math.random() * 3;
          ctx.fillStyle = `rgba(200,230,255,${0.15 + Math.random()*0.2})`;
          ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI*2); ctx.fill();
        }
      }

    } else if(frame < 370){
      // Phase 4: fetus fully visible in amniotic fluid, realistic detail
      const t = (frame - 280) / 90;
      const sacW = 240 + Math.sin(frame*0.03) * 8;
      const sacH = 280 + Math.sin(frame*0.04) * 10;

      // ---- Amniotic sac (prominent, translucent) ----
      // outer glow
      const sacGlow2 = ctx.createRadialGradient(cx, cy + 10, 0, cx, cy + 10, sacW * 0.75);
      sacGlow2.addColorStop(0, 'rgba(180,220,255,0.13)');
      sacGlow2.addColorStop(0.5, 'rgba(160,210,250,0.06)');
      sacGlow2.addColorStop(1, 'rgba(160,210,250,0)');
      ctx.fillStyle = sacGlow2;
      ctx.beginPath(); ctx.ellipse(cx, cy + 10, sacW*0.75, sacH*0.75, 0, 0, Math.PI*2); ctx.fill();

      // sac membrane
      ctx.save();
      ctx.globalAlpha = 0.22;
      ctx.strokeStyle = 'rgba(170,215,255,0.8)';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.ellipse(cx, cy + 10, sacW*0.48, sacH*0.48, 0, 0, Math.PI*2);
      ctx.stroke();
      ctx.restore();

      // ---- Light refraction ripples on sac ----
      ctx.save();
      ctx.globalAlpha = 0.07 + Math.sin(frame*0.06)*0.03;
      ctx.strokeStyle = 'rgba(200,235,255,0.6)';
      ctx.lineWidth = 1.2;
      for(let r = 0; r < 4; r++){
        const rr = 20 + r * 22 + Math.sin(frame*0.05 + r*1.5)*6;
        ctx.beginPath();
        ctx.ellipse(cx + Math.sin(frame*0.03+r)*4, cy + 10, rr, rr*1.12, r*0.3, 0, Math.PI*2);
        ctx.stroke();
      }
      ctx.restore();

      // ---- Fetus (realistic, fully detailed, curled) ----
      ctx.save();
      ctx.globalAlpha = 0.92;
      ctx.translate(cx, cy + 10);
      // subtle breathing/floating motion
      const floatX = Math.sin(frame * 0.025) * 3;
      const floatY = Math.cos(frame * 0.03) * 2;
      ctx.translate(floatX, floatY);

      const skinBase  = 'rgba(245,212,200,0.92)';
      const skinLight = 'rgba(255,228,218,0.95)';
      const skinDark  = 'rgba(230,195,185,0.85)';

      // ** Head **
      const hx = 0, hy = -54;
      const hr = 30;
      const headGrad2 = ctx.createRadialGradient(hx - 8, hy - 10, 3, hx, hy, hr);
      headGrad2.addColorStop(0, skinLight);
      headGrad2.addColorStop(0.7, skinBase);
      headGrad2.addColorStop(1, skinDark);
      ctx.fillStyle = headGrad2;
      ctx.beginPath(); ctx.arc(hx, hy, hr, 0, Math.PI*2); ctx.fill();

      // fontanelle
      ctx.fillStyle = 'rgba(230,192,182,0.35)';
      ctx.beginPath(); ctx.arc(hx - 1, hy - 12, 11, 0, Math.PI*2); ctx.fill();

      // ** Fetal eyes (closed, eyelid line) **
      ctx.strokeStyle = 'rgba(200,170,160,0.7)';
      ctx.lineWidth = 1.8;
      ctx.lineCap = 'round';
      // left eye
      ctx.beginPath(); ctx.moveTo(hx - 14, hy + 2); ctx.quadraticCurveTo(hx - 9, hy + 5, hx - 4, hy + 2); ctx.stroke();
      // right eye
      ctx.beginPath(); ctx.moveTo(hx + 4, hy + 2); ctx.quadraticCurveTo(hx + 9, hy + 5, hx + 14, hy + 2); ctx.stroke();

      // ** Eyebrows (subtle, thin) **
      ctx.strokeStyle = 'rgba(180,140,130,0.5)';
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(hx - 15, hy - 4); ctx.quadraticCurveTo(hx - 9, hy - 7, hx - 3, hy - 4); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(hx + 3, hy - 4); ctx.quadraticCurveTo(hx + 9, hy - 7, hx + 15, hy - 4); ctx.stroke();

      // ** Nose (tiny, just a hint) **
      ctx.fillStyle = skinDark;
      ctx.beginPath(); ctx.ellipse(hx, hy + 10, 3.5, 2.5, 0, 0, Math.PI*2); ctx.fill();
      // nostril hints
      ctx.fillStyle = 'rgba(220,180,170,0.5)';
      ctx.beginPath(); ctx.ellipse(hx - 3, hy + 11, 1.8, 1.5, 0, 0, Math.PI); ctx.fill();
      ctx.beginPath(); ctx.ellipse(hx + 3, hy + 11, 1.8, 1.5, 0, 0, Math.PI); ctx.fill();

      // ** Mouth (tiny, closed) **
      ctx.strokeStyle = 'rgba(210,170,160,0.6)';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(hx - 5, hy + 17); ctx.quadraticCurveTo(hx, hy + 19, hx + 5, hy + 17); ctx.stroke();

      // ** Ears **
      ctx.fillStyle = skinBase;
      ctx.beginPath(); ctx.ellipse(hx - 28, hy + 2, 6, 10, -0.2, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(hx + 28, hy + 2, 6, 10, 0.2, 0, Math.PI*2); ctx.fill();
      // ear inner
      ctx.fillStyle = 'rgba(230,190,185,0.5)';
      ctx.beginPath(); ctx.ellipse(hx - 28, hy + 2, 3.5, 6, -0.2, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(hx + 28, hy + 2, 3.5, 6, 0.2, 0, Math.PI*2); ctx.fill();

      // ** Body (torso) **
      ctx.fillStyle = skinBase;
      ctx.beginPath();
      ctx.ellipse(0, 10, 32, 40, 0.1, 0, Math.PI*2);
      ctx.fill();
      // chest highlight
      ctx.fillStyle = 'rgba(255,230,220,0.3)';
      ctx.beginPath(); ctx.ellipse(-5, 0, 14, 20, 0.1, 0, Math.PI*2); ctx.fill();

      // ** Belly button **
      ctx.fillStyle = 'rgba(230,190,185,0.4)';
      ctx.beginPath(); ctx.arc(0, 24, 4.5, 0, Math.PI*2); ctx.fill();

      // ** Arms **
      ctx.strokeStyle = skinBase;
      ctx.lineWidth = 13;
      ctx.lineCap = 'round';
      // left arm (curled toward face)
      ctx.beginPath();
      ctx.moveTo(-20, -16);
      ctx.quadraticCurveTo(-40, -30, -32, -44);
      ctx.stroke();
      // right arm
      ctx.beginPath();
      ctx.moveTo(20, -16);
      ctx.quadraticCurveTo(40, -30, 32, -44);
      ctx.stroke();
      // hands (fists near cheeks)
      ctx.fillStyle = skinLight;
      ctx.beginPath(); ctx.arc(-32, -46, 8, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc( 32, -46, 8, 0, Math.PI*2); ctx.fill();
      // fist detail (subtle fingers)
      ctx.strokeStyle = skinDark;
      ctx.lineWidth = 1.5;
      // left hand fingers
      ctx.beginPath(); ctx.moveTo(-36, -48); ctx.lineTo(-38, -52); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-28, -48); ctx.lineTo(-26, -52); ctx.stroke();
      // right hand fingers
      ctx.beginPath(); ctx.moveTo( 36, -48); ctx.lineTo( 38, -52); ctx.stroke();
      ctx.beginPath(); ctx.moveTo( 28, -48); ctx.lineTo( 26, -52); ctx.stroke();

      // ** Legs (curled, knees toward chest — fetal position) **
      ctx.lineWidth = 14;
      // left thigh
      ctx.beginPath();
      ctx.moveTo(-14, 44);
      ctx.quadraticCurveTo(-32, 58, -26, 74);
      ctx.stroke();
      // right thigh
      ctx.beginPath();
      ctx.moveTo(14, 44);
      ctx.quadraticCurveTo(32, 58, 26, 74);
      ctx.stroke();
      // feet
      ctx.fillStyle = skinBase;
      ctx.beginPath(); ctx.ellipse(-26, 76, 9, 6, 0.3, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse( 26, 76, 9, 6, -0.3, 0, Math.PI*2); ctx.fill();
      // toes hint
      ctx.strokeStyle = skinDark;
      ctx.lineWidth = 1.2;
      for(let toe = -1; toe <= 1; toe++){
        ctx.beginPath();
        ctx.moveTo(-26 + toe*4, 76);
        ctx.lineTo(-26 + toe*4 + (toe*0.5), 80);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo( 26 + toe*4, 76);
        ctx.lineTo( 26 + toe*4 + (toe*0.5), 80);
        ctx.stroke();
      }

      // ** Umbilical cord **
      ctx.strokeStyle = 'rgba(185,105,85,0.75)';
      ctx.lineWidth = 5.5;
      ctx.beginPath();
      const ucEndX = Math.sin(frame*0.04)*6;
      const ucEndY = 20 + Math.sin(frame*0.06)*3;
      ctx.moveTo(0, 18);
      ctx.quadraticCurveTo(10, 35, ucEndX, ucEndY + 30);
      ctx.stroke();
      // cord twist highlight
      ctx.strokeStyle = 'rgba(210,140,120,0.4)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 18);
      ctx.quadraticCurveTo(11, 36, ucEndX + 1, ucEndY + 31);
      ctx.stroke();

      ctx.restore();

      // ---- "我tm来了" text ----
      if(t > 0.4 && textEl && !textEl.classList.contains('show')){
        textEl.textContent = '我tm来了';
        textEl.classList.add('show');
      }

      // ---- Bubbles / amniotic fluid particles ----
      if(frame % 3 === 0){
        for(let i = 0; i < 3; i++){
          const bx = cx + (Math.random() - 0.5) * sacW * 0.75;
          const by = (cy + 10) + (Math.random() - 0.5) * sacH * 0.75;
          const br = 1 + Math.random() * 3.5;
          const ba = 0.1 + Math.random() * 0.25;
          ctx.fillStyle = `rgba(200,235,255,${ba})`;
          ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI*2); ctx.fill();
        }
      }
      // floating bubble animation (some bubbles rise)
      if(frame % 8 === 0){
        const bx = cx + (Math.random() - 0.5) * sacW * 0.5;
        const by = (cy + 10) + sacH * 0.35;
        const br = 2 + Math.random() * 4;
        ctx.fillStyle = `rgba(210,240,255,${0.15 + Math.random()*0.15})`;
        ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI*2); ctx.fill();
      }

    } else {
      // Phase 5: fade out
      const t = Math.min(1, (frame - 370) / 30);
      if(screen) screen.style.opacity = 1 - t;
      if(t >= 1){
        animDone = true;
        if(screen){
          screen.classList.add('fade-out');
          setTimeout(()=>{ screen.style.display = 'none'; }, 800);
        }
        return;
      }
    }

    requestAnimationFrame(loop);
  }

  setTimeout(()=> requestAnimationFrame(loop), 100);
})();

const ALL_EVENTS = [];
CHAPTERS.forEach((ch, ci) => {
  ch.events.forEach((ev, ei) => {
    ALL_EVENTS.push({ id: ci + '-' + ei, chapter: ci, name: ev });
  });
});
const TOTAL = ALL_EVENTS.length;

// ========== STATE ==========
let checkinData = {};
let currentEventId = null;
let tempPhotoData = null;

// ========== INIT ==========
function init() {
  loadData();
  renderList();
  updateProgress();
  document.getElementById('checkinDate').value = new Date().toISOString().split('T')[0];
}

function loadData() {
  try {
    var raw = localStorage.getItem('lifeCheckinData');
    if (raw) checkinData = JSON.parse(raw);
  } catch(e) { checkinData = {}; }
}

function saveData() {
  localStorage.setItem('lifeCheckinData', JSON.stringify(checkinData));
}

// ========== RENDER LIST ==========
function renderList() {
  var container = document.getElementById('mainList');
  container.innerHTML = '';
  CHAPTERS.forEach(function(ch, ci) {
    var chapterDiv = document.createElement('div');
    chapterDiv.className = 'chapter open';
    chapterDiv.id = 'chapter-' + ci;

    var checkedCount = 0;
    ch.events.forEach(function(_, ei) {
      if (checkinData[ci + '-' + ei]) checkedCount++;
    });

    chapterDiv.innerHTML =
      '<div class="chapter-header" onclick="toggleChapter(' + ci + ')">' +
        '<span class="chapter-icon">' + ch.icon + '</span>' +
        '<div class="chapter-body">' +
          '<div class="chapter-title">' + escapeHtml(ch.title) + '</div>' +
          '<div class="chapter-sub">' + escapeHtml(ch.subtitle) + '</div>' +
        '</div>' +
        '<div class="chapter-right">' +
          '<span class="chapter-count">' + checkedCount + '/' + ch.events.length + '</span>' +
          '<span class="chapter-arrow">▼</span>' +
        '</div>' +
      '</div>' +
      '<div class="chapter-items">' +
        ch.events.map(function(ev, ei) {
          var id = ci + '-' + ei;
          var checked = checkinData[id];
          var metaHtml = checked ? renderMeta(checked) : '';
          return '' +
            '<div class="event-item' + (checked ? ' checked' : '') + '" onclick="openCheckin(\'' + id + '\')">' +
              '<div class="event-check">' + (checked ? '✓' : '') + '</div>' +
              '<div class="event-info">' +
                '<div class="event-name">' + escapeHtml(ev) + '</div>' +
                metaHtml +
              '</div>' +
            '</div>';
        }).join('') +
      '</div>';

    container.appendChild(chapterDiv);
  });
}

function renderMeta(data) {
  var parts = [];
  if (data.date) parts.push('📅 ' + data.date);
  if (data.photo) parts.push('📷 有照片');
  if (data.note) parts.push('💬 ' + escapeHtml(data.note.substring(0, 15)) + (data.note.length > 15 ? '…' : ''));
  if (parts.length === 0) return '';
  return '<div class="event-meta"><span>' + parts.join('</span><span>·</span><span>') + '</span></div>';
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.appendChild(document.createTextNode(str));
  return div.innerHTML;
}

function toggleChapter(ci) {
  var el = document.getElementById('chapter-' + ci);
  el.classList.toggle('open');
}

// ========== PROGRESS ==========
function updateProgress() {
  var done = Object.keys(checkinData).length;
  var pct = TOTAL > 0 ? Math.round(done / TOTAL * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = '已点亮 ' + done + ' / ' + TOTAL + ' 个经历（' + pct + '%）';
}

// ========== MODAL ==========
function openCheckin(eventId) {
  currentEventId = eventId;
  tempPhotoData = null;
  var ev = ALL_EVENTS.find(function(e) { return e.id === eventId; });
  document.getElementById('modalEventName').textContent = ev.name;

  var existing = checkinData[eventId];
  if (existing) {
    document.getElementById('checkinDate').value = existing.date || new Date().toISOString().split('T')[0];
    document.getElementById('checkinNote').value = existing.note || '';
    if (existing.photo) {
      showPhotoPreview(existing.photo);
    } else {
      clearPhotoPreview();
    }
    document.getElementById('deleteBtnWrap').style.display = 'block';
  } else {
    document.getElementById('checkinDate').value = new Date().toISOString().split('T')[0];
    document.getElementById('checkinNote').value = '';
    clearPhotoPreview();
    document.getElementById('deleteBtnWrap').style.display = 'none';
  }

  document.getElementById('checkinModal').classList.add('show');
}

function closeModal() {
  document.getElementById('checkinModal').classList.remove('show');
  currentEventId = null;
  tempPhotoData = null;
}

function submitCheckin() {
  if (!currentEventId) return;
  var date = document.getElementById('checkinDate').value;
  var note = document.getElementById('checkinNote').value.trim();

  checkinData[currentEventId] = {
    date: date,
    photo: tempPhotoData,
    note: note,
    timestamp: Date.now()
  };

  saveData();
  closeModal();
  renderList();
  updateProgress();
  showToast('🌟 打卡成功！');
}

function deleteCheckin() {
  if (!currentEventId) return;
  delete checkinData[currentEventId];
  saveData();
  closeModal();
  renderList();
  updateProgress();
  showToast('已删除打卡记录');
}

// ========== PHOTO ==========
function handlePhoto(e) {
  var file = e.target.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) {
    showToast('⚠️ 照片不能超过 5MB');
    return;
  }
  var reader = new FileReader();
  reader.onload = function(ev) {
    compressImage(ev.target.result, 600, 0.65).then(function(compressed) {
      tempPhotoData = compressed;
      showPhotoPreview(compressed);
    });
  };
  reader.readAsDataURL(file);
}

function compressImage(dataUrl, maxW, quality) {
  return new Promise(function(resolve) {
    var img = new Image();
    img.onload = function() {
      var w = img.width, h = img.height;
      if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = dataUrl;
  });
}

function showPhotoPreview(dataUrl) {
  var upload = document.getElementById('photoUpload');
  var preview = document.getElementById('photoPreview');
  preview.src = dataUrl;
  upload.classList.add('has-photo');
}

function clearPhotoPreview() {
  var upload = document.getElementById('photoUpload');
  var preview = document.getElementById('photoPreview');
  preview.src = '';
  upload.classList.remove('has-photo');
  document.getElementById('photoInput').value = '';
  tempPhotoData = null;
}

function removePhoto(e) {
  e.stopPropagation();
  tempPhotoData = null;
  clearPhotoPreview();
}

  document.getElementById('timelineView').classList.toggle('show', tab === 'timeline');
  document.getElementById('statsView').classList.toggle('show', tab === 'stats');

  document.getElementById('tabTimeline').classList.toggle('active', tab === 'timeline');

  document.getElementById('tabData').classList.toggle('active', false);

  if (tab === 'timeline') renderTimeline();
  if (tab === 'stats') renderStats();
}

// ========== TIMELINE ==========
function renderTimeline() {
  var container = document.getElementById('timelineView');
  var entries = [];
  ALL_EVENTS.forEach(function(ev) {
    var data = checkinData[ev.id];
    if (data && data.date) {
      entries.push({ id: ev.id, chapter: ev.chapter, name: ev.name, date: data.date, photo: data.photo, note: data.note });
    }
  });

  entries.sort(function(a, b) {
    if (a.date > b.date) return -1;
    if (a.date < b.date) return 1;
    return 0;
  });

  if (entries.length === 0) {
    container.innerHTML = '<div class="timeline-empty">🌱<br>还没有打卡记录<br>去清单里点亮你的第一个经历吧</div>';
    return;
  }

  container.innerHTML = entries.map(function(ev) {
    var ch = CHAPTERS[ev.chapter];
    var dateParts = ev.date.split('-');
    var photoHtml = ev.photo ? '<img class="timeline-photo" src="' + ev.photo + '" onclick="viewPhoto(\'' + ev.id + '\')">' : '';
    var noteHtml = ev.note ? '<div class="timeline-note">💬 ' + escapeHtml(ev.note) + '</div>' : '';
    return '' +
      '<div class="timeline-item">' +
        '<div class="timeline-date">' +
          '<div class="timeline-day">' + parseInt(dateParts[2]) + '</div>' +
          '<div class="timeline-month">' + dateParts[0] + '年' + parseInt(dateParts[1]) + '月</div>' +
        '</div>' +
        '<div class="timeline-info">' +
          '<div class="timeline-chapter">' + ch.icon + ' ' + ch.title + '</div>' +
          '<div class="timeline-name">' + escapeHtml(ev.name) + '</div>' +
          noteHtml +
          photoHtml +
        '</div>' +
      '</div>';
  }).join('');
}

function viewPhoto(eventId) {
  var data = checkinData[eventId];
  if (data && data.photo) {
    document.getElementById('photoViewerImg').src = data.photo;
    document.getElementById('photoViewer').classList.add('show');
  }
}

}

// ========== STATS ==========
function renderStats() {
  var container = document.getElementById('statsView');
  var done = Object.keys(checkinData).length;
  var pct = TOTAL > 0 ? Math.round(done / TOTAL * 100) : 0;

  var chapterStats = CHAPTERS.map(function(ch, ci) {
    var count = 0;
    ch.events.forEach(function(_, ei) { if (checkinData[ci + '-' + ei]) count++; });
    return { title: ch.title, icon: ch.icon, count: count, total: ch.events.length };
  });

  var photoCount = 0;
  Object.keys(checkinData).forEach(function(k) { if (checkinData[k].photo) photoCount++; });

  var recentDate = '';
  Object.keys(checkinData).forEach(function(k) {
    var d = checkinData[k].date;
    if (d && (!recentDate || d > recentDate)) recentDate = d;
  });

  var completedChapters = 0;
  chapterStats.forEach(function(s) { if (s.count === s.total) completedChapters++; });

  container.innerHTML = '' +
    '<div class="stats-hero">' +
      '<div class="stats-hero-num">' + done + '</div>' +
      '<div class="stats-hero-label">共 ' + TOTAL + ' 个经历，已完成 ' + pct + '%</div>' +
      '<div class="stats-hero-bar"><div class="stats-hero-fill" style="width:' + pct + '%"></div></div>' +
    '</div>' +
    '<div class="stats-card">' +
      '<div class="stats-card-title">📊 各章节完成度</div>' +
      '<div class="stats-chart">' +
        chapterStats.map(function(s) {
          var h = s.total > 0 ? Math.max(4, Math.round(s.count / s.total * 90)) : 4;
          return '' +
            '<div class="stats-bar-wrap">' +
              '<div class="stats-bar" style="height:' + h + 'px"></div>' +
              '<div class="stats-bar-label">' + s.icon + '<br>' + s.count + '/' + s.total + '</div>' +
            '</div>';
        }).join('') +
      '</div>' +
    '</div>' +
    '<div class="stats-card">' +
      '<div class="stats-grid">' +
        '<div class="stats-grid-item">' +
          '<div class="stats-grid-num">' + photoCount + '</div>' +

        '<div class="stats-grid-item">' +
          '<div class="stats-grid-num">' + (recentDate ? recentDate.replace(/-/g, '.') : '-') + '</div>' +
          '<div class="stats-grid-label">最近打卡</div>' +
        '</div>' +
        '<div class="stats-grid-item">' +
          '<div class="stats-grid-num">' + completedChapters + '</div>' +
          '<div class="stats-grid-label">已完成章节</div>' +

      '</div>' +
    '</div>';

function exportData() {
  var dataStr = JSON.stringify(checkinData, null, 2);
  var blob = new Blob([dataStr], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = '人生打卡备份_' + new Date().toISOString().split('T')[0] + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('📤 数据已导出');
}

function importData(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    try {
      var imported = JSON.parse(ev.target.result);
      var count = Object.keys(imported).length;
      if (confirm('即将导入 ' + count + ' 条打卡记录\n\n确定 = 覆盖当前数据\n取消 = 合并数据')) {
        checkinData = imported;
      } else {
        Object.keys(imported).forEach(function(k) { checkinData[k] = imported[k]; });
      }
      saveData();
      renderList();
      updateProgress();
      showToast('📥 数据导入成功！');
    } catch(err) {
      showToast('⚠️ 文件格式不正确');
    }
  };
  reader.readAsText(file);
  document.getElementById('importInput').value = '';
  closeDataPanel();
}

function confirmClearData() {
  if (confirm('确定要清除所有打卡数据吗？\n\n此操作不可恢复！')) {
    checkinData = {};
    saveData();
    renderList();
    updateProgress();
    showToast('🗑️ 所有数据已清除');
    closeDataPanel();
  }
}

// ========== TOAST ==========
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 1800);
}

// ========== START ==========
init();
</script>
</body>
</html>
