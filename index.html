];

function generateShareCard() {
  var done = Object.keys(checkinData).length;
  var pct = TOTAL > 0 ? Math.round(done / TOTAL * 100) : 0;
  var tag = calculatePersonalityTag();
  var theme = SHARE_CARD_THEMES[Math.floor(Math.random() * SHARE_CARD_THEMES.length)];

  // 计算章节统计
  var chapterStats = CHAPTERS.map(function(ch, ci) {
    var count = 0;
    ch.events.forEach(function(_, ei) { if (checkinData[ci + '-' + ei]) count++; });
    return { title: ch.title, icon: ch.icon, count: count, total: ch.events.length, pct: Math.round(count / ch.events.length * 100) };
  });

  // 创建Canvas - 竖版 750 x 1200
  var canvas = document.createElement('canvas');
  var W = 750, H = 1200;
  canvas.width = W;
  canvas.height = H;
  var ctx = canvas.getContext('2d');

  // ===== 背景层 =====
  // 主渐变（根据随机主题）
  var bgGrad = ctx.createLinearGradient(0, 0, W, H);
  bgGrad.addColorStop(0, theme.bg[0]);
  bgGrad.addColorStop(0.35, theme.bg[1]);
  bgGrad.addColorStop(0.7, theme.bg[2]);
  bgGrad.addColorStop(1, theme.bg[3]);
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // 顶部光晕（根据随机主题）
  var ga = theme.glow;
  var topGlow = ctx.createRadialGradient(W*0.5, 0, 0, W*0.5, 100, 500);
  topGlow.addColorStop(0, 'rgba(' + ga[0] + ',' + ga[1] + ',' + ga[2] + ',0.25)');
  topGlow.addColorStop(1, 'rgba(' + ga[0] + ',' + ga[1] + ',' + ga[2] + ',0)');
  ctx.fillStyle = topGlow;
  ctx.fillRect(0, 0, W, 400);

  // 底部光晕（根据随机主题）
  var botGlow = ctx.createRadialGradient(W*0.5, H, 0, W*0.5, H-100, 400);
  botGlow.addColorStop(0, 'rgba(' + ga[0] + ',' + ga[1] + ',' + ga[2] + ',0.15)');
  botGlow.addColorStop(1, 'rgba(' + ga[0] + ',' + ga[1] + ',' + ga[2] + ',0)');
  ctx.fillStyle = botGlow;
  ctx.fillRect(0, H-400, W, 400);

  //  subtle 网格纹理
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  for (var gx = 0; gx < W; gx += 40) { ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke(); }
  for (var gy = 0; gy < H; gy += 40) { ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke(); }
  ctx.restore();

  // 浮动几何装饰
  drawFloatingShapes(ctx, W, H);

  // ===== 顶部标题区 =====
  ctx.textAlign = 'center';
  // 小标签
  ctx.font = '500 18px -apple-system, PingFang SC, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fillText('L I F E  E X P E R I E N C E S', W/2, 70);

  // 主标题带阴影
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.2)';
  ctx.shadowBlur = 20;
  ctx.shadowOffsetY = 4;
  ctx.font = 'bold 48px -apple-system, PingFang SC, sans-serif';
  ctx.fillStyle = '#fff';
  ctx.fillText('人生体验卡', W/2, 125);
  ctx.restore();

  // 装饰线
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(W/2 - 80, 145);
  ctx.lineTo(W/2 + 80, 145);
  ctx.stroke();

  // ===== 中央圆环进度区 =====
  var cx = W/2, cy = 310, cr = 100;
  // 外圈装饰虚线
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 2;
  ctx.setLineDash([8, 6]);
  ctx.beginPath();
  ctx.arc(cx, cy, cr + 18, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();

  // 内圈发光背景
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.1)';
  ctx.lineWidth = 12;
  ctx.filter = 'blur(3px)';
  ctx.beginPath();
  ctx.arc(cx, cy, cr - 4, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();

  // 背景圆环
  ctx.beginPath();
  ctx.arc(cx, cy, cr, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.lineWidth = 10;
  ctx.stroke();

  // 进度圆环
  var circ = 2 * Math.PI * cr;
  var offset = circ * (1 - pct / 100);
  ctx.beginPath();
  ctx.arc(cx, cy, cr, -Math.PI/2, -Math.PI/2 + (pct/100) * Math.PI * 2);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 10;
  ctx.lineCap = 'round';
  ctx.shadowColor = 'rgba(255,255,255,0.4)';
  ctx.shadowBlur = 12;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // 中心数字
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 56px -apple-system, sans-serif';
  ctx.fillText(pct + '%', cx, cy + 10);
  ctx.font = '22px -apple-system, PingFang SC, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.fillText(done + ' / ' + TOTAL, cx, cy + 42);

  // ===== 个性标签 =====
  var tagY = 460;
  // 标签背景
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  roundRectPath(ctx, W/2 - 130, tagY - 32, 260, 44, 22);
  ctx.fill();
  // 标签边框
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 1;
  roundRectPath(ctx, W/2 - 130, tagY - 32, 260, 44, 22);
  ctx.stroke();
  ctx.restore();

  ctx.font = '500 20px -apple-system, PingFang SC, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.textAlign = 'center';
  ctx.fillText(tag, W/2, tagY);

  // ===== 章节完成度 =====
  var chartY = 540;
  ctx.font = '500 20px -apple-system, PingFang SC, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.textAlign = 'left';
  ctx.fillText('章节进度', 55, chartY);

  // 分隔线
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(55, chartY + 12);
  ctx.lineTo(W - 55, chartY + 12);
  ctx.stroke();

  var barStartY = chartY + 35;
  var barHeight = 10;
  var barMaxW = W - 190;
  var rowH = 52;

  chapterStats.forEach(function(s, i) {
    var y = barStartY + i * rowH;
    // 图标+标题
    ctx.font = '18px -apple-system, PingFang SC, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.textAlign = 'left';
    ctx.fillText(s.icon + ' ' + s.title, 55, y);

    // 数值
    ctx.font = '16px -apple-system, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.textAlign = 'right';
    ctx.fillText(s.count + '/' + s.total, W - 55, y);

    // 背景条
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    roundRectPath(ctx, 55, y + 8, barMaxW, barHeight, 5);
    ctx.fill();

    // 填充条
    if (s.count > 0) {
      var bw = (s.count / s.total) * barMaxW;
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      roundRectPath(ctx, 55, y + 8, bw, barHeight, 5);
      ctx.fill();
      // 微光
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      roundRectPath(ctx, 55, y + 8, Math.min(bw, 30), barHeight, 5);
      ctx.fill();
    }
  });

  // ===== 中间统计区 =====
  var midY = barStartY + chapterStats.length * rowH + 60;
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(55, midY - 20);
  ctx.lineTo(W - 55, midY - 20);
  ctx.stroke();

  var stats = [
    { label: '照片记录', value: '' + countPhotos() },
    { label: '最近打卡', value: getRecentDate() },
    { label: '完成章节', value: '' + countCompletedChapters() }
  ];
  var statW = (W - 110) / 3;
  stats.forEach(function(st, i) {
    var sx = 55 + i * statW + statW/2;
    ctx.textAlign = 'center';
    ctx.font = 'bold 28px -apple-system, sans-serif';
    ctx.fillStyle = '#fff';
    ctx.fillText(st.value, sx, midY + 18);
    ctx.font = '16px -apple-system, PingFang SC, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillText(st.label, sx, midY + 44);
  });

  // ===== 底部区域 =====
  var botY = H - 90;
  // 装饰线
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(W/2 - 100, botY);
  ctx.lineTo(W/2 + 100, botY);
  ctx.stroke();

  ctx.textAlign = 'center';
  ctx.font = '20px -apple-system, PingFang SC, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillText('记录人生体验，珍惜每一个瞬间', W/2, botY + 28);

  ctx.font = '16px -apple-system, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  var today = new Date();
  var dateStr = today.getFullYear() + '.' + (today.getMonth()+1) + '.' + today.getDate();
  ctx.fillText('Generated on ' + dateStr + '  ·  人生体验卡', W/2, botY + 52);

  // ===== 转换为图片 =====
  var dataUrl = canvas.toDataURL('image/png');
  var preview = document.getElementById('shareCardPreview');
  if (!preview) {
    preview = document.createElement('img');
    preview.id = 'shareCardPreview';
    preview.className = 'share-card-preview';
    document.getElementById('shareCardModal').querySelector('.modal').insertBefore(preview, document.querySelector('#shareCardModal .btn-row'));
  }
  preview.src = dataUrl;
  document.getElementById('shareCardModal').classList.add('show');
}

// 绘制浮动装饰几何
function drawFloatingShapes(ctx, W, H) {
  ctx.save();
  var shapes = [
    { x: 60, y: 180, r: 40, a: 0.08 },
    { x: W-50, y: 220, r: 55, a: 0.06 },
    { x: 90, y: H-200, r: 70, a: 0.05 },
    { x: W-80, y: H-160, r: 50, a: 0.07 },
    { x: 150, y: 500, r: 30, a: 0.1 },
    { x: W-120, y: 450, r: 35, a: 0.08 }
  ];
  shapes.forEach(function(s) {
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,' + s.a + ')';
    ctx.fill();
  });

  // 小圆点装饰
  var dots = [
    { x: 120, y: 100, r: 4 },
    { x: W-100, y: 140, r: 3 },
    { x: 80, y: 400, r: 5 },
    { x: W-60, y: 380, r: 4 },
    { x: 200, y: 700, r: 3 },
    { x: W-150, y: 750, r: 4 },
    { x: 130, y: 950, r: 3 },
    { x: W-110, y: 920, r: 5 }
  ];
  dots.forEach(function(d) {
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fill();
  });

  // 十字装饰
  var crosses = [
    { x: 45, y: 300, len: 12 },
    { x: W-45, y: 340, len: 10 },
    { x: 100, y: 600, len: 8 },
    { x: W-70, y: 580, len: 10 },
    { x: 70, y: 820, len: 12 },
    { x: W-90, y: 850, len: 8 }
  ];
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 1.5;
  crosses.forEach(function(c) {
    ctx.beginPath();
    ctx.moveTo(c.x - c.len, c.y);
    ctx.lineTo(c.x + c.len, c.y);
    ctx.moveTo(c.x, c.y - c.len);
    ctx.lineTo(c.x, c.y + c.len);
    ctx.stroke();
  });
  ctx.restore();
}

function countPhotos() {
  var count = 0;
  Object.keys(checkinData).forEach(function(k) { if (checkinData[k].photo) count++; });
  return count;
}

function getRecentDate() {
  var recent = '';
  Object.keys(checkinData).forEach(function(k) {
    var d = checkinData[k].date;
    if (d && (!recent || d > recent)) recent = d;
  });
  return recent ? recent.replace(/-/g, '.') : '-';
}

function countCompletedChapters() {
  var count = 0;
  CHAPTERS.forEach(function(ch, ci) {
    var allDone = ch.events.every(function(_, ei) { return !!checkinData[ci + '-' + ei]; });
    if (allDone) count++;
  });
  return count;
}

function roundRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ========== PERSONALITY TAG & MILESTONE ==========
function calculatePersonalityTag() {
  // 统计每个章节的完成数
  var chapterCount = [];
  CHAPTERS.forEach(function(ch, ci) {
    var count = 0;
    ch.events.forEach(function(_, ei) { if (checkinData[ci + '-' + ei]) count++; });
    chapterCount.push({ index: ci, count: count, title: ch.title, icon: ch.icon });
  });
  
  // 按完成数排序
  chapterCount.sort(function(a, b) { return b.count - a.count; });
  
  // 根据最多的章节生成标签
  var top = chapterCount[0];
  if (top.count === 0) return '🌱 人生新芽';
  
  var tags = {
    0: ['🌱 童年回忆家', '📸 纯真岁月'],
    1: ['📚 求学追梦人', '🎓 知识探索者'],
    2: ['💼 职场奋斗者', '🚀 事业打拼家'],
    3: ['❤️ 温暖家人', '💑 感情丰富家'],
    4: ['🏠 生活家', '🍳 居家能手'],
    5: ['🌍 冒险家', '✈️ 世界探索者'],
    6: ['🎉 仪式感达人', '📷 回忆收藏家'],
    7: ['🕰️ 人生智者', '🌟 岁月沉淀家']
  };
  
  var options = tags[top.index] || ['🌟 人生体验家'];
  return options[Math.floor(Math.random() * options.length)];
}

function calculateNextMilestone(done) {
  var pct = TOTAL > 0 ? Math.round(done / TOTAL * 100) : 0;
  var milestones = [25, 50, 75, 100];
  
  for (var i = 0; i < milestones.length; i++) {
    if (pct < milestones[i]) {
      var target = milestones[i];
      var needed = Math.ceil(target / 100 * TOTAL) - done;
      if (needed <= 0) needed = 1;
      return '🎯 再完成 ' + needed + ' 个体验，就能达到 ' + target + '%！';
    }
  }
  
  return '🎊 恭喜你，已完成所有里程碑！';
}

// ========== WOODEN FISH (木鱼) ==========
var MUYU_CLICKS = 0;
var MUYU_TARGET = 0;
var MUYU_AUDIO_CTX = null;

function getMuyuAudioCtx() {
  if (!MUYU_AUDIO_CTX) {
    try { MUYU_AUDIO_CTX = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  return MUYU_AUDIO_CTX;
}

function playMuyuSound() {
  var ctx = getMuyuAudioCtx();
  if (!ctx) return;
  try {
    // 木鱼敲击声：短促低频 + 噪声纹理
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(900, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(180, ctx.currentTime + 0.12);
    gain.gain.setValueAtTime(0.35, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.18);

    // 噪声纹理（木质感）
    var len = ctx.sampleRate * 0.06;
    var buf = ctx.createBuffer(1, len, ctx.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * 0.12;
    var noise = ctx.createBufferSource();
    noise.buffer = buf;
    var ng = ctx.createGain();
    ng.gain.setValueAtTime(0.18, ctx.currentTime);
    ng.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
    noise.connect(ng);
    ng.connect(ctx.destination);
    noise.start(ctx.currentTime);
  } catch(e) {}
}

function createMuyuRipple(x, y) {
  var ripple = document.createElement('div');
  ripple.className = 'muyu-ripple';
  var size = 40 + Math.random() * 20;
  ripple.style.width = size + 'px';
  ripple.style.height = size + 'px';
  ripple.style.left = (x - size/2) + 'px';
  ripple.style.top = (y - size/2) + 'px';
  document.body.appendChild(ripple);
  setTimeout(function() { if (ripple.parentNode) ripple.remove(); }, 600);
}

var MUYU_TIMEOUT = null;

function clickMuyu(e) {
  MUYU_CLICKS++;
  playMuyuSound();
  if (e) createMuyuRipple(e.clientX, e.clientY);

  var remain = MUYU_TARGET - MUYU_CLICKS;
  var countEl = document.getElementById('muyuClickCount');

      countEl.classList.add('show');
      clearTimeout(MUYU_TIMEOUT);

  if (MUYU_CLICKS >= MUYU_TARGET) {

  }
}

// ========== NIGHT EFFECTS (星星 + 流星) ==========
var nightEffectsActive = false;
var shootingStarTimer = null;
var shootingStarKeyframesDefined = false;

function initNightEffects() {
  if (nightEffectsActive) return;
  nightEffectsActive = true;

  if (!shootingStarKeyframesDefined) {
    shootingStarKeyframesDefined = true;
    var style = document.createElement('style');
    style.id = 'shooting-star-keyframes';
    style.textContent =
      '@keyframes shootingStarFly {' +
        '0% { opacity:0; }' +
        '12% { opacity:1; }' +
        '100% { opacity:0; transform: translate(-220px, 110px) scale(0.2); }' +
      '}';
    document.head.appendChild(style);
  }

  generateStars();
  scheduleShootingStar();
}

function destroyNightEffects() {
  nightEffectsActive = false;
  if (shootingStarTimer) { clearTimeout(shootingStarTimer); shootingStarTimer = null; }
  var starContainer = document.getElementById('nightStars');
  if (starContainer) starContainer.innerHTML = '';
  var ssContainer = document.getElementById('shootingStarsContainer');
  if (ssContainer) ssContainer.innerHTML = '';
}

function generateStars() {
  var starContainer = document.getElementById('nightStars');
  var header = document.getElementById('mainHeader');
  if (!starContainer || !header) return;
  starContainer.innerHTML = '';
  var rect = header.getBoundingClientRect();
  var count = 18 + Math.floor(Math.random() * 10);
  for (var i = 0; i < count; i++) {
    var star = document.createElement('div');
    star.className = 'star';
    var size = 2 + Math.random() * 3.5;
    var x = Math.random() * Math.max(rect.width - size, 1);
    var y = Math.random() * Math.max(rect.height - size, 1);
    var dur = (1.2 + Math.random() * 2.8) + 's';
    var delay = (Math.random() * 3.5) + 's';
    var o1 = (0.25 + Math.random() * 0.35).toFixed(2);
    var o2 = (0.65 + Math.random() * 0.35).toFixed(2);
    star.style.left = x + 'px';
    star.style.top = y + 'px';
    star.style.width = size + 'px';
    star.style.height = size + 'px';
    star.style.setProperty('--dur', dur);
    star.style.setProperty('--delay', delay);
    star.style.setProperty('--o1', o1);
    star.style.setProperty('--o2', o2);
    star.style.borderRadius = '50%';
    star.style.background = 'radial-gradient(circle, rgba(255,255,255,' + o2 + '), rgba(255,255,255,0) 70%)';
    star.style.boxShadow = '0 0 ' + (size + 2) + 'px rgba(255,255,255,' + (parseFloat(o2) * 0.5) + ')';
    starContainer.appendChild(star);
  }
}

function scheduleShootingStar() {
  if (!nightEffectsActive) return;
  var delay = 3000 + Math.random() * 6000;
  shootingStarTimer = setTimeout(function() {
    createShootingStar();
    scheduleShootingStar();
  }, delay);
}

function createShootingStar() {
  var container = document.getElementById('shootingStarsContainer');
  if (!container) return;
  var star = document.createElement('div');
  star.className = 'shooting-star';

  var startX, startY;
  if (Math.random() > 0.4) {
    startX = window.innerWidth * 0.5 + Math.random() * window.innerWidth * 0.5;
    startY = -10;
  } else {
    startX = window.innerWidth + 10;
    startY = Math.random() * window.innerHeight * 0.4;
  }

  var len = 60 + Math.random() * 80;
  var dur = (0.5 + Math.random() * 0.5).toFixed(2); // 0.5~1.0s

  star.style.cssText =
    'position:fixed;left:' + startX + 'px;top:' + startY + 'px;' +
    'width:' + len + 'px;height:1.5px;' +
    'background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,0.9) 60%,#fff);' +
    'border-radius:1px;pointer-events:none;z-index:3;' +
    'opacity:0;animation:shootingStarFly ' + dur + 's ease-out forwards;';

  container.appendChild(star);
  setTimeout(function() { if (star.parentNode) star.remove(); }, 1200);
}

// ========== START ==========
loadTheme();
init();
// 云朵随机位置（不要太碍眼）
randomizeClouds();

function randomizeClouds() {
  var header = document.getElementById('mainHeader');
  if (!header) return;
  var clouds = document.querySelectorAll('.day-clouds .cloud');
  if (clouds.length === 0) return;
  var rect = header.getBoundingClientRect();
  // 安全区：进度圈区域（中间）、标题区域（顶部）、木鱼区域（左侧）
  var safeZones = [
    { x: rect.width/2 - 90, y: rect.height/2 - 90, w: 180, h: 180 },
    { x: rect.width/2 - 80, y: 0, w: 160, h: 70 },
    { x: 0, y: rect.height/2 - 50, w: 90, h: 100 }
  ];
  clouds.forEach(function(cloudEl) {
    var cw = 60, ch = 30;
    var x, y, attempts = 0;
    do {
      x = Math.floor(Math.random() * Math.max(rect.width - cw, 1));
      y = Math.floor(Math.random() * Math.max(rect.height - ch, 1));
      attempts++;
    } while (isInSafeZone(x, y, cw, ch, safeZones) && attempts < 80);
    cloudEl.style.position = 'absolute';
    cloudEl.style.left = x + 'px';
    cloudEl.style.top = y + 'px';
    cloudEl.style.zIndex = '1';
  });
}

function isInSafeZone(x, y, w, h, zones) {
  for (var i = 0; i < zones.length; i++) {
    var z = zones[i];
    if (x < z.x + z.w && x + w > z.x && y < z.y + z.h && y + h > z.y) return true;
  }
  return false;
}
</script>
<div id="shootingStarsContainer" style="position:fixed;inset:0;pointer-events:none;z-index:3;"></div>
