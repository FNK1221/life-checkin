<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>人生体验卡</title>
<style>
  /* ========== LOADING SCREEN ========== */
  #loadingScreen {
    position: fixed;
    inset: 0;
    z-index: 99999;
    background: #1a0e0a;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.8s ease;
  }
  #loadingScreen.fade-out { opacity: 0; pointer-events: none; }
  #loadingCanvas { display: block; }
  #loadingText {
    position: absolute;
    bottom: 18%;
    left: 50%;
    transform: translateX(-50%);
    color: #fce8d8;
    font-size: 16px;
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.5s;
    text-align: center;
    white-space: nowrap;
    text-shadow: 0 0 12px rgba(255,200,150,0.5);
    letter-spacing: 2px;
  }
  #loadingText.show { opacity: 1; }
  #loadingHint {
    position: absolute;
    bottom: 10%;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(252,232,216,0.4);
    font-size: 12px;
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:0.7} }
  
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  :root {
    --bg: #fdf8f4;
    --card: #ffffff;
    --card-alt: #fefaf6;
    --primary: #c47a5e;
    --primary-light: #d4957a;
    --primary-dark: #a8624a;
    --accent: #fce8d8;
    --accent2: #f5d8c5;
    --text: #3e2d23;
    --text-light: #8b6f5e;
    --text-muted: #b5a090;
    --border: #f0ddd0;
    --success: #7cb89a;
    --danger: #d4837a;
    --danger-bg: #fdf0ef;
    --shadow: 0 2px 16px rgba(180, 140, 100, 0.10);
    --shadow-hover: 0 4px 20px rgba(180, 140, 100, 0.18);
    --radius: 16px;
    --radius-sm: 10px;
    --transition-theme: background 0.4s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
  }

  /* ========== THEME TRANSITION ========== */
  html.theme-transitioning,
  html.theme-transitioning * {
    transition: background 0.4s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease !important;
  }

  /* ========== DARK THEME ========== */
  html.dark-theme {
    --bg: #1a1410;
    --card: #2a211b;
    --card-alt: #332820;
    --primary: #d4957a;
    --primary-light: #e0a88c;
    --primary-dark: #c47a5e;
    --accent: #3e2d23;
    --accent2: #4a3528;
    --text: #f0ddd0;
    --text-light: #d4b89a;
    --text-muted: #8b6f5e;
    --border: #4a3528;
    --success: #7cb89a;
    --danger: #d4837a;
    --danger-bg: #3e2020;
    --shadow: 0 2px 16px rgba(0, 0, 0, 0.3);
    --shadow-hover: 0 4px 20px rgba(0, 0, 0, 0.4);
  }
  html.dark-theme body { background: var(--bg); color: var(--text); }
  html.dark-theme .header { background: linear-gradient(145deg, #3a2a1e 0%, #2a1e14 50%, #1e1410 100%); }
  html.dark-theme .bottom-bar { background: rgba(42,33,27,0.92); border-top-color: rgba(74,53,40,0.5); }
  html.dark-theme .photo-viewer { background: rgba(10,8,6,0.95); }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 80px;
    -webkit-font-smoothing: antialiased;
  }
  
  /* ========== HEADER ========== */
  .header {
    background: linear-gradient(145deg, #d4a574 0%, #c47a5e 50%, #b86248 100%);
    padding: 24px 16px 28px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(160, 100, 60, 0.25);
  }
  .header h1 {
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 1px;
    margin-bottom: 14px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.12);
    display: inline-block;
  }
  .theme-toggle {
    position: absolute;
    top: 24px;
    right: 16px;
    background: rgba(255,255,255,0.18);
    border: 1.5px solid rgba(255,255,255,0.3);
    color: #fff;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, transform 0.15s;
    -webkit-tap-highlight-color: transparent;
    backdrop-filter: blur(4px);
  }
  .theme-toggle:active { transform: scale(0.9); background: rgba(255,255,255,0.25); }
  .progress-outer {
    background: rgba(255,255,255,0.22);
    border-radius: 20px;
    height: 12px;
    overflow: hidden;
    margin: 0 auto 8px;
    max-width: 300px;
    backdrop-filter: blur(4px);
  }
  .progress-inner {
    height: 100%;
    border-radius: 20px;
    background: linear-gradient(90deg, #fce8d8, #ffffff);
    transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    width: 0%;
    position: relative;
  }
  .progress-inner::after {
    content: '';
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 30px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5));
    border-radius: 20px;
  }
  .progress-text {
    font-size: 12px;
    color: rgba(255,255,255,0.92);
    font-weight: 500;
    letter-spacing: 0.5px;
  }
  
  /* ========== PROGRESS CIRCLE ========== */
  .progress-circle-wrap {
    position: relative;
    width: 120px;
    height: 120px;
    margin: 10px auto 8px;
  }
  .progress-circle {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }
  .progress-ring-bg {
    fill: none;
    stroke: rgba(255,255,255,0.2);
    stroke-width: 8;
  }
  .progress-ring-fill {
    fill: none;
    stroke: #fff;
    stroke-width: 8;
    stroke-linecap: round;
    stroke-dasharray: 326.726;
    stroke-dashoffset: 326.726;
    transition: stroke-dashoffset 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .progress-circle-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    line-height: 1.4;
    text-shadow: 0 1px 3px rgba(0,0,0,0.15);
    pointer-events: none;
  }
  .progress-circle-text .pct {
    font-size: 22px;
    font-weight: 800;
    display: block;
  }

  /* ========== CHAPTER ========== */
  .chapter {
    margin: 14px 12px 0;
    border-radius: var(--radius);
    background: var(--card);
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: box-shadow 0.2s;
  }
  .chapter:first-child { margin-top: 12px; }
  .chapter-header {
    display: flex;
    align-items: center;
    padding: 15px 16px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    transition: background 0.2s;
  }
  .chapter-header:active { background: var(--card-alt); }
  .chapter-icon {
    font-size: 22px;
    margin-right: 11px;
    flex-shrink: 0;
    width: 28px;
    text-align: center;
  }
  .chapter-body { flex: 1; min-width: 0; }
  .chapter-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
  }
  .chapter-sub {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .chapter-right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    margin-left: 8px;
  }
  .chapter-count {
    font-size: 12px;
    color: var(--primary);
    font-weight: 600;
    background: var(--accent);
    padding: 2px 9px;
    border-radius: 20px;
  }
  .chapter-arrow {
    font-size: 11px;
    color: var(--text-muted);
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    display: inline-block;
  }
  .chapter.open .chapter-arrow { transform: rotate(180deg); }
  .chapter-items {
    display: none;
    padding: 0 10px 10px;
  }
  .chapter.open .chapter-items { display: block; }
  
  /* ========== EVENT ITEM ========== */
  .event-item {
    display: flex;
    align-items: flex-start;
    padding: 12px 10px;
    border-radius: var(--radius-sm);
    margin-bottom: 4px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  .event-item:active { background: var(--accent); transform: scale(0.985); }
  .event-check {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2.2px solid var(--border);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 10px;
    margin-top: 1px;
    transition: all 0.3s;
    font-size: 13px;
    background: var(--card);
  }
  .event-item.checked .event-check {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
    box-shadow: 0 2px 8px rgba(196, 122, 94, 0.35);
  }
  .event-info { flex: 1; min-width: 0; padding-top: 1px; }
  .event-name {
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
  }
  .event-item.checked .event-name {
    color: var(--text-muted);
    text-decoration: line-through;
    text-decoration-color: var(--border);
    text-decoration-thickness: 1.5px;
  }
  .event-meta {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .event-meta span { white-space: nowrap; }
  
  /* ========== MODAL ========== */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(62, 45, 35, 0.45);
    z-index: 1000;
    align-items: flex-end;
    justify-content: center;
    backdrop-filter: blur(2px);
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--card);
    border-radius: 22px 22px 0 0;
    width: 100%;
    max-width: 500px;
    max-height: 88vh;
    overflow-y: auto;
    padding: 28px 20px 36px;
    animation: slideUp 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    -webkit-overflow-scrolling: touch;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); opacity: 0.8; }
    to { transform: translateY(0); opacity: 1; }
  }
  .modal-title {
    font-size: 18px;
    font-weight: 700;
    text-align: center;
    color: var(--text);
    margin-bottom: 4px;
  }
  .modal-subtitle {
    font-size: 12px;
    color: var(--text-muted);
    text-align: center;
    margin-bottom: 20px;
  }
  .modal-event-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--primary);
    text-align: center;
    margin-bottom: 22px;
    padding: 12px 14px;
    background: var(--accent);
    border-radius: 12px;
    line-height: 1.5;
  }
  
  /* ========== FORM ========== */
  .form-group { margin-bottom: 18px; }
  .form-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-light);
    margin-bottom: 7px;
    display: block;
    padding-left: 2px;
  }
  .form-input {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 15px;
    color: var(--text);
    background: var(--card-alt);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    font-family: inherit;
    -webkit-appearance: none;
  }
  .form-input:focus {
    border-color: var(--primary-light);
    box-shadow: 0 0 0 3px rgba(196, 122, 94, 0.12);
  }
  
  /* ========== PHOTO UPLOAD ========== */
  .photo-upload {
    width: 100%;
    min-height: 130px;
    border: 2px dashed var(--border);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    overflow: hidden;
    position: relative;
    background: var(--card-alt);
  }
  .photo-upload:active { background: var(--accent); }
  .photo-upload.has-photo { border-style: solid; border-color: var(--accent2); }
  .photo-upload-icon { font-size: 30px; opacity: 0.35; }
  .photo-upload-text { font-size: 13px; color: var(--text-muted); margin-top: 6px; }
  .photo-preview {
    width: 100%;
    height: 210px;
    object-fit: cover;
    display: none;
    border-radius: 12px;
  }
  .photo-upload.has-photo .photo-preview { display: block; }
  .photo-upload.has-photo .photo-upload-icon,
  .photo-upload.has-photo .photo-upload-text { display: none; }
  .photo-remove {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 30px;
    height: 30px;
    background: rgba(62, 45, 35, 0.6);
    color: #fff;
    border: none;
    border-radius: 50%;
    font-size: 14px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }
  .photo-upload.has-photo .photo-remove { display: flex; }

  /* ========== MEDIA UPLOAD ========== */
  .media-upload-box {
    width: 100%;
    min-height: 80px;
    border: 2px dashed var(--border);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    overflow: hidden;
    position: relative;
    background: var(--card-alt);
    padding: 14px 0;
  }
  .media-upload-box:active { background: var(--accent); }
  .media-upload-icon { font-size: 26px; opacity: 0.35; }
  .media-upload-text { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
  .audio-review { width: 100%; margin-top: 8px; display: none; }
  .video-review { width: 100%; border-radius: 12px; margin-top: 8px; display: none; }
  .media-upload-box.has-media .audio-review,
  .media-upload-box.has-media .video-review { display: block; }
  .media-upload-box.has-media .media-upload-icon,
  .media-upload-box.has-media .media-upload-text { display: none; }

  /* ========== BUTTONS ========== */
  .btn-row { display: flex; gap: 12px; margin-top: 22px; }
  .btn {
    flex: 1;
    padding: 13px 0;
    border: none;
    border-radius: 13px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { opacity: 0.75; transform: scale(0.97); }
  .btn-cancel { background: var(--card-alt); color: var(--text-light); border: 1.5px solid var(--border); }
  .btn-primary {
    background: linear-gradient(145deg, var(--primary-light), var(--primary-dark));
    color: #fff;
    box-shadow: 0 4px 14px rgba(196, 122, 94, 0.3);
  }
  .btn-danger { background: var(--danger-bg); color: var(--danger); border: 1.5px solid #f0d0cc; }
  .btn-delete-wrap { margin-top: 12px; }
  
  /* ========== SEARCH BOX ========== */
  .search-box {
    position: sticky;
    top: 81px;
    z-index: 99;
    background: var(--bg);
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
  }
  .search-input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .search-icon {
    position: absolute;
    left: 12px;
    font-size: 14px;
    pointer-events: none;
    opacity: 0.5;
    z-index: 1;
  }
  .search-input {
    width: 100%;
    padding: 10px 36px 10px 36px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 14px;
    color: var(--text);
    background: var(--card);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    font-family: inherit;
    -webkit-appearance: none;
  }
  .search-input:focus {
    border-color: var(--primary-light);
    box-shadow: 0 0 0 3px rgba(196, 122, 94, 0.12);
  }
  .search-clear {
    position: absolute;
    right: 10px;
    font-size: 16px;
    color: var(--text-muted);
    cursor: pointer;
    display: none;
    padding: 4px;
    line-height: 1;
    z-index: 1;
  }
  .search-clear.show { display: block; }
  .search-result {
    font-size: 12px;
    color: var(--text-muted);
    padding: 6px 4px 2px;
    display: none;
  }
  .search-result.show { display: block; }
  .chapter.hidden-chapter { display: none; }
  .event-item.hidden-event { display: none; }
  
  /* ========== BOTTOM BAR ========== */
  .bottom-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 -1px 12px rgba(0,0,0,0.05);
    display: flex;
    justify-content: space-around;
    padding: 10px 6px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    z-index: 100;
    border-top: 1px solid rgba(240, 221, 208, 0.5);
  }
  .bottom-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 10px;
    cursor: pointer;
    padding: 5px 14px;
    border-radius: 10px;
    transition: all 0.2s;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .bottom-btn:active { background: var(--accent); }
  .bottom-btn .icon { font-size: 20px; margin-bottom: 2px; line-height: 1; }
  .bottom-btn.active { color: var(--primary); }
  .bottom-btn.active .icon { filter: drop-shadow(0 1px 2px rgba(196,122,94,0.3)); }
  
  /* ========== TIMELINE RIVER ========== */
  .timeline-river-wrapper {
    position: relative;
    padding: 20px 0 60px;
    min-height: 80vh;
  }
  .timeline-river {
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 4px;
    transform: translateX(-50%);
    border-radius: 2px;
    background: linear-gradient(180deg,
      rgba(196,122,94,0.15) 0%,
      rgba(196,122,94,0.45) 25%,
      rgba(252,232,216,0.7) 50%,
      rgba(196,122,94,0.45) 75%,
      rgba(196,122,94,0.15) 100%);
    background-size: 100% 300%;
    animation: riverFlow 6s ease-in-out infinite, riverGlow 3s ease-in-out infinite alternate;
    box-shadow: 0 0 12px rgba(196,122,94,0.25), 0 0 30px rgba(196,122,94,0.1);
  }
  @keyframes riverGlow {
    0% { box-shadow: 0 0 12px rgba(196,122,94,0.25), 0 0 30px rgba(196,122,94,0.1); }
    100% { box-shadow: 0 0 20px rgba(196,122,94,0.4), 0 0 50px rgba(196,122,94,0.2); }
  }
  .timeline-river::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 20px;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at center, rgba(252,232,216,0.18) 0%, transparent 70%);
    pointer-events: none;
  }
  @keyframes riverFlow {
    0%   { background-position: 0% 0%; }
    50%  { background-position: 0% 100%; }
    100% { background-position: 0% 0%; }
  }

  /* 年份刻度 */
  .timeline-year-marker {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    background: var(--card);
    border: 1.5px solid var(--accent2);
    color: var(--primary);
    font-size: 12px;
    font-weight: 700;
    padding: 3px 14px;
    border-radius: 20px;
    z-index: 5;
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(196,122,94,0.12);
    letter-spacing: 1px;
  }

  /* 打卡点通用 */
  .tl-item {
    position: relative;
    width: 42%;
    margin-bottom: 28px;
    animation: tlFadeIn 0.5s ease both;
  }
  .tl-item.left  { margin-right: auto; padding-right: 24px; }
  .tl-item.right { margin-left: auto;  padding-left:  24px; }

  /* 连接线：从卡片指向河流中心 */
  .tl-item::before {
    content: '';
    position: absolute;
    top: 22px;
    width: 24px;
    height: 2px;
    background: var(--accent2);
  }
  .tl-item.left::before  { right: 0; }
  .tl-item.right::before { left: 0; }

  /* 河面锚点（小圆点）*/
  .tl-item::after {
    content: '';
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--primary-light);
    z-index: 2;
    transition: all 0.3s;
  }
  .tl-item.has-media::after {
    background: var(--primary);
    border-color: var(--primary);
    box-shadow: 0 0 10px rgba(196,122,94,0.5);
    width: 14px;
    height: 14px;
  }
  .tl-item.playing::after {
    box-shadow: 0 0 18px rgba(196,122,94,0.8), 0 0 30px rgba(196,122,94,0.3);
  }

  @keyframes tlFadeIn {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* 有内容的卡片 */
  .tl-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px 16px;
    cursor: pointer;
    transition: box-shadow 0.2s, transform 0.2s;
    position: relative;
    overflow: hidden;
  }
  .tl-card:active { box-shadow: var(--shadow-hover); transform: scale(0.985); }
  .tl-card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: var(--radius);
    background: radial-gradient(ellipse at 30% 20%, rgba(252,232,216,0.35) 0%, transparent 60%);
    pointer-events: none;
  }

  .tl-date {
    display: inline-block;
    font-size: 11px;
    color: #fff;
    background: linear-gradient(135deg, var(--primary-light), var(--primary-dark));
    padding: 2px 10px;
    border-radius: 20px;
    margin-bottom: 7px;
    font-weight: 600;
  }
  .tl-chapter {
    font-size: 11px;
    color: var(--primary-light);
    margin-bottom: 3px;
    font-weight: 500;
  }
  .tl-name {
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
    margin-bottom: 6px;
  }
  .tl-note {
    font-size: 12px;
    color: var(--text-muted);
    background: var(--card-alt);
    border-radius: 8px;
    padding: 6px 10px;
    line-height: 1.5;
    margin-top: 6px;
  }
.tl-photo {
  width: 100%;
  max-height: 180px;
  object-fit: cover;
  border-radius: 10px;
  margin-top: 8px;
  cursor: pointer;
  transition: transform 0.2s;
}
.tl-photo[data-lazy="true"] {
  opacity: 0;
  transition: opacity 0.3s;
}
.tl-photo.loaded {
  opacity: 1;
}
.tl-photo-placeholder {
  width: 100%;
  height: 180px;
  background: var(--accent2);
  border-radius: 10px;
  margin-top: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  opacity: 0.5;
}
  .tl-photo:active { transform: scale(0.97); }
  .tl-media-wrap {
    margin-top: 8px;
  }
  .tl-media-wrap audio,
  .tl-media-wrap video {
    width: 100%;
    border-radius: 10px;
  }

  /* ===== 转瞬即逝效果（无媒体） ===== */
  .tl-item.no-media .tl-card {
    opacity: 0;
    animation: fleetingIn 1.2s ease forwards;
    animation-delay: inherit;
  }
  @keyframes fleetingIn {
    0%   { opacity: 0; transform: scale(0.95); }
    15%  { opacity: 0.85; transform: scale(1.02); }
    35%  { opacity: 0.7; transform: scale(1); }
    100% { opacity: 0.32; }
  }
  .tl-item.no-media .tl-card:hover {
    opacity: 0.75 !important;
  }
  .tl-item.no-media::after {
    animation: anchorFleeting 1.2s ease forwards;
    animation-delay: inherit;
  }
  @keyframes anchorFleeting {
    0%   { opacity: 0; box-shadow: 0 0 8px rgba(196,122,94,0.5); }
    20%  { opacity: 1; box-shadow: 0 0 14px rgba(196,122,94,0.6); }
    50%  { opacity: 0.6; }
    100% { opacity: 0.25; box-shadow: none; }
  }
  .fleeting-msg {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 6px;
    font-style: italic;
    opacity: 0.7;
    line-height: 1.5;
  }

  .timeline-empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
    font-size: 14px;
    line-height: 1.8;
  }

  /* ========== STATS VIEW ========== */
  #statsView { display: none; padding: 12px; }
  #statsView.show { display: block; }

  /* ========== VIEW VISIBILITY (fix: tabs were broken) ========== */
  .hidden { display: none !important; }
  #mainList { display: block; }
  #timelineView { display: none; }
  #timelineView.show { display: block; position: relative; min-height: 60vh; }
  #statsView.show { display: block; }
  
  .stats-hero {
    background: linear-gradient(145deg, #d4a574, #c47a5e, #b86248);
    border-radius: var(--radius);
    padding: 32px 20px;
    text-align: center;
    color: #fff;
    box-shadow: 0 6px 24px rgba(160, 100, 60, 0.3);
    margin-bottom: 14px;
  }
  .stats-hero-num { font-size: 52px; font-weight: 800; line-height: 1; letter-spacing: -2px; }
  .stats-hero-label { font-size: 13px; opacity: 0.85; margin-top: 6px; }
  .stats-hero-bar {
    background: rgba(255,255,255,0.2);
    border-radius: 20px;
    height: 8px;
    margin: 16px auto 0;
    max-width: 220px;
    overflow: hidden;
  }
  .stats-hero-fill {
    height: 100%;
    border-radius: 20px;
    background: #fff;
    transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }
  
  .stats-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px;
    margin-bottom: 12px;
  }
  .stats-card-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 14px;
  }
  .stats-chart {
    display: flex;
    align-items: flex-end;
    gap: 5px;
    height: 110px;
    padding: 0 2px;
  }
  .stats-bar-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100%;
    justify-content: flex-end;
  }
  .stats-bar {
    width: 100%;
    max-width: 30px;
    border-radius: 6px 6px 0 0;
    min-height: 3px;
    background: linear-gradient(0deg, var(--primary), var(--primary-light));
    transition: height 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .stats-bar-label {
    font-size: 9px;
    color: var(--text-muted);
    margin-top: 5px;
    text-align: center;
    line-height: 1.2;
  }
  
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    text-align: center;
  }
  .stats-grid-item { padding: 10px 4px; }
  .stats-grid-num {
    font-size: 22px;
    font-weight: 800;
    color: var(--primary);
    line-height: 1;
  }
  .stats-grid-label { font-size: 11px; color: var(--text-muted); margin-top: 5px; }

  /* ========== HEATMAP ========== */
  .heatmap-card { margin-top: 12px; }
  .heatmap-title { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; text-align: center; }
  .heatmap-grid {
    display: grid;
    grid-template-columns: repeat(53, 1fr);
    grid-template-rows: repeat(7, 1fr);
    gap: 2px;
    max-width: 100%;
    overflow-x: auto;
    padding: 4px 0;
  }
  .heatmap-cell {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 2px;
    background: var(--accent2);
    transition: background 0.2s;
  }
  .heatmap-cell.level-0 { background: var(--accent2); }
  .heatmap-cell.level-1 { background: rgba(196,122,94,0.2); }
  .heatmap-cell.level-2 { background: rgba(196,122,94,0.4); }
  .heatmap-cell.level-3 { background: rgba(196,122,94,0.6); }
  .heatmap-cell.level-4 { background: rgba(196,122,94,0.85); }
  .heatmap-cell.today { box-shadow: 0 0 0 1.5px var(--primary) inset; }
  .heatmap-months {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 4px;
    padding: 0 2px;
  }

  /* ========== DATA PANEL ========== */
  .data-section {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 16px;
    margin: 12px;
  }
  .data-section h3 {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 6px;
    color: var(--text);
  }
  .data-section-desc {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 18px;
    line-height: 1.6;
  }
  .data-btn {
    display: block;
    width: 100%;
    padding: 13px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    background: var(--card-alt);
    color: var(--text);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    margin-bottom: 10px;
    text-align: center;
    transition: all 0.15s;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .data-btn:active { background: var(--accent); transform: scale(0.98); }
  .data-btn.primary {
    background: linear-gradient(145deg, var(--primary-light), var(--primary-dark));
    color: #fff;
    border-color: transparent;
    box-shadow: 0 4px 14px rgba(196,122,94,0.3);
  }
  .data-btn.danger {
    background: var(--danger-bg);
    color: var(--danger);
    border-color: #f0d0cc;
  }
  
  /* ========== PHOTO VIEWER ========== */
  .photo-viewer {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(30, 20, 15, 0.95);
    z-index: 2000;
    align-items: center;
    justify-content: center;
    padding: 20px;
    backdrop-filter: blur(8px);
  }
  .photo-viewer.show { display: flex; }
  .photo-viewer img {
    max-width: 100%;
    max-height: 85vh;
    border-radius: 10px;
    object-fit: contain;
  }
  .photo-viewer-hint {
    position: absolute;
    bottom: 40px;
    color: rgba(255,255,255,0.4);
    font-size: 12px;
  }
  
  /* ========== DAILY RECOMMEND ========== */
  .daily-recommend {
    margin: 12px 12px 6px;
    border-radius: var(--radius);
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
    padding: 16px 18px;
    box-shadow: var(--shadow);
    animation: recommendFadeIn 0.6s ease;
    position: relative;
    overflow: hidden;
  }
  .daily-recommend::before {
    content: '';
    position: absolute;
    top: -20px;
    right: -20px;
    width: 80px;
    height: 80px;
    background: rgba(196,122,94,0.08);
    border-radius: 50%;
    pointer-events: none;
  }
  @keyframes recommendFadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .daily-recommend-label {
    font-size: 11px;
    color: var(--primary);
    font-weight: 600;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .daily-recommend-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.5;
    margin-bottom: 10px;
  }
  .daily-recommend-btn {
    display: inline-block;
    padding: 8px 22px;
    background: linear-gradient(145deg, var(--primary-light), var(--primary-dark));
    color: #fff;
    border: none;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 3px 12px rgba(196,122,94,0.3);
    transition: transform 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  .daily-recommend-btn:active { transform: scale(0.95); }
  .daily-recommend-done {
    font-size: 13px;
    color: var(--success);
    font-weight: 600;
  }

  /* ========== CHAPTER ACHIEVEMENT ========== */
  .achievement-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(62,45,35,0.6);
    z-index: 4000;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }
  .achievement-overlay.show { display: flex; }
  .achievement-card {
    background: var(--card);
    border-radius: 24px;
    padding: 44px 30px 32px;
    text-align: center;
    max-width: 340px;
    width: 85%;
    animation: achievePop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 16px 50px rgba(0,0,0,0.2);
    position: relative;
    overflow: hidden;
  }
  @keyframes achievePop {
    from { transform: scale(0.5); opacity: 0; }
    70% { transform: scale(1.05); }
    to { transform: scale(1); opacity: 1; }
  }
  .achievement-icon {
    font-size: 56px;
    margin-bottom: 16px;
    animation: achieveBounce 0.8s ease 0.3s both;
  }
  @keyframes achieveBounce {
    0% { transform: scale(0) rotate(-20deg); }
    60% { transform: scale(1.3) rotate(5deg); }
    100% { transform: scale(1) rotate(0deg); }
  }
  .achievement-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 8px;
  }
  .achievement-sub {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 22px;
    line-height: 1.6;
  }
  .achievement-btn {
    padding: 12px 36px;
    background: linear-gradient(145deg, var(--primary-light), var(--primary-dark));
    color: #fff;
    border: none;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 4px 14px rgba(196,122,94,0.3);
    transition: transform 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  .achievement-btn:active { transform: scale(0.96); }
  /* 星星粒子 */
  .achievement-star {
    position: fixed;
    z-index: 4001;
    pointer-events: none;
    font-size: 22px;
    animation: starFly 1s ease-out forwards;
  }
  @keyframes starFly {
    0% { opacity: 1; transform: translate(0,0) scale(1); }
    100% { opacity: 0; transform: translate(var(--sx), var(--sy)) scale(0); }
  }

  /* ========== CHECK-IN RITUAL ========== */
  .ritual-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(62, 45, 35, 0.55);
    z-index: 3000;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(3px);
  }
  .ritual-overlay.show { display: flex; }
  .ritual-card {
    background: var(--card);
    border-radius: 24px;
    padding: 40px 32px 32px;
    text-align: center;
    max-width: 360px;
    width: 88%;
    animation: ritualPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 12px 40px rgba(0,0,0,0.18);
    position: relative;
    overflow: hidden;
  }
  @keyframes ritualPop {
    from { transform: scale(0.7); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .ritual-icon {
    font-size: 48px;
    margin-bottom: 16px;
    animation: ritualBounce 0.6s ease 0.3s both;
  }
  @keyframes ritualBounce {
    0% { transform: scale(0); }
    60% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  .ritual-quote {
    font-size: 16px;
    font-weight: 600;
    color: var(--primary);
    line-height: 1.7;
    margin-bottom: 12px;
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ritual-event {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 24px;
    padding: 10px 16px;
    background: var(--accent);
    border-radius: 10px;
    line-height: 1.5;
  }
  .ritual-btn {
    padding: 12px 40px;
    background: linear-gradient(145deg, var(--primary-light), var(--primary-dark));
    color: #fff;
    border: none;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 4px 14px rgba(196, 122, 94, 0.3);
    transition: transform 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  .ritual-btn:active { transform: scale(0.96); }

  /* Petals */
  .petal {
    position: fixed;
    z-index: 3001;
    pointer-events: none;
    font-size: 20px;
    animation: petalFall linear forwards;
  }
  @keyframes petalFall {
    0%   { opacity: 1; transform: translateY(0) rotate(0deg); }
    80%  { opacity: 0.8; }
    100% { opacity: 0; transform: translateY(100vh) rotate(720deg); }
  }

  /* ========== TOAST ========== */
  .toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(62, 45, 35, 0.88);
    backdrop-filter: blur(8px);
    color: #fff;
    padding: 12px 26px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 500;
    z-index: 9999;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }
  
  /* ========== SCROLLBAR ========== */
  ::-webkit-scrollbar { width: 0; height: 0; }
  * { scrollbar-width: none; }

  /* ========== MEDIA CONFIRM MODAL ========== */
  #mediaConfirmModal {
    display: none;
    align-items: center;
    justify-content: center;
  }
  #mediaConfirmModal.show { display: flex; }
  .media-confirm-modal {
    background: var(--card);
    border-radius: 22px;
    padding: 36px 28px 28px;
    text-align: center;
    max-width: 340px;
    width: 85%;
    animation: scaleIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  @keyframes scaleIn {
    from { transform: scale(0.85); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .media-confirm-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 8px;
  }
  .media-confirm-subtitle {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 28px;
  }
  .media-confirm-btns {
    display: flex;
    gap: 12px;
  }
  .media-confirm-btn {
    flex: 1;
    padding: 14px 0;
    border: none;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.15s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  .media-confirm-btn:active { opacity: 0.75; transform: scale(0.97); }
  .media-confirm-btn.yes {
    background: linear-gradient(145deg, var(--primary-light), var(--primary-dark));
    color: #fff;
    box-shadow: 0 4px 14px rgba(196, 122, 94, 0.3);
  }
  .media-confirm-btn.no {
    background: var(--card-alt);
    color: var(--text-light);
    border: 1.5px solid var(--border);
  }
</style>
</head>
<body>

<!-- ========== LOADING SCREEN ========== -->
<div id="loadingScreen">
  <canvas id="loadingCanvas"></canvas>
  <div id="loadingText"></div>
  <div id="loadingHint">正在孕育生命…</div>
</div>

<!-- HEADER -->
<div class="header">
  <h1>🌅 人生体验卡</h1>
  <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="切换主题">🌙</button>
  <div class="progress-circle-wrap">
    <svg class="progress-circle" viewBox="0 0 120 120">
      <circle class="progress-ring-bg" cx="60" cy="60" r="52"/>
      <circle class="progress-ring-fill" id="progressRing" cx="60" cy="60" r="52"/>
    </svg>
    <div class="progress-circle-text" id="progressText">0 / 96</div>
  </div>
</div>

<!-- SEARCH BOX -->
<div class="search-box" id="searchBox">
  <div class="search-input-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" class="search-input" id="searchInput" placeholder="搜索人生体验..." oninput="handleSearch()">
    <span class="search-clear" id="searchClear" onclick="clearSearch()">✕</span>
  </div>
  <div class="search-result" id="searchResult"></div>
</div>

<!-- MAIN LIST -->
<div class="main-list" id="mainList"></div>

<!-- TIMELINE VIEW -->
<div class="timeline-river-wrapper" id="timelineView">
    <div class="timeline-river"></div>
  </div>

<!-- STATS VIEW -->
<div class="stats-view" id="statsView"></div>

<!-- BOTTOM BAR -->
<div class="bottom-bar">
  <button class="bottom-btn active" onclick="switchTab('list')" id="tabList">
    <span class="icon">📋</span>清单
  </button>
  <button class="bottom-btn" onclick="switchTab('timeline')" id="tabTimeline">
    <span class="icon">🗓️</span>时光轴
  </button>
  <button class="bottom-btn" onclick="switchTab('stats')" id="tabStats">
    <span class="icon">📊</span>统计
  </button>
  <button class="bottom-btn" onclick="showDataPanel()" id="tabData">
    <span class="icon">⚙️</span>数据
  </button>
</div>

<!-- CHECK-IN MODAL -->
<div class="modal-overlay" id="checkinModal">
  <div class="modal">
    <div class="modal-title">✅ 打卡记录</div>
    <div class="modal-subtitle">记录这一刻，属于你的人生</div>
    <div class="modal-event-name" id="modalEventName"></div>
    <div class="form-group">
      <label class="form-label">📅 打卡日期</label>
      <input type="date" class="form-input" id="checkinDate">
    </div>
    <div class="form-group media-upload">
      <label class="form-label">📷 记录照片（可选）</label>
      <div class="photo-upload" id="photoUpload" onclick="document.getElementById('photoInput').click()">
        <span class="photo-upload-icon">📷</span>
        <span class="photo-upload-text">点击上传照片</span>
        <img class="photo-preview" id="photoPreview">
        <button class="photo-remove" onclick="removePhoto(event)">✕</button>
      </div>
      <input type="file" id="photoInput" accept="image/*" style="display:none" onchange="handlePhoto(event)">

<script>
// ========= LOADING ANIMATION ==========
(function(){
  var canvas = document.getElementById("loadingCanvas");
  if(!canvas) { finishLoading(); return; }
  var ctx = canvas.getContext("2d");
  var screen = document.getElementById("loadingScreen");
  var textEl = document.getElementById("loadingText");

  function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener("resize", resize);

  function W(){ return canvas.width; }
  function H(){ return canvas.height; }
  function cx(){ return canvas.width/2; }
  function cy(){ return canvas.height/2; }

  // 安全兜底：5秒后强制结束loading
  var safetyTimer = setTimeout(function() { finishLoading(); }, 5000);
  
  // 允许点击跳过
  if (screen) {
    screen.style.cursor = 'pointer';
    screen.onclick = function() { finishLoading(); };
  }

  // ===== Particle system =====
  var particles = [];
  function spawnP(x, y, count, colorFn, speed, life){
    for(var i=0;i<count;i++){
      var a = Math.random()*Math.PI*2;
      var s = speed * (0.3+Math.random()*0.7);
      var c = colorFn ? colorFn() : "rgba(255,220,140,0.8)";
      particles.push({x:x, y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s,
        life:life||60, maxLife:life||60, r:1+Math.random()*2.5,
        color:c});
    }
  }
  function tickP(){
    for(var i=particles.length-1;i>=0;i--){
      var p=particles[i];
      p.x+=p.vx; p.y+=p.vy; p.life--;
      if(p.life<=0){ particles.splice(i,1); }
    }
  }
  function drawP(){
    for(var i=0;i<particles.length;i++){
      var p=particles[i];
      var a = p.life / p.maxLife;
      ctx.globalAlpha = a * 0.8;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r*a, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function finishLoading(){
    if(screen){
      screen.style.display = "none";
    }
    animDone = true;
  }

  var frame = 0, animDone = false;
  var FPS = 60, SPD = 1000/FPS;

  function loop(){
    if(animDone) { finishLoading(); return; }
    ctx.clearRect(0, 0, W(), H());

    // ===== Phase 1: Two orbs approach (Milky White + Light Yellow) =====
    if(frame < 120){
      var t = frame / 120;
      var ease = t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2;
      var maxDist = W() * 0.38;
      var xLeft  = cx() - maxDist * (1 - ease);
      var xRight = cx() + maxDist * (1 - ease);
      var orbY = cy() + Math.sin(frame*0.04)*4;

      if(frame % 2 === 0){
        spawnP(xLeft, orbY, 1, function(){ return "rgba(220,230,255,"+(0.3+Math.random()*0.3)+")"; }, 0.3, 35);
        spawnP(xRight, orbY, 1, function(){ return "rgba(255,230,160,"+(0.3+Math.random()*0.3)+")"; }, 0.3, 35);
      }

      var oL_o = ctx.createRadialGradient(xLeft, orbY, 0, xLeft, orbY, 50+t*20);
      oL_o.addColorStop(0, "rgba(230,240,255,0.12)");
      oL_o.addColorStop(1, "rgba(230,240,255,0)");
      ctx.fillStyle = oL_o;
      ctx.beginPath(); ctx.arc(xLeft, orbY, 50+t*20, 0, Math.PI*2); ctx.fill();
      var oL_c = ctx.createRadialGradient(xLeft-4, orbY-4, 0, xLeft, orbY, 18);
      oL_c.addColorStop(0, "rgba(255,255,255,0.95)");
      oL_c.addColorStop(0.6, "rgba(210,225,255,0.8)");
      oL_c.addColorStop(1, "rgba(180,200,240,0.4)");
      ctx.fillStyle = oL_c;
      ctx.beginPath(); ctx.arc(xLeft, orbY, 18, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.85)";
      ctx.beginPath(); ctx.arc(xLeft, orbY, 7, 0, Math.PI*2); ctx.fill();

      var oR_o = ctx.createRadialGradient(xRight, orbY, 0, xRight, orbY, 50+t*20);
      oR_o.addColorStop(0, "rgba(255,230,150,0.13)");
      oR_o.addColorStop(1, "rgba(255,230,150,0)");
      ctx.fillStyle = oR_o;
      ctx.beginPath(); ctx.arc(xRight, orbY, 50+t*20, 0, Math.PI*2); ctx.fill();
      var oR_c = ctx.createRadialGradient(xRight+4, orbY-4, 0, xRight, orbY, 18);
      oR_c.addColorStop(0, "rgba(255,255,230,0.95)");
      oR_c.addColorStop(0.6, "rgba(255,220,130,0.8)");
      oR_c.addColorStop(1, "rgba(255,200,100,0.4)");
      ctx.fillStyle = oR_c;
      ctx.beginPath(); ctx.arc(xRight, orbY, 18, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "rgba(255,255,200,0.85)";
      ctx.beginPath(); ctx.arc(xRight, orbY, 7, 0, Math.PI*2); ctx.fill();
    } else if(frame < 200){
      var t = (frame - 120) / 80;
      var ease = 1 - Math.pow(1 - t, 3);
      var flash = Math.sin(t * Math.PI);

      ctx.save();
      ctx.globalAlpha = flash * 0.35;
      ctx.fillStyle = "#fffbe6";
      ctx.beginPath(); ctx.arc(cx(), cy(), W()*0.7*flash, 0, Math.PI*2); ctx.fill();
      ctx.restore();

      if(t < 0.6){
        var ringR = (t/0.6) * Math.max(W(),H())*0.45;
        ctx.save();
        ctx.globalAlpha = (1-t/0.6) * 0.4;
        ctx.strokeStyle = "rgba(255,220,140,0.8)";
        ctx.lineWidth = 3*(1-t/0.6)+1;
        ctx.beginPath(); ctx.arc(cx(), cy(), ringR, 0, Math.PI*2); ctx.stroke();
        ctx.strokeStyle = "rgba(255,240,200,0.5)";
        ctx.lineWidth = 6*(1-t/0.6)+1;
        ctx.beginPath(); ctx.arc(cx(), cy(), ringR*1.05, 0, Math.PI*2); ctx.stroke();
        ctx.restore();
      }

      var coreR = 8 + ease * 45;
      var coreGlow = ctx.createRadialGradient(cx(), cy(), 0, cx(), cy(), coreR * 2.5);
      coreGlow.addColorStop(0, "rgba(255,220,100,"+(0.3+flash*0.2)+")");
      coreGlow.addColorStop(0.4, "rgba(255,180,60,0.1)");
      coreGlow.addColorStop(1, "rgba(255,180,60,0)");
      ctx.fillStyle = coreGlow;
      ctx.beginPath(); ctx.arc(cx(), cy(), coreR*2.5, 0, Math.PI*2); ctx.fill();

      var danGrad = ctx.createRadialGradient(cx()-coreR*0.2, cy()-coreR*0.2, 0, cx(), cy(), coreR);
      danGrad.addColorStop(0, "rgba(255,250,220,0.98)");
      danGrad.addColorStop(0.5, "rgba(255,200,80,0.95)");
      danGrad.addColorStop(0.85, "rgba(220,150,40,0.9)");
      danGrad.addColorStop(1, "rgba(180,120,30,0.8)");
      ctx.fillStyle = danGrad;
      ctx.beginPath(); ctx.arc(cx(), cy(), coreR, 0, Math.PI*2); ctx.fill();

      ctx.save();
      ctx.globalAlpha = 0.25;
      ctx.strokeStyle = "rgba(255,255,200,0.7)";
      ctx.lineWidth = 1.2;
      for(var s=0; s<3; s++){
        var soff = s*2.1 + frame*0.03;
        ctx.beginPath();
        for(var a=0;a<=Math.PI*2;a+=0.08){
          var rr = coreR * (0.3 + 0.55*Math.sin(a*2+soff));
          var px = cx() + Math.cos(a)*rr;
          var py = cy() + Math.sin(a)*rr;
          if(a===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
        }
        ctx.closePath(); ctx.stroke();
      }
      ctx.restore();

      if(frame % 2 === 0 && t < 0.7){
        spawnP(cx(), cy(), 3, function(){
          return "hsl("+(35+Math.random()*25)+", "+(80+Math.random()*20)+"%, "+(65+Math.random()*20)+"%)";
        }, 1.5+Math.random()*2, 40+Math.random()*20);
      }
    } else if(frame < 340){
      var t = (frame - 200) / 140;
      var pulse = Math.sin(frame * 0.04) * 0.5 + 0.5;
      var rotateAngle = frame * 0.008;
      var coreR = 50 + pulse * 5;

      for(var L=0; L<3; L++){
        var Lr = coreR * (1.3 + L*0.45 + Math.sin(frame*0.03+L)*0.1);
        var Lg = ctx.createRadialGradient(cx(), cy(), coreR*0.8, cx(), cy(), Lr);
        Lg.addColorStop(0, "rgba(255,200,80,"+(0.08 - L*0.02)+")");
        Lg.addColorStop(1, "rgba(255,180,60,0)");
        ctx.fillStyle = Lg;
        ctx.beginPath(); ctx.arc(cx(), cy(), Lr, 0, Math.PI*2); ctx.fill();
      }

      ctx.save();
      ctx.translate(cx(), cy());
      ctx.rotate(rotateAngle);

      var danGrad2 = ctx.createRadialGradient(-coreR*0.15, -coreR*0.15, 0, 0, 0, coreR);
      danGrad2.addColorStop(0, "rgba(255,252,230,0.98)");
      danGrad2.addColorStop(0.4, "rgba(255,210,90,0.95)");
      danGrad2.addColorStop(0.75, "rgba(220,160,50,0.92)");
      danGrad2.addColorStop(1, "rgba(180,120,30,0.88)");
      ctx.fillStyle = danGrad2;
      ctx.beginPath(); ctx.arc(0, 0, coreR, 0, Math.PI*2); ctx.fill();

      ctx.globalAlpha = 0.18;
      ctx.strokeStyle = "rgba(255,255,200,0.7)";
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(0, 0, coreR*0.35, -Math.PI/2, Math.PI*1.5); ctx.stroke();
      ctx.beginPath(); ctx.arc(-coreR*0.12, 0, coreR*0.22, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc( coreR*0.12, 0, coreR*0.22, 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = "rgba(255,255,200,0.5)";
      ctx.beginPath(); ctx.arc(-coreR*0.12, 0, coreR*0.06, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc( coreR*0.12, 0, coreR*0.06, 0, Math.PI*2); ctx.fill();

      if(t > 0.35){
        var crackAlpha = Math.min(1, (t-0.35)/0.2);
        ctx.globalAlpha = crackAlpha * 0.6;
        ctx.strokeStyle = "rgba(255,100,30,0.8)";
        ctx.lineWidth = 1.8;
        ctx.lineCap = "round";
        for(var c=0; c<6; c++){
          var ca = c*(Math.PI/3) + frame*0.01;
          var innerR = coreR * (0.2 + Math.sin(frame*0.05+c)*0.1);
          var outerR = coreR * (0.75 + Math.sin(frame*0.03+c)*0.15);
          ctx.beginPath();
          ctx.moveTo(Math.cos(ca)*innerR, Math.sin(ca)*innerR);
          ctx.quadraticCurveTo(
            Math.cos(ca+0.2)*outerR*0.7, Math.sin(ca+0.2)*outerR*0.7,
            Math.cos(ca)*outerR, Math.sin(ca)*outerR);
          ctx.stroke();
        }
        ctx.globalAlpha = crackAlpha * 0.35;
        ctx.fillStyle = "rgba(255,180,50,0.7)";
        ctx.beginPath(); ctx.arc(0, 0, coreR*1.05, 0, Math.PI*2); ctx.fill();
      }
      ctx.restore();

      if(frame % 4 === 0){
        var fa = Math.random()*Math.PI*2;
        var fd = coreR*1.2 + Math.random()*40;
        spawnP(cx()+Math.cos(fa)*fd, cy()+Math.sin(fa)*fd, 1,
          function(){ return "rgba(255,220,140,"+(0.3+Math.random()*0.3)+")"; }, 0.2, 50);
      }

      if(t > 0.6){
        var intensity = (t-0.6)/0.4 * pulse;
        ctx.save();
        ctx.globalAlpha = intensity * 0.18;
        ctx.fillStyle = "#fffbe6";
        ctx.beginPath(); ctx.arc(cx(), cy(), coreR*(1.5+intensity*0.8), 0, Math.PI*2); ctx.fill();
        ctx.restore();
      }
    } else if(frame < 415){
      // Phase 4: shatter — FIXED denominator: 415-340=75
      var t = (frame - 340) / 75;
      var ease = 1 - Math.pow(1 - Math.min(t,1), 3);

      if(t < 0.4){
        var st = t / 0.4;
        var stEase = 1 - Math.pow(1-st, 2);

        var burstR = stEase * Math.max(W(),H())*0.5;
        ctx.save();
        ctx.globalAlpha = (1-stEase)*0.3;
        ctx.strokeStyle = "rgba(255,220,120,0.9)";
        ctx.lineWidth = 4*(1-stEase)+1;
        ctx.beginPath(); ctx.arc(cx(), cy(), burstR, 0, Math.PI*2); ctx.stroke();
        ctx.restore();

        if(frame % 2 === 0){
          for(var i=0;i<5;i++){
            var sa = Math.random()*Math.PI*2;
            var sd = 20 + Math.random()*30;
            spawnP(cx()+Math.cos(sa)*sd, cy()+Math.sin(sa)*sd, 1,
              function(){ return "rgba("+(200+Math.random()*55)+","+(140+Math.random()*80)+","+(30+Math.random()*40)+",0.8)"; },
              2+Math.random()*3, 35+Math.random()*25);
          }
        }

        var remR = 50 * (1 - stEase*0.7);
        ctx.save();
        ctx.globalAlpha = 1 - stEase*0.6;
        var remGrad = ctx.createRadialGradient(cx(), cy(), 0, cx(), cy(), remR);
        remGrad.addColorStop(0, "rgba(255,240,200,0.9)");
        remGrad.addColorStop(1, "rgba(220,160,50,0.7)");
        ctx.fillStyle = remGrad;
        for(var f=0;f<6;f++){
          var fa2 = f*(Math.PI/3) + stEase*2;
          var fr = remR * (0.4 + 0.6*(1-stEase*0.5));
          ctx.beginPath();
          ctx.arc(cx()+Math.cos(fa2)*remR*0.2*stEase, cy()+Math.sin(fa2)*remR*0.2*stEase, fr*0.55, fa2, fa2+Math.PI/3);
          ctx.arc(cx(), cy(), remR*0.3, fa2+Math.PI/3, fa2, true);
          ctx.fill();
        }
        ctx.restore();
      }
      // When t>=0.4: nothing to draw, just let particles finish

    } else {
      // Phase 5: fade out
      var t = Math.min(1, (frame - 415) / 40);
      if(screen) screen.style.opacity = 1 - t;
      if(t >= 1){
        finishLoading();
        return;
      }
    }

    tickP();
    drawP();

    frame++;
    setTimeout(loop, SPD);
  }

  setTimeout(loop, 100);
})();



// ========== GLOBAL ERROR HANDLER ==========
window.onerror = function(msg, url, line, col, error) {
  console.error('全局错误:', msg, 'at', url, ':', line);
  // 如果加载界面还显示着，强制关闭
  var screen = document.getElementById('loadingScreen');
  if (screen && screen.style.display !== 'none') {
    console.log('加载界面卡住，强制关闭');
    screen.style.display = 'none';
    showToast('⚠️ 加载动画异常，已自动跳过');
  }
  return false;
};

// ========== INDEXEDDB HELPERS ==========
var mediaDB = null;
function openMediaDB() {
  if (mediaDB) return Promise.resolve(mediaDB);
  return new Promise(function(resolve, reject) {
    var req = indexedDB.open('lifeCheckinMedia', 1);
    req.onupgradeneeded = function(e) {
      var db = e.target.result;
      if (!db.objectStoreNames.contains('media')) {
        db.createObjectStore('media', { keyPath: 'id', autoIncrement: true });
      }
    };
    req.onsuccess = function(e) { mediaDB = e.target.result; resolve(mediaDB); };
    req.onerror = function() { reject(req.error); };
  });
}

function saveMediaToDB(eventId, callback) {
  openMediaDB().then(function(db) {
    var tx = db.transaction(['media'], 'readwrite');
    var store = tx.objectStore('media');
    // 收集该 eventId 的现有记录（按 type 分类）
    var existing = {};
    store.openCursor().onsuccess = function(e) {
      var cursor = e.target.result;
      if (cursor) {
        if (cursor.value.eventId === eventId) {
          existing[cursor.value.type] = cursor.value;
        }
        cursor.continue();
      } else {
        // 删除事务完成后，开始写入新数据
        var tx2 = db.transaction(['media'], 'readwrite');
        var store2 = tx2.objectStore('media');

        // Photo：有新版则更新，为 null 则删除已有记录
        if (tempPhotoData) {
          if (existing.photo) store2.delete(existing.photo.id);
          store2.add({ eventId: eventId, type: 'photo', data: tempPhotoData, timestamp: Date.now() });
        } else {
          // tempPhotoData 为 null，删除已有照片
          if (existing.photo) store2.delete(existing.photo.id);
        }

        // Audio
        if (tempAudioData) {
          if (existing.audio) store2.delete(existing.audio.id);
          store2.add({ eventId: eventId, type: 'audio', data: tempAudioData, timestamp: Date.now() });
        } else if (tempRemoveAudio) {
          if (existing.audio) store2.delete(existing.audio.id);
        }
        // 两者都不满足：不动已有音频记录

        // Video
        if (tempVideoData) {
          if (existing.video) store2.delete(existing.video.id);
          store2.add({ eventId: eventId, type: 'video', data: tempVideoData, timestamp: Date.now() });
        } else if (tempRemoveVideo) {
          if (existing.video) store2.delete(existing.video.id);
        }
        // 两者都不满足：不动已有视频记录

        tx2.oncomplete = function() { if (callback) callback(); };
        tx2.onerror = function() { if (callback) callback(); };
      }
    };
  }).catch(function() { if (callback) callback(); });
}

function getMediaForEvent(eventId, callback) {
  openMediaDB().then(function(db) {
    var tx = db.transaction(['media'], 'readonly');
    var store = tx.objectStore('media');
    var result = { photo: null, audio: null, video: null };
    store.openCursor().onsuccess = function(e) {
      var cursor = e.target.result;
      if (cursor) {
        if (cursor.value.eventId === eventId) {
          result[cursor.value.type] = cursor.value.data;
        }
        cursor.continue();
      } else {
        callback(result);
      }
    };
  }).catch(function() { callback({ photo: null, audio: null, video: null }); });
}

function deleteMediaForEvent(eventId, callback) {
  openMediaDB().then(function(db) {
    var tx = db.transaction(['media'], 'readwrite');
    var store = tx.objectStore('media');
    store.openCursor().onsuccess = function(e) {
      var cursor = e.target.result;
      if (cursor) {
        if (cursor.value.eventId === eventId) store.delete(cursor.primaryKey);
        cursor.continue();
      } else {
        if (callback) callback();
      }
    };
  }).catch(function() { if (callback) callback(); });
}

function getStorageUsage(callback) {
  if (navigator.storage && navigator.storage.estimate) {
    navigator.storage.estimate().then(function(estimate) {
      callback({
        localStorage: JSON.stringify(checkinData).length,
        indexedDB: estimate.usage || 0,
        quota: estimate.quota || 0
      });
    });
  } else {
    var size = JSON.stringify(checkinData).length;
    callback({ localStorage: size, indexedDB: 0, quota: 0 });
  }
}

function renderList() {

  CHAPTERS.forEach(function(ch, ci) {
    var chapterDiv = document.createElement('div');

    chapterDiv.id = 'chapter-' + ci;

    ch.events.forEach(function(_, ei) {
      if (checkinData[ci + '-' + ei]) checkedCount++;
    });

      '<div class="chapter-header" onclick="toggleChapter(' + ci + ')">' +
        '<span class="chapter-icon">' + ch.icon + '</span>' +
        '<div class="chapter-body">' +
          '<div class="chapter-title">' + escapeHtml(ch.title) + '</div>' +
          '<div class="chapter-sub">' + escapeHtml(ch.subtitle) + '</div>' +
        '</div>' +
        '<div class="chapter-right">' +
          '<span class="chapter-count">' + checkedCount + '/' + ch.events.length + '</span>' +
          '<span class="chapter-arrow">▼</span>' +
        '</div>' +
      '</div>' +
      '<div class="chapter-items">' +
        ch.events.map(function(ev, ei) {
          var id = ci + '-' + ei;
          var checked = checkinData[id];
          var metaHtml = checked ? renderMeta(checked) : '';
          return '' +
            '<div class="event-item' + (checked ? ' checked' : '') + '" onclick="confirmMediaUpload(\'' + id + '\')">' +
              '<div class="event-check">' + (checked ? '✓' : '') + '</div>' +
              '<div class="event-info">' +
                '<div class="event-name">' + escapeHtml(ev) + '</div>' +
                metaHtml +
              '</div>' +
            '</div>';
        }).join('') +
      '</div>';

    container.appendChild(chapterDiv);
  });
}

function renderMeta(data) {
  var parts = [];
  if (data.date) parts.push('📅 ' + data.date);
  if (data.photo) parts.push('📷 有照片');
  if (data.note) parts.push('💬 ' + escapeHtml(data.note.substring(0, 15)) + (data.note.length > 15 ? '…' : ''));
  if (parts.length === 0) return '';
  return '<div class="event-meta"><span>' + parts.join('</span><span>·</span><span>') + '</span></div>';
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.appendChild(document.createTextNode(str));
  return div.innerHTML;
}

function toggleChapter(ci) {
  var el = document.getElementById('chapter-' + ci);
  el.classList.toggle('open');
}

// ========== SEARCH ==========
function handleSearch() {
  var input = document.getElementById('searchInput');
  var clearBtn = document.getElementById('searchClear');
  var resultDiv = document.getElementById('searchResult');
  var term = input.value.trim().toLowerCase();
  
  if (term) {
    clearBtn.classList.add('show');
    resultDiv.classList.add('show');
  } else {
    clearBtn.classList.remove('show');
    resultDiv.classList.remove('show');
  }
  
  // 遍历所有章节和事件
  var totalVisible = 0;
  var totalMatched = 0;
  
  CHAPTERS.forEach(function(ch, ci) {
    var chapterEl = document.getElementById('chapter-' + ci);
    var items = chapterEl ? chapterEl.querySelectorAll('.event-item') : [];
    var chapterMatched = 0;
    
    items.forEach(function(item) {
      var nameEl = item.querySelector('.event-name');
      if (!nameEl) return;
      
      var name = nameEl.textContent.toLowerCase();
      var match = name.indexOf(term) !== -1;
      
      if (match) {
        item.classList.remove('hidden-event');
        chapterMatched++;
        totalMatched++;
      } else {
        item.classList.add('hidden-event');
      }
    });
    
    // 显示/隐藏章节
    if (chapterMatched > 0 || !term) {
      chapterEl.classList.remove('hidden-chapter');
      totalVisible++;
    } else {
      chapterEl.classList.add('hidden-chapter');
    }
  });
  
  // 显示搜索结果统计
  if (term) {
    resultDiv.textContent = '找到 ' + totalMatched + ' 个匹配结果（共 ' + totalVisible + ' 个章节）';
  }
}

function clearSearch() {
  var input = document.getElementById('searchInput');
  var clearBtn = document.getElementById('searchClear');
  var resultDiv = document.getElementById('searchResult');
  
  input.value = '';
  clearBtn.classList.remove('show');
  resultDiv.classList.remove('show');
  resultDiv.textContent = '';
  
  // 显示所有章节和事件
  CHAPTERS.forEach(function(ch, ci) {
    var chapterEl = document.getElementById('chapter-' + ci);
    if (chapterEl) {
      chapterEl.classList.remove('hidden-chapter');
      var items = chapterEl.querySelectorAll('.event-item');
      items.forEach(function(item) {
        item.classList.remove('hidden-event');
      });
    }
  });
}

var PROGRESS_CIRC = 2 * Math.PI * 52; // 圆周长 ≈ 326.726
function updateProgress() {
  var done = Object.keys(checkinData).length;
  var pct = TOTAL > 0 ? Math.round(done / TOTAL * 100) : 0;
  var offset = PROGRESS_CIRC * (1 - pct / 100);
  document.getElementById('progressRing').style.strokeDashoffset = offset;
  document.getElementById('progressText').innerHTML = '<span class="pct">' + pct + '%</span>' + done + ' / ' + TOTAL + ' 经历';
}

function openCheckinModal(eventId, withMedia) {
  currentEventId = eventId;
  tempPhotoData = null;
  tempAudioData = null;
  tempVideoData = null;
  tempRemoveAudio = false;
  tempRemoveVideo = false;
  var ev = ALL_EVENTS.find(function(e) { return e.id === eventId; });

  if (existing) {

  } else {
    document.getElementById('checkinDate').value = new Date().toISOString().split('T')[0];
    document.getElementById('checkinNote').value = '';

    clearMediaPreview();
    document.getElementById('deleteBtnWrap').style.display = 'none';

  currentWithMedia = withMedia;
  var mediaWraps = document.querySelectorAll('.media-upload');
  for (var i = 0; i < mediaWraps.length; i++) {

function closeModal() {
  document.getElementById('checkinModal').classList.remove('show');
  currentEventId = null;
  tempPhotoData = null;
}

function submitCheckin() {
  if (!currentEventId) return;
  var date = document.getElementById('checkinDate').value;
  var note = document.getElementById('checkinNote').value.trim();
  var existing = checkinData[currentEventId];
  var ev = ALL_EVENTS.find(function(e) { return e.id === currentEventId; });
  var chapterIdx = ev ? ev.chapter : -1;

  if (currentWithMedia) {
    var audioFlag = !!(tempAudioData || (existing && !!existing.hasAudio && !tempRemoveAudio));
    var videoFlag = !!(tempVideoData || (existing && !!existing.hasVideo && !tempRemoveVideo));
    checkinData[currentEventId] = {
      date: date,
      photo: tempPhotoData,
      hasAudio: !!audioFlag,
      hasVideo: !!videoFlag,
      note: note,
      timestamp: Date.now()
    };
    saveData();
    saveMediaToDB(currentEventId, function() {
      closeModal();
      // 检查章节成就
      checkChapterAchievement(chapterIdx);
      showRitual(ev ? ev.name : '未知经历');
    });
  } else {
    checkinData[currentEventId] = {
      date: date,
      photo: existing ? existing.photo : null,
      hasAudio: existing ? !!existing.hasAudio : false,
      hasVideo: existing ? !!existing.hasVideo : false,
      note: note,
      timestamp: Date.now()
    };
    saveData();
    closeModal();
    // 检查章节成就
    checkChapterAchievement(chapterIdx);
    showRitual(ev ? ev.name : '未知经历');
  }
}

function deleteCheckin() {
  if (!currentEventId) return;
  deleteMediaForEvent(currentEventId, function() {
    delete checkinData[currentEventId];
    saveData();
    closeModal();
    renderList();
    updateProgress();
    showToast('已删除打卡记录');
  });
}

// ========== PHOTO ==========
function handlePhoto(e) {
  var file = e.target.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) {
    showToast('⚠️ 照片不能超过 5MB');
    return;
  }
  var reader = new FileReader();
  reader.onload = function(ev) {
    compressImage(ev.target.result, 600, 0.65).then(function(compressed) {
      tempPhotoData = compressed;
      showPhotoPreview(compressed);
    });
  };
  reader.readAsDataURL(file);
}

function compressImage(dataUrl, maxW, quality) {
  return new Promise(function(resolve) {
    var img = new Image();
    img.onload = function() {
      var w = img.width, h = img.height;
      if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = dataUrl;
  });
}

  var upload = document.getElementById('photoUpload');

  var audioPreview = document.getElementById('audioPreview');
  var videoPreview = document.getElementById('videoPreview');
  if (audioPreview) { audioPreview.src = ''; audioPreview.style.display = 'none'; }
  if (videoPreview) { videoPreview.src = ''; videoPreview.style.display = 'none'; }

// ========== TIMELINE ==========
var timelineObserver = null;
var lazyImageObserver = null;
var allTimelineEntries = []; // 存储所有时间线条目
var renderedTimelineCount = 0; // 已渲染的条目数
var isLoadingTimeline = false; // 是否正在加载
var TIMELINE_BATCH_SIZE = 15; // 每次渲染的条目数

function setupTimelineObserver() {
  if (timelineObserver) return;
  timelineObserver = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      var el = entry.target;
      var mediaWrap = el.querySelector('.tl-media-wrap');
      if (!mediaWrap) return;
      var audios = mediaWrap.querySelectorAll('audio');
      var videos = mediaWrap.querySelectorAll('video');
      if (entry.isIntersecting) {
        el.classList.add('playing');
        audios.forEach(function(a) { a.play().catch(function(){}); });
        videos.forEach(function(v) { v.play().catch(function(){}); });
      } else {
        el.classList.remove('playing');
        audios.forEach(function(a) { a.pause(); });
        videos.forEach(function(v) { v.pause(); });
      }
    });
  }, { threshold: 0.5 });
}

// 图片懒加载观察器
var lazyImageObserver = null;
function setupImageLazyLoad() {
  if (lazyImageObserver) return;
  lazyImageObserver = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        var img = entry.target;
        var dataSrc = img.getAttribute('data-src');
        if (dataSrc && !img.src) {
          img.src = dataSrc;
          img.removeAttribute('data-src');
          img.removeAttribute('data-lazy');
          img.classList.add('loaded');
        }
        lazyImageObserver.unobserve(img);
      }
    });
  }, { rootMargin: '100px' });
}

function renderTimeline() {
  var container = document.getElementById('timelineView');
  var river = container.querySelector('.timeline-river');
  // 清空非 river 的内容
  var children = Array.from(container.children);
  children.forEach(function(c) {
    if (!c.classList.contains('timeline-river')) c.remove();
  });

  // 准备所有条目
  allTimelineEntries = [];
  ALL_EVENTS.forEach(function(ev) {
    var data = checkinData[ev.id];
    if (data && data.date) {
      allTimelineEntries.push({ id: ev.id, chapter: ev.chapter, name: ev.name, date: data.date, photo: data.photo, note: data.note, hasAudio: !!data.hasAudio, hasVideo: !!data.hasVideo, hasPhoto: !!data.photo });
    }
  });

  allTimelineEntries.sort(function(a, b) {
    if (a.date > b.date) return -1;
    if (a.date < b.date) return 1;
    return 0;
  });

  if (allTimelineEntries.length === 0) {
    container.innerHTML = '<div class="timeline-empty">🌱<br>还没有打卡记录<br>去清单里点亮你的第一个经历吧</div>';
    return;
  }

  // 重置渲染计数
  renderedTimelineCount = 0;
  isLoadingTimeline = false;

  // 渲染第一批
  renderTimelineBatch(container);

  // 添加哨兵元素用于无限滚动
  addTimelineSentinel(container);
}

function renderTimelineBatch(container) {
  if (isLoadingTimeline || renderedTimelineCount >= allTimelineEntries.length) return;
  
  isLoadingTimeline = true;
  var end = Math.min(renderedTimelineCount + TIMELINE_BATCH_SIZE, allTimelineEntries.length);
  var htmlParts = [];
  
  for (var i = renderedTimelineCount; i < end; i++) {
    var ev = allTimelineEntries[i];
    var year = ev.date.split('-')[0];
    var lastYear = i > 0 ? allTimelineEntries[i-1].date.split('-')[0] : '';
    
    if (year !== lastYear) {
      htmlParts.push('<div class="timeline-year-marker" style="top:auto;position:relative;display:inline-block;left:50%;transform:translateX(-50%);margin:18px auto;">' + year + ' 年</div>');
    }
    
    var ch = CHAPTERS[ev.chapter];
    var dateParts = ev.date.split('-');
    var side = (i % 2 === 0) ? 'left' : 'right';
    var hasMedia = ev.hasPhoto || ev.hasAudio || ev.hasVideo;
    var mediaClass = hasMedia ? 'has-media' : 'no-media';
    
    var noteHtml = ev.note ? '<div class="tl-note">💬 ' + escapeHtml(ev.note) + '</div>' : '';
    var photoHtml = ev.photo ? '<div class="tl-photo-placeholder">📷</div><img class="tl-photo" data-event-id="' + ev.id + '" data-src="' + ev.photo + '" data-lazy="true" alt="' + escapeHtml(ev.name) + '">' : '';
    var fleetingMsg = (!hasMedia) ? '<div class="fleeting-msg">「这一刻，只存在于记忆里」<br><span style="font-size:10px;opacity:0.5;">谁的人生没点遗憾呢</span></div>' : '';
    var mediaDivId = 'tl-media-' + ev.id;
    
    htmlParts.push(
      '<div class="tl-item ' + side + ' ' + mediaClass + '" id="tl-item-' + ev.id + '">' +
        '<div class="tl-card">' +
          '<div class="tl-date">' + dateParts[0] + '.' + parseInt(dateParts[1]) + '.' + parseInt(dateParts[2]) + '</div>' +
          '<div class="tl-chapter">' + ch.icon + ' ' + ch.title + '</div>' +
          '<div class="tl-name">' + escapeHtml(ev.name) + '</div>' +
          noteHtml +
          photoHtml +
          '<div class="tl-media-wrap" id="' + mediaDivId + '"></div>' +
          fleetingMsg +
        '</div>' +
      '</div>'
    );
  }
  
  container.insertAdjacentHTML('beforeend', htmlParts.join('\n'));
  renderedTimelineCount = end;
  isLoadingTimeline = false;
  
  // 设置图片懒加载
  setupImageLazyLoad();
  container.querySelectorAll('.tl-photo[data-lazy="true"]').forEach(function(img) {
    if (lazyImageObserver) lazyImageObserver.observe(img);
  });
  
  // 照片点击查看大图
  container.querySelectorAll('.tl-photo').forEach(function(img) {
    img.addEventListener('click', function() {
      viewPhoto(this.getAttribute('data-event-id'));
    });
  });
  
  // 异步加载 IndexedDB 中的音视频
  for (var j = renderedTimelineCount - TIMELINE_BATCH_SIZE; j < end; j++) {
    var ev = allTimelineEntries[j];
    if (ev.hasAudio || ev.hasVideo) {
      getMediaForEvent(ev.id, function(media, eventId) {
        var mediaDiv = document.getElementById('tl-media-' + eventId);
        if (!mediaDiv) return;
        if (media.audio) {
          var audio = document.createElement('audio');
          audio.controls = true;
          audio.preload = 'metadata';
          audio.src = URL.createObjectURL(media.audio);
          mediaDiv.appendChild(audio);
        }
        if (media.video) {
          var video = document.createElement('video');
          video.controls = true;
          video.preload = 'metadata';
          video.src = URL.createObjectURL(media.video);
          mediaDiv.appendChild(video);
        }
        setupTimelineObserver();
        var el = document.getElementById('tl-item-' + eventId);
        if (el && timelineObserver) timelineObserver.observe(el);
      }.bind(null, ev.id));
    } else {
      setupTimelineObserver();
      var el = document.getElementById('tl-item-' + ev.id);
      if (el && timelineObserver) timelineObserver.observe(el);
    }
  }
  
  // 如果还有更多条目，添加哨兵元素
  if (renderedTimelineCount < allTimelineEntries.length) {
    addTimelineSentinel(container);
  }
}

function addTimelineSentinel(container) {
  // 移除旧的哨兵
  var oldSentinel = document.getElementById('timeline-sentinel');
  if (oldSentinel) oldSentinel.remove();
  
  // 添加新哨兵
  var sentinel = document.createElement('div');
  sentinel.id = 'timeline-sentinel';
  sentinel.style.height = '1px';
  container.appendChild(sentinel);
  
  if (window.timelineSentinelObserver) window.timelineSentinelObserver.disconnect();
  
  window.timelineSentinelObserver = new IntersectionObserver(function(entries) {
    if (entries[0].isIntersecting) {
      renderTimelineBatch(container);
    }
  }, { rootMargin: '200px' });
  
  window.timelineSentinelObserver.observe(sentinel);
}

function buildHeatmap(container) {
  var today = new Date();
  var startDate = new Date(today);
  startDate.setDate(startDate.getDate() - 364); // 一年前
  startDate = new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate());

  // 按日期索引打卡次数
  var countMap = {};
  Object.keys(checkinData).forEach(function(k) {
    var d = checkinData[k].date;
    if (!d) return;
    countMap[d] = (countMap[d] || 0) + 1;
  });

  // 构建按周的网格 (53列 x 7行)
  var weeks = [];
  var current = new Date(startDate);
  // 调整到本周的周日
  while (current.getDay() !== 0) {
    current.setDate(current.getDate() - 1);
  }

  var week = [];
  while (current <= today) {
    var ds = current.getFullYear() + '-' + String(current.getMonth()+1).padStart(2,'0') + '-' + String(current.getDate()).padStart(2,'0');
    week.push({ date: ds, dow: current.getDay() });
    if (current.getDay() === 6) {
      weeks.push(week);
      week = [];
    }
    current.setDate(current.getDate() + 1);
  }
  if (week.length > 0) weeks.push(week);

  // 生成网格 HTML
  var gridEl = document.getElementById('heatmapGrid');
  if (!gridEl) {
    // 还没渲染到DOM，需要在渲染后调用
    setTimeout(function() { buildHeatmap(null); }, 100);
    return;
  }

  gridEl.innerHTML = '';
  weeks.forEach(function(week) {
    for (var d=0; d<7; d++) {
      var cell = week.find(function(w) { return w.dow === d; });
      var level = 0;
      if (cell) {
        var cnt = countMap[cell.date] || 0;
        if (cnt >= 4) level = 4;
        else if (cnt >= 3) level = 3;
        else if (cnt >= 2) level = 2;
        else if (cnt >= 1) level = 1;
      }
      var div = document.createElement('div');
      div.className = 'heatmap-cell level-' + level + (cell && cell.date === (today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0')) ? ' today' : '');
      if (cell) div.title = cell.date + '：' + (countMap[cell.date]||0) + ' 个打卡';
      gridEl.appendChild(div);
    }
  });

  // 月份标签
  var monthsEl = document.getElementById('heatmapMonths');
  if (monthsEl) {
    monthsEl.innerHTML = '';
    var lastMonth = -1;
    weeks.forEach(function(week, wi) {
      if (week.length === 0) return;
      var m = new Date(week[0].date).getMonth();
      if (m !== lastMonth) {
        var span = document.createElement('span');
        span.textContent = (m+1) + '月';
        span.style.gridColumn = wi + 1;
        monthsEl.appendChild(span);
        lastMonth = m;
      }
    });
  }

  var titleEl = document.getElementById('heatmapTitle');
  if (titleEl) {
    titleEl.textContent = '过去一年（' + startDate.getFullYear() + '.' + (startDate.getMonth()+1) + '.' + startDate.getDate() + ' - ' + (today.getMonth()+1) + '.' + today.getDate() + '）';
  }
}

function resetApp() {
  try {
    // 清除 localStorage
    localStorage.removeItem('lifeCheckinData');
    localStorage.removeItem('lifeCheckinTheme');
    localStorage.removeItem('lifeCheckinDaily');
    
    // 清除 IndexedDB
    if (mediaDB) {
      mediaDB.close();
      mediaDB = null;
    }
    var req = indexedDB.deleteDatabase('lifeCheckinMedia');
    req.onsuccess = function() {
      console.log('IndexedDB 已清除');
      showToast('✅ 应用已重置，正在重新加载...');
      setTimeout(function() { location.reload(); }, 1000);
    };
    req.onerror = function() {
      console.log('IndexedDB 清除失败，但继续重置');
      showToast('✅ 应用已重置，正在重新加载...');
      setTimeout(function() { location.reload(); }, 1000);
    };
  } catch(e) {
    console.error('重置应用出错:', e);
    showToast('⚠️ 重置出错，请手动刷新页面');
  }
}
