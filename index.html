<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>人生体验卡</title>
<style>
  /* ========== LOADING SCREEN ========== */
  #loadingScreen {
    position: fixed;
    inset: 0;
    z-index: 99999;
    background: #1a0e0a;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.8s ease;
  }
  #loadingScreen.fade-out { opacity: 0; pointer-events: none; }
  #loadingCanvas { display: block; }
  #loadingText {
    position: absolute;
    bottom: 18%;
    left: 50%;
    transform: translateX(-50%);
    color: #fce8d8;
    font-size: 16px;
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.5s;
    text-align: center;
    white-space: nowrap;
    text-shadow: 0 0 12px rgba(255,200,150,0.5);
    letter-spacing: 2px;
  }
  #loadingText.show { opacity: 1; }
  #loadingHint {
    position: absolute;
    bottom: 10%;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(252,232,216,0.4);
    font-size: 12px;
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:0.7} }
  
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  :root {
    --bg: #fdf8f4;
    --card: #ffffff;
    --card-alt: #fefaf6;
    --primary: #c47a5e;
    --primary-light: #d4957a;
    --primary-dark: #a8624a;
    --accent: #fce8d8;
    --accent2: #f5d8c5;
    --text: #3e2d23;
    --text-light: #8b6f5e;
    --text-muted: #b5a090;
    --border: #f0ddd0;
    --success: #7cb89a;
    --danger: #d4837a;
    --danger-bg: #fdf0ef;
    --shadow: 0 2px 16px rgba(180, 140, 100, 0.10);
    --shadow-hover: 0 4px 20px rgba(180, 140, 100, 0.18);
    --radius: 16px;
    --radius-sm: 10px;
    --transition-theme: background 0.4s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
  }

  /* ========== THEME TRANSITION ========== */
  html.theme-transitioning,
  html.theme-transitioning * {
    transition: background 0.4s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease !important;
  }

  /* ========== DARK THEME ========== */
  html.dark-theme {
    --bg: #1a1410;
    --card: #2a211b;
    --card-alt: #332820;
    --primary: #d4957a;
    --primary-light: #e0a88c;
    --primary-dark: #c47a5e;
    --accent: #3e2d23;
    --accent2: #4a3528;
    --text: #f0ddd0;
    --text-light: #d4b89a;
    --text-muted: #8b6f5e;
    --border: #4a3528;
    --success: #7cb89a;
    --danger: #d4837a;
    --danger-bg: #3e2020;
    --shadow: 0 2px 16px rgba(0, 0, 0, 0.3);
    --shadow-hover: 0 4px 20px rgba(0, 0, 0, 0.4);
  }
  html.dark-theme body { background: var(--bg); color: var(--text); }
  html.dark-theme .header { background: linear-gradient(145deg, #3a2a1e 0%, #2a1e14 50%, #1e1410 100%); }
  html.dark-theme .header[data-tab="timeline"] { background: linear-gradient(145deg, #1a2040 0%, #0f1830 50%, #080e20 100%); }
  html.dark-theme .header[data-tab="stats"] { background: linear-gradient(145deg, #1a2e28 0%, #0f2018 50%, #08150e 100%); }
  html.dark-theme .bottom-bar { background: rgba(42,33,27,0.92); border-top-color: rgba(74,53,40,0.5); }
  html.dark-theme .photo-viewer { background: rgba(10,8,6,0.95); }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 80px;
    -webkit-font-smoothing: antialiased;
  }
  
  /* ========== HEADER ========== */
  .header {
    background: linear-gradient(145deg, #d4a574 0%, #c47a5e 50%, #b86248 100%);
    padding: 24px 16px 28px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(160, 100, 60, 0.25);
    transition: background 0.6s ease, box-shadow 0.6s ease;
  }
  .header[data-tab="timeline"] {
    background: linear-gradient(145deg, #0f1a2e 0%, #1a2744 50%, #0d1520 100%);
    box-shadow: 0 4px 20px rgba(0, 20, 60, 0.35);
  }
  .header[data-tab="stats"] {
    background: linear-gradient(145deg, #1a2e28 0%, #1e3a30 50%, #0d2018 100%);
    box-shadow: 0 4px 20px rgba(0, 40, 30, 0.3);
  }
  .header h1 {
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 1px;
    margin-bottom: 14px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.12);
    display: inline-block;
  }
  .theme-toggle {
    position: absolute;
    top: 24px;
    right: 16px;
    background: rgba(255,255,255,0.18);
    border: 1.5px solid rgba(255,255,255,0.3);
    color: #fff;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, transform 0.15s;
    -webkit-tap-highlight-color: transparent;
    backdrop-filter: blur(4px);
  }
  .theme-toggle:active { transform: scale(0.9); background: rgba(255,255,255,0.25); }
  .progress-outer {
    background: rgba(255,255,255,0.22);
    border-radius: 20px;
    height: 12px;
    overflow: hidden;
    margin: 0 auto 8px;
    max-width: 300px;
    backdrop-filter: blur(4px);
  }
  .progress-inner {
    height: 100%;
    border-radius: 20px;
    background: linear-gradient(90deg, #fce8d8, #ffffff);
    transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    width: 0%;
    position: relative;
  }
  .progress-inner::after {
    content: '';
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 30px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5));
    border-radius: 20px;
  }
  .progress-text {
    font-size: 12px;
    color: rgba(255,255,255,0.92);
    font-weight: 500;
    letter-spacing: 0.5px;
  }
  
  /* ========== PROGRESS CIRCLE ========== */
  .progress-circle-wrap {
    position: relative;
    width: 160px;
    height: 160px;
    margin: 14px auto 10px;
  }
  .progress-circle {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
    filter: drop-shadow(0 0 8px rgba(255,255,255,0.25));
  }
  /* 外圈装饰虚线环 */
  .progress-ring-outer {
    fill: none;
    stroke: rgba(255,255,255,0.15);
    stroke-width: 2;
    stroke-dasharray: 6 4;
    animation: outerRingRotate 20s linear infinite;
  }
  @keyframes outerRingRotate {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  /* 中圈发光背景环 */
  .progress-ring-glow {
    fill: none;
    stroke: rgba(255,255,255,0.12);
    stroke-width: 10;
    filter: blur(2px);
  }
  .progress-ring-bg {
    fill: none;
    stroke: rgba(255,255,255,0.25);
    stroke-width: 8;
  }
  .progress-ring-fill {
    fill: none;
    stroke: #fff;
    stroke-width: 8;
    stroke-linecap: round;
    stroke-dasharray: 326.726;
    stroke-dashoffset: 326.726;
    transition: stroke-dashoffset 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    filter: drop-shadow(0 0 6px rgba(255,255,255,0.5));
  }
  /* 脉冲光环 */
  .progress-pulse-ring {
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.2);
    animation: progressPulse 3s ease-in-out infinite;
    pointer-events: none;
  }
  .progress-pulse-ring::before {
    content: '';
    position: absolute;
    inset: 6px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.1);
    animation: progressPulse 3s ease-in-out infinite 1s;
  }
  @keyframes progressPulse {
    0%, 100% { transform: scale(1); opacity: 0.5; }
    50% { transform: scale(1.06); opacity: 0; }
  }
  .progress-circle-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #fff;
    text-align: center;
    line-height: 1.3;
    text-shadow: 0 2px 8px rgba(0,0,0,0.2);
    pointer-events: none;
  }
  .progress-circle-text .pct {
    font-size: 36px;
    font-weight: 800;
    display: block;
    letter-spacing: -1px;
    background: linear-gradient(180deg, #fff, rgba(255,255,255,0.85));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .progress-circle-text .pct-label {
    font-size: 11px;
    font-weight: 500;
    opacity: 0.85;
    letter-spacing: 2px;
    margin-top: 2px;
  }
  .progress-circle-text .pct-count {
    font-size: 12px;
    font-weight: 600;
    opacity: 0.75;
    margin-top: 4px;
  }
  /* 顶部统计栏 */
  .header-stats {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-top: 8px;
  }
  .header-stat-item {
    text-align: center;
    color: rgba(255,255,255,0.9);
  }
  .header-stat-num {
    font-size: 18px;
    font-weight: 700;
    line-height: 1;
  }
  .header-stat-label {
    font-size: 10px;
    opacity: 0.7;
    margin-top: 3px;
    letter-spacing: 1px;
  }
  /* 顶部装饰线 */
  .header-decoration {
    position: absolute;
    bottom: 0;
    left: 10%;
    right: 10%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  }

  /* ========== CHAPTER ========== */
  .chapter {
    margin: 14px 12px 0;
    border-radius: var(--radius);
    background: var(--card);
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: box-shadow 0.2s;
  }
  .chapter:first-child { margin-top: 12px; }
  .chapter-header {
    display: flex;
    align-items: center;
    padding: 15px 16px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    transition: background 0.2s;
  }
  .chapter-header:active { background: var(--card-alt); }
  .chapter-icon {
    font-size: 22px;
    margin-right: 11px;
    flex-shrink: 0;
    width: 28px;
    text-align: center;
  }
  .chapter-body { flex: 1; min-width: 0; }
  .chapter-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
  }
  .chapter-sub {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .chapter-right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    margin-left: 8px;
  }
  .chapter-count {
    font-size: 12px;
    color: var(--primary);
    font-weight: 600;
    background: var(--accent);
    padding: 2px 9px;
    border-radius: 20px;
  }
  .chapter-arrow {
    font-size: 11px;
    color: var(--text-muted);
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    display: inline-block;
  }
  .chapter.open .chapter-arrow { transform: rotate(180deg); }
  .chapter-items {
    display: none;
    padding: 0 10px 10px;
  }
  .chapter.open .chapter-items { display: block; }
  
  /* ========== EVENT ITEM ========== */
  .event-item {
    display: flex;
    align-items: flex-start;
    padding: 12px 10px;
    border-radius: var(--radius-sm);
    margin-bottom: 4px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  .event-item:active { background: var(--accent); transform: scale(0.985); }
  .event-check {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2.2px solid var(--border);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 10px;
    margin-top: 1px;
    transition: all 0.3s;
    font-size: 13px;
    background: var(--card);
  }
  .event-item.checked .event-check {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
    box-shadow: 0 2px 8px rgba(196, 122, 94, 0.35);
  }
  .event-info { flex: 1; min-width: 0; padding-top: 1px; }
  .event-name {
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
  }
  .event-item.checked .event-name {
    color: var(--text-muted);
    text-decoration: line-through;
    text-decoration-color: var(--border);
    text-decoration-thickness: 1.5px;
  }
  .event-meta {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .event-meta span { white-space: nowrap; }
  
  /* ========== MODAL ========== */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(62, 45, 35, 0.45);
    z-index: 1000;
    align-items: flex-end;
    justify-content: center;
    backdrop-filter: blur(2px);
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--card);
    border-radius: 22px 22px 0 0;
    width: 100%;
    max-width: 500px;
    max-height: 88vh;
    overflow-y: auto;
    padding: 28px 20px 36px;
    animation: slideUp 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    -webkit-overflow-scrolling: touch;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); opacity: 0.8; }
    to { transform: translateY(0); opacity: 1; }
  }
  .modal-title {
    font-size: 18px;
    font-weight: 700;
    text-align: center;
    color: var(--text);
    margin-bottom: 4px;
  }
  .modal-subtitle {
    font-size: 12px;
    color: var(--text-muted);
    text-align: center;
    margin-bottom: 20px;
  }
  .modal-event-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--primary);
    text-align: center;
    margin-bottom: 22px;
    padding: 12px 14px;
    background: var(--accent);
    border-radius: 12px;
    line-height: 1.5;
  }
  
  /* ========== FORM ========== */
  .form-group { margin-bottom: 18px; }
  .form-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-light);
    margin-bottom: 7px;
    display: block;
    padding-left: 2px;
  }
  .form-input {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 15px;
    color: var(--text);
    background: var(--card-alt);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    font-family: inherit;
    -webkit-appearance: none;
  }
  .form-input:focus {
    border-color: var(--primary-light);
    box-shadow: 0 0 0 3px rgba(196, 122, 94, 0.12);
  }
  
  /* ========== PHOTO UPLOAD ========== */
  .photo-upload {
    width: 100%;
    min-height: 130px;
    border: 2px dashed var(--border);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    overflow: hidden;
    position: relative;
    background: var(--card-alt);
  }
  .photo-upload:active { background: var(--accent); }
  .photo-upload.has-photo { border-style: solid; border-color: var(--accent2); }
  .photo-upload-icon { font-size: 30px; opacity: 0.35; }
  .photo-upload-text { font-size: 13px; color: var(--text-muted); margin-top: 6px; }
  .photo-preview {
    width: 100%;
    height: 210px;
    object-fit: cover;
    display: none;
    border-radius: 12px;
  }
  .photo-upload.has-photo .photo-preview { display: block; }
  .photo-upload.has-photo .photo-upload-icon,
  .photo-upload.has-photo .photo-upload-text { display: none; }
  .photo-remove {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 30px;
    height: 30px;
    background: rgba(62, 45, 35, 0.6);
    color: #fff;
    border: none;
    border-radius: 50%;
    font-size: 14px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }
  .photo-upload.has-photo .photo-remove { display: flex; }

  /* ========== MEDIA UPLOAD ========== */
  .media-upload-box {
    width: 100%;
    min-height: 80px;
    border: 2px dashed var(--border);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    overflow: hidden;
    position: relative;
    background: var(--card-alt);
    padding: 14px 0;
  }
  .media-upload-box:active { background: var(--accent); }
  .media-upload-icon { font-size: 26px; opacity: 0.35; }
  .media-upload-text { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
  .audio-review { width: 100%; margin-top: 8px; display: none; }
  .video-review { width: 100%; border-radius: 12px; margin-top: 8px; display: none; }
  .media-upload-box.has-media .audio-review,
  .media-upload-box.has-media .video-review { display: block; }
  .media-upload-box.has-media .media-upload-icon,
  .media-upload-box.has-media .media-upload-text { display: none; }

  /* ========== BUTTONS ========== */
  .btn-row { display: flex; gap: 12px; margin-top: 22px; }
  .btn {
    flex: 1;
    padding: 13px 0;
    border: none;
    border-radius: 13px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { opacity: 0.75; transform: scale(0.97); }
  .btn-cancel { background: var(--card-alt); color: var(--text-light); border: 1.5px solid var(--border); }
  .btn-primary {
    background: linear-gradient(145deg, var(--primary-light), var(--primary-dark));
    color: #fff;
    box-shadow: 0 4px 14px rgba(196, 122, 94, 0.3);
  }
  .btn-danger { background: var(--danger-bg); color: var(--danger); border: 1.5px solid #f0d0cc; }
  .btn-delete-wrap { margin-top: 12px; }
  
  /* ========== SEARCH BOX ========== */
  .search-box {
    position: sticky;
    top: 81px;
    z-index: 99;
    background: var(--bg);
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
  }
  .search-input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .search-icon {
    position: absolute;
    left: 12px;
    font-size: 14px;
    pointer-events: none;
    opacity: 0.5;
    z-index: 1;
  }
  .search-input {
    width: 100%;
    padding: 10px 36px 10px 36px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 14px;
    color: var(--text);
    background: var(--card);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    font-family: inherit;
    -webkit-appearance: none;
  }
  .search-input:focus {
    border-color: var(--primary-light);
    box-shadow: 0 0 0 3px rgba(196, 122, 94, 0.12);
  }
  .search-clear {
    position: absolute;
    right: 10px;
    font-size: 16px;
    color: var(--text-muted);
    cursor: pointer;
    display: none;
    padding: 4px;
    line-height: 1;
    z-index: 1;
  }
  .search-clear.show { display: block; }
  .search-result {
    font-size: 12px;
    color: var(--text-muted);
    padding: 6px 4px 2px;
    display: none;
  }
  .search-result.show { display: block; }
  .chapter.hidden-chapter { display: none; }
  .event-item.hidden-event { display: none; }
  
  /* ========== SHARE CARD MODAL ========== */
  .share-card-preview {
    max-width: 100%;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  }
  
  /* ========== BOTTOM BAR ========== */
  .bottom-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 -1px 12px rgba(0,0,0,0.05);
    display: flex;
    justify-content: space-around;
    padding: 10px 6px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    z-index: 100;
    border-top: 1px solid rgba(240, 221, 208, 0.5);
  }
  .bottom-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 10px;
    cursor: pointer;
    padding: 5px 14px;
    border-radius: 10px;
    transition: all 0.2s;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .bottom-btn:active { background: var(--accent); }
  .bottom-btn .icon { font-size: 20px; margin-bottom: 2px; line-height: 1; }

  .bottom-btn.active .icon { filter: drop-shadow(0 1px 2px rgba(196,122,94,0.3)); }
  
  /* ========== TIMELINE RIVER ========== */
  .timeline-river-wrapper {
    position: relative;
    padding: 20px 0 60px;
    min-height: 80vh;
  }
  .timeline-river {
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 4px;
    transform: translateX(-50%);
    border-radius: 2px;
    background: linear-gradient(180deg,
      rgba(196,122,94,0.15) 0%,
      rgba(196,122,94,0.45) 25%,
      rgba(252,232,216,0.7) 50%,
      rgba(196,122,94,0.45) 75%,
      rgba(196,122,94,0.15) 100%);
    background-size: 100% 300%;
    animation: riverFlow 6s ease-in-out infinite, riverGlow 3s ease-in-out infinite alternate;
    box-shadow: 0 0 12px rgba(196,122,94,0.25), 0 0 30px rgba(196,122,94,0.1);
  }
  @keyframes riverGlow {
    0% { box-shadow: 0 0 12px rgba(196,122,94,0.25), 0 0 30px rgba(196,122,94,0.1); }
    100% { box-shadow: 0 0 20px rgba(196,122,94,0.4), 0 0 50px rgba(196,122,94,0.2); }
  }
  .timeline-river::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 20px;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at center, rgba(252,232,216,0.18) 0%, transparent 70%);
    pointer-events: none;
  }
  @keyframes riverFlow {
    0%   { background-position: 0% 0%; }
    50%  { background-position: 0% 100%; }
    100% { background-position: 0% 0%; }
  }

  /* 年份刻度 */
  .timeline-year-marker {
    position: relative;
    left: 50%;
    transform: translateX(-50%);
    background: var(--card);
    border: 1.5px solid var(--accent2);
    color: var(--primary);
    font-size: 12px;
    font-weight: 700;
    padding: 3px 14px;
    border-radius: 20px;
    z-index: 5;
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(196,122,94,0.12);
    letter-spacing: 1px;
    display: inline-block;
    margin: 18px auto;
  }

  /* 年份指示器 - 固定在顶部 */
  .timeline-year-indicator {
    position: fixed;
    top: 90px;
    right: 20px;
    background: linear-gradient(135deg, var(--primary-light), var(--primary-dark));
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    padding: 8px 16px;
    border-radius: 20px;
    z-index: 98;
    box-shadow: 0 4px 15px rgba(196,122,94,0.3);
    opacity: 0;
    transform: translateY(-10px);
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
  }
  .timeline-year-indicator.show {
    opacity: 0.9;
    transform: translateY(0);
  }

  /* 打卡点通用 */
  .tl-item {
    position: relative;
    width: 42%;
    margin-bottom: 28px;
    animation: tlFadeIn 0.5s ease both;
  }
  .tl-item.left  { margin-right: auto; padding-right: 24px; }
  .tl-item.right { margin-left: auto;  padding-left:  24px; }

  /* 连接线：从卡片指向河流中心 */
  .tl-item::before {
    content: '';
    position: absolute;
    top: 22px;
    width: 24px;
    height: 2px;
    background: var(--accent2);
  }
  .tl-item.left::before  { right: 0; }
  .tl-item.right::before { left: 0; }

  /* 河面锚点（小圆点）*/
  .tl-item::after {
    content: '';
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--primary-light);
    z-index: 2;
    transition: all 0.3s;
  }
  .tl-item.has-media::after {
    background: var(--primary);
    border-color: var(--primary);
    box-shadow: 0 0 10px rgba(196,122,94,0.5);
    width: 14px;
    height: 14px;
  }
  .tl-item.playing::after {
    box-shadow: 0 0 18px rgba(196,122,94,0.8), 0 0 30px rgba(196,122,94,0.3);
  }

  @keyframes tlFadeIn {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* 有内容的卡片 */
  .tl-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px 16px;
    cursor: pointer;
    transition: box-shadow 0.2s, transform 0.2s;
    position: relative;
    overflow: hidden;
  }
  .tl-card:active { box-shadow: var(--shadow-hover); transform: scale(0.985); }
  .tl-card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: var(--radius);
    background: radial-gradient(ellipse at 30% 20%, rgba(252,232,216,0.35) 0%, transparent 60%);
    pointer-events: none;
  }

  .tl-date {
    display: inline-block;
    font-size: 11px;
    color: #fff;
    background: linear-gradient(135deg, var(--primary-light), var(--primary-dark));
    padding: 2px 10px;
    border-radius: 20px;

    font-size: 11px;
    color: var(--primary-light);

  }
  .tl-name {
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
    margin-bottom: 6px;
  }
  .tl-note {
    font-size: 12px;
    color: var(--text-muted);
    background: var(--card-alt);
    border-radius: 8px;
    padding: 6px 10px;
    line-height: 1.5;
    margin-top: 6px;
  }
.tl-photo-container {
  width: 100%;

  margin-top: 8px;

}

}
.tl-photo:active { transform: scale(0.98); }
.tl-media-wrap {

}
.tl-media-wrap audio,
.tl-media-wrap video {
  width: 100%;

}

  /* ===== 转瞬即逝效果（无媒体） ===== */
  .tl-item.no-media .tl-card {
    opacity: 0;
    animation: fleetingIn 1.2s ease forwards;
    animation-delay: inherit;
  }
  @keyframes fleetingIn {
    0%   { opacity: 0; transform: scale(0.95); }
    15%  { opacity: 0.85; transform: scale(1.02); }
    35%  { opacity: 0.7; transform: scale(1); }
    100% { opacity: 0.32; }
  }
  .tl-item.no-media .tl-card:hover {
    opacity: 0.75 !important;
  }
  .tl-item.no-media::after {
    animation: anchorFleeting 1.2s ease forwards;
    animation-delay: inherit;
  }
  @keyframes anchorFleeting {
    0%   { opacity: 0; box-shadow: 0 0 8px rgba(196,122,94,0.5); }
    20%  { opacity: 1; box-shadow: 0 0 14px rgba(196,122,94,0.6); }
    50%  { opacity: 0.6; }
    100% { opacity: 0.25; box-shadow: none; }
  }
  .fleeting-msg {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 6px;
    font-style: italic;
    opacity: 0.7;
    line-height: 1.5;
  }

  .timeline-empty {

  /* ========== HEATMAP ========== */

  /* ========== MOBILE RESPONSIVE ========== */
  @media (max-width: 640px) {

    .tl-item {
      width: 100% !important;
      padding-left: 38px !important;
      padding-right: 8px !important;

    .tl-item.left, .tl-item.right {

    .header-stats { gap: 14px; }
    .header-stat-num { font-size: 16px; }

    /* 章节卡片 */

    /* 统计页 */

  /* ========== CUSTOM EVENT FAB ========== */

  /* ========== MUYU (木鱼) WRAPPER ========== */

  /* ========== MUYU (木鱼) BUTTON – 新设计 ========== */

  /* ========== DAY MODE CLOUDS ========== */
  .day-clouds { display: block; }

  .cloud {
    position: absolute;
    pointer-events: none;
    z-index: 2;
    opacity: 0.55;
    filter: blur(0.5px);
    transition: opacity 0.6s ease;
  }
  .cloud-puff {
    position: absolute;
    background: radial-gradient(ellipse at 40% 60%, rgba(255,255,255,0.95), rgba(255,255,255,0.6) 60%, rgba(255,255,255,0) 100%);

  /* 云朵1：左上，小 */
  .cloud-1 { top: 18px; left: 70px; width: 60px; height: 28px; animation: cloudFloat1 8s ease-in-out infinite; }
  .cloud-1 .cloud-puff:nth-child(1) { width: 28px; height: 22px; top: 6px; left: 4px; }
  .cloud-1 .cloud-puff:nth-child(2) { width: 34px; height: 26px; top: 2px; left: 16px; }
  .cloud-1 .cloud-puff:nth-child(3) { width: 24px; height: 20px; top: 8px; left: 36px; }

  /* 云朵2：右上，中 */
  .cloud-2 { top: 12px; right: 60px; width: 80px; height: 34px; animation: cloudFloat2 10s ease-in-out infinite; }
  .cloud-2 .cloud-puff:nth-child(1) { width: 34px; height: 26px; top: 8px; left: 6px; }
  .cloud-2 .cloud-puff:nth-child(2) { width: 42px; height: 30px; top: 2px; left: 22px; }

  .cloud-2 .cloud-puff:nth-child(4) { width: 20px; height: 18px; top: 12px; left: 64px; }

  /* 云朵3：进度圈下方左侧，小 */

  .cloud-3 .cloud-puff:nth-child(1) { width: 22px; height: 18px; top: 4px; left: 2px; }
  .cloud-3 .cloud-puff:nth-child(2) { width: 28px; height: 20px; top: 1px; left: 14px; }
  .cloud-3 .cloud-puff:nth-child(3) { width: 20px; height: 16px; top: 5px; left: 32px; }

  /* 云朵4：进度圈下方右侧，中 */
  .cloud-4 { bottom: 42px; right: 16px; width: 70px; height: 30px; animation: cloudFloat4 11s ease-in-out infinite; opacity: 0.45; }
  .cloud-4 .cloud-puff:nth-child(1) { width: 30px; height: 24px; top: 6px; left: 4px; }
  .cloud-4 .cloud-puff:nth-child(2) { width: 38px; height: 28px; top: 1px; left: 20px; }
  .cloud-4 .cloud-puff:nth-child(3) { width: 26px; height: 20px; top: 8px; left: 46px; }

  @keyframes cloudFloat1 {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(8px, -4px); }

  @keyframes cloudFloat2 {
    0%, 100% { transform: translate(0, 0); }

  @keyframes cloudFloat3 {

  @keyframes cloudFloat4 {

  /* ========== MUYU (木鱼) 进度圈左侧 ========== */
  .muyu-by-progress {
    position: absolute;
    left: max(8px, calc(50% - 130px));
    top: 50%;
    transform: translateY(-50%);
    z-index: 101;
    display: flex;
    flex-direction: column;

  .muyu-btn-svg {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    background: radial-gradient(circle at 35% 30%, rgba(255,220,140,0.5) 0%, transparent 50%),
                linear-gradient(145deg, #d4a843 0%, #b8922a 40%, #8b6914 100%);
    box-shadow: 0 3px 12px rgba(100,60,10,0.35), inset 0 2px 5px rgba(255,220,140,0.4), inset 0 -2px 5px rgba(60,30,5,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.08s;
    -webkit-tap-highlight-color: transparent;
    position: relative;
  }
  .muyu-btn-svg:active { transform: scale(0.82); }
  .muyu-svg { width: 44px; height: 44px; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3)); }
  .muyu-label-svg {
    font-size: 9px;

  .muyu-ripple {
    position: fixed;
    border-radius: 50%;
    border: 2px solid rgba(184,134,11,0.5);

    animation: muyuRipple 0.5s ease-out forwards;
    z-index: 102;
  }
  @keyframes muyuRipple {
    0% { transform: scale(0.5); opacity: 1; }
    100% { transform: scale(2.5); opacity: 0; }

  /* ========== MOBILE: 木鱼 + 哲理弹窗 ========== */

<script>
// ========= LOADING ANIMATION ==========
(function(){
  var canvas = document.getElementById("loadingCanvas");
  if(!canvas) { finishLoading(); return; }
  var ctx = canvas.getContext("2d");
  var screen = document.getElementById("loadingScreen");
  var textEl = document.getElementById("loadingText");

  function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener("resize", resize);

  function W(){ return canvas.width; }
  function H(){ return canvas.height; }
  function cx(){ return canvas.width/2; }
  function cy(){ return canvas.height/2; }

  // 安全兜底：15秒后强制结束loading（动画约需8秒）
  var safetyTimer = setTimeout(function() { finishLoading(); }, 15000);
  
  // 允许点击跳过（调试用，正式环境可关闭）
  if (screen) {
    screen.style.cursor = 'default';
  }

  // ===== Particle system =====
  var particles = [];
  function spawnP(x, y, count, colorFn, speed, life){
    for(var i=0;i<count;i++){
      var a = Math.random()*Math.PI*2;
      var s = speed * (0.3+Math.random()*0.7);
      var c = colorFn ? colorFn() : "rgba(255,220,140,0.8)";
      particles.push({x:x, y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s,
        life:life||60, maxLife:life||60, r:1+Math.random()*2.5,
        color:c});
    }
  }
  function tickP(){
    for(var i=particles.length-1;i>=0;i--){
      var p=particles[i];
      p.x+=p.vx; p.y+=p.vy; p.life--;
      if(p.life<=0){ particles.splice(i,1); }
    }
  }
  function drawP(){
    for(var i=0;i<particles.length;i++){
      var p=particles[i];
      var a = p.life / p.maxLife;
      ctx.globalAlpha = a * 0.8;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r*a, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function finishLoading(){
    if(screen){
      screen.style.display = "none";
    }
    animDone = true;
  }

  var frame = 0, animDone = false;
  var FPS = 60, SPD = 1000/FPS;

  function loop(){
    if(animDone) { finishLoading(); return; }
    ctx.clearRect(0, 0, W(), H());

    // ===== Phase 1: Two orbs approach (Milky White + Light Yellow) =====
    if(frame < 120){
      var t = frame / 120;
      var ease = t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2;
      var maxDist = W() * 0.38;
      var xLeft  = cx() - maxDist * (1 - ease);
      var xRight = cx() + maxDist * (1 - ease);
      var orbY = cy() + Math.sin(frame*0.04)*4;

      if(frame % 2 === 0){
        spawnP(xLeft, orbY, 1, function(){ return "rgba(220,230,255,"+(0.3+Math.random()*0.3)+")"; }, 0.3, 35);
        spawnP(xRight, orbY, 1, function(){ return "rgba(255,230,160,"+(0.3+Math.random()*0.3)+")"; }, 0.3, 35);
      }

      var oL_o = ctx.createRadialGradient(xLeft, orbY, 0, xLeft, orbY, 50+t*20);
      oL_o.addColorStop(0, "rgba(230,240,255,0.12)");
      oL_o.addColorStop(1, "rgba(230,240,255,0)");
      ctx.fillStyle = oL_o;
      ctx.beginPath(); ctx.arc(xLeft, orbY, 50+t*20, 0, Math.PI*2); ctx.fill();
      var oL_c = ctx.createRadialGradient(xLeft-4, orbY-4, 0, xLeft, orbY, 18);
      oL_c.addColorStop(0, "rgba(255,255,255,0.95)");
      oL_c.addColorStop(0.6, "rgba(210,225,255,0.8)");
      oL_c.addColorStop(1, "rgba(180,200,240,0.4)");
      ctx.fillStyle = oL_c;
      ctx.beginPath(); ctx.arc(xLeft, orbY, 18, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.85)";
      ctx.beginPath(); ctx.arc(xLeft, orbY, 7, 0, Math.PI*2); ctx.fill();

      var oR_o = ctx.createRadialGradient(xRight, orbY, 0, xRight, orbY, 50+t*20);
      oR_o.addColorStop(0, "rgba(255,230,150,0.13)");
      oR_o.addColorStop(1, "rgba(255,230,150,0)");
      ctx.fillStyle = oR_o;
      ctx.beginPath(); ctx.arc(xRight, orbY, 50+t*20, 0, Math.PI*2); ctx.fill();
      var oR_c = ctx.createRadialGradient(xRight+4, orbY-4, 0, xRight, orbY, 18);
      oR_c.addColorStop(0, "rgba(255,255,230,0.95)");
      oR_c.addColorStop(0.6, "rgba(255,220,130,0.8)");
      oR_c.addColorStop(1, "rgba(255,200,100,0.4)");
      ctx.fillStyle = oR_c;
      ctx.beginPath(); ctx.arc(xRight, orbY, 18, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "rgba(255,255,200,0.85)";
      ctx.beginPath(); ctx.arc(xRight, orbY, 7, 0, Math.PI*2); ctx.fill();
    } else if(frame < 200){
      var t = (frame - 120) / 80;
      var ease = 1 - Math.pow(1 - t, 3);
      var flash = Math.sin(t * Math.PI);

      ctx.save();
      ctx.globalAlpha = flash * 0.35;
      ctx.fillStyle = "#fffbe6";
      ctx.beginPath(); ctx.arc(cx(), cy(), W()*0.7*flash, 0, Math.PI*2); ctx.fill();
      ctx.restore();

      if(t < 0.6){
        var ringR = (t/0.6) * Math.max(W(),H())*0.45;
        ctx.save();
        ctx.globalAlpha = (1-t/0.6) * 0.4;
        ctx.strokeStyle = "rgba(255,220,140,0.8)";
        ctx.lineWidth = 3*(1-t/0.6)+1;
        ctx.beginPath(); ctx.arc(cx(), cy(), ringR, 0, Math.PI*2); ctx.stroke();
        ctx.strokeStyle = "rgba(255,240,200,0.5)";
        ctx.lineWidth = 6*(1-t/0.6)+1;
        ctx.beginPath(); ctx.arc(cx(), cy(), ringR*1.05, 0, Math.PI*2); ctx.stroke();
        ctx.restore();
      }

      var coreR = 8 + ease * 45;
      var coreGlow = ctx.createRadialGradient(cx(), cy(), 0, cx(), cy(), coreR * 2.5);
      coreGlow.addColorStop(0, "rgba(255,220,100,"+(0.3+flash*0.2)+")");
      coreGlow.addColorStop(0.4, "rgba(255,180,60,0.1)");
      coreGlow.addColorStop(1, "rgba(255,180,60,0)");
      ctx.fillStyle = coreGlow;
      ctx.beginPath(); ctx.arc(cx(), cy(), coreR*2.5, 0, Math.PI*2); ctx.fill();

      var danGrad = ctx.createRadialGradient(cx()-coreR*0.2, cy()-coreR*0.2, 0, cx(), cy(), coreR);
      danGrad.addColorStop(0, "rgba(255,250,220,0.98)");
      danGrad.addColorStop(0.5, "rgba(255,200,80,0.95)");
      danGrad.addColorStop(0.85, "rgba(220,150,40,0.9)");
      danGrad.addColorStop(1, "rgba(180,120,30,0.8)");
      ctx.fillStyle = danGrad;
      ctx.beginPath(); ctx.arc(cx(), cy(), coreR, 0, Math.PI*2); ctx.fill();

      ctx.save();
      ctx.globalAlpha = 0.25;
      ctx.strokeStyle = "rgba(255,255,200,0.7)";
      ctx.lineWidth = 1.2;
      for(var s=0; s<3; s++){
        var soff = s*2.1 + frame*0.03;
        ctx.beginPath();
        for(var a=0;a<=Math.PI*2;a+=0.08){
          var rr = coreR * (0.3 + 0.55*Math.sin(a*2+soff));
          var px = cx() + Math.cos(a)*rr;
          var py = cy() + Math.sin(a)*rr;
          if(a===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
        }
        ctx.closePath(); ctx.stroke();
      }
      ctx.restore();

      if(frame % 2 === 0 && t < 0.7){
        spawnP(cx(), cy(), 3, function(){
          return "hsl("+(35+Math.random()*25)+", "+(80+Math.random()*20)+"%, "+(65+Math.random()*20)+"%)";
        }, 1.5+Math.random()*2, 40+Math.random()*20);
      }
    } else if(frame < 340){
      var t = (frame - 200) / 140;
      var pulse = Math.sin(frame * 0.04) * 0.5 + 0.5;
      var rotateAngle = frame * 0.008;
      var coreR = 50 + pulse * 5;

      for(var L=0; L<3; L++){
        var Lr = coreR * (1.3 + L*0.45 + Math.sin(frame*0.03+L)*0.1);
        var Lg = ctx.createRadialGradient(cx(), cy(), coreR*0.8, cx(), cy(), Lr);
        Lg.addColorStop(0, "rgba(255,200,80,"+(0.08 - L*0.02)+")");
        Lg.addColorStop(1, "rgba(255,180,60,0)");
        ctx.fillStyle = Lg;
        ctx.beginPath(); ctx.arc(cx(), cy(), Lr, 0, Math.PI*2); ctx.fill();
      }

      ctx.save();
      ctx.translate(cx(), cy());
      ctx.rotate(rotateAngle);

      var danGrad2 = ctx.createRadialGradient(-coreR*0.15, -coreR*0.15, 0, 0, 0, coreR);
      danGrad2.addColorStop(0, "rgba(255,252,230,0.98)");
      danGrad2.addColorStop(0.4, "rgba(255,210,90,0.95)");
      danGrad2.addColorStop(0.75, "rgba(220,160,50,0.92)");
      danGrad2.addColorStop(1, "rgba(180,120,30,0.88)");
      ctx.fillStyle = danGrad2;
      ctx.beginPath(); ctx.arc(0, 0, coreR, 0, Math.PI*2); ctx.fill();

      ctx.globalAlpha = 0.18;
      ctx.strokeStyle = "rgba(255,255,200,0.7)";
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(0, 0, coreR*0.35, -Math.PI/2, Math.PI*1.5); ctx.stroke();
      ctx.beginPath(); ctx.arc(-coreR*0.12, 0, coreR*0.22, 0, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc( coreR*0.12, 0, coreR*0.22, 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = "rgba(255,255,200,0.5)";
      ctx.beginPath(); ctx.arc(-coreR*0.12, 0, coreR*0.06, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc( coreR*0.12, 0, coreR*0.06, 0, Math.PI*2); ctx.fill();

      if(t > 0.35){
        var crackAlpha = Math.min(1, (t-0.35)/0.2);
        ctx.globalAlpha = crackAlpha * 0.6;
        ctx.strokeStyle = "rgba(255,100,30,0.8)";
        ctx.lineWidth = 1.8;
        ctx.lineCap = "round";
        for(var c=0; c<6; c++){
          var ca = c*(Math.PI/3) + frame*0.01;
          var innerR = coreR * (0.2 + Math.sin(frame*0.05+c)*0.1);
          var outerR = coreR * (0.75 + Math.sin(frame*0.03+c)*0.15);
          ctx.beginPath();
          ctx.moveTo(Math.cos(ca)*innerR, Math.sin(ca)*innerR);
          ctx.quadraticCurveTo(
            Math.cos(ca+0.2)*outerR*0.7, Math.sin(ca+0.2)*outerR*0.7,
            Math.cos(ca)*outerR, Math.sin(ca)*outerR);
          ctx.stroke();
        }
        ctx.globalAlpha = crackAlpha * 0.35;
        ctx.fillStyle = "rgba(255,180,50,0.7)";
        ctx.beginPath(); ctx.arc(0, 0, coreR*1.05, 0, Math.PI*2); ctx.fill();
      }
      ctx.restore();

      if(frame % 4 === 0){
        var fa = Math.random()*Math.PI*2;
        var fd = coreR*1.2 + Math.random()*40;
        spawnP(cx()+Math.cos(fa)*fd, cy()+Math.sin(fa)*fd, 1,
          function(){ return "rgba(255,220,140,"+(0.3+Math.random()*0.3)+")"; }, 0.2, 50);
      }

      if(t > 0.6){
        var intensity = (t-0.6)/0.4 * pulse;
        ctx.save();
        ctx.globalAlpha = intensity * 0.18;
        ctx.fillStyle = "#fffbe6";
        ctx.beginPath(); ctx.arc(cx(), cy(), coreR*(1.5+intensity*0.8), 0, Math.PI*2); ctx.fill();
        ctx.restore();
      }
    } else if(frame < 415){
      // Phase 4: shatter — FIXED denominator: 415-340=75
      var t = (frame - 340) / 75;
      var ease = 1 - Math.pow(1 - Math.min(t,1), 3);

      if(t < 0.4){
        var st = t / 0.4;
        var stEase = 1 - Math.pow(1-st, 2);

        var burstR = stEase * Math.max(W(),H())*0.5;
        ctx.save();
        ctx.globalAlpha = (1-stEase)*0.3;
        ctx.strokeStyle = "rgba(255,220,120,0.9)";
        ctx.lineWidth = 4*(1-stEase)+1;
        ctx.beginPath(); ctx.arc(cx(), cy(), burstR, 0, Math.PI*2); ctx.stroke();
        ctx.restore();

        if(frame % 2 === 0){
          for(var i=0;i<5;i++){
            var sa = Math.random()*Math.PI*2;
            var sd = 20 + Math.random()*30;
            spawnP(cx()+Math.cos(sa)*sd, cy()+Math.sin(sa)*sd, 1,
              function(){ return "rgba("+(200+Math.random()*55)+","+(140+Math.random()*80)+","+(30+Math.random()*40)+",0.8)"; },
              2+Math.random()*3, 35+Math.random()*25);
          }
        }

        var remR = 50 * (1 - stEase*0.7);
        ctx.save();
        ctx.globalAlpha = 1 - stEase*0.6;
        var remGrad = ctx.createRadialGradient(cx(), cy(), 0, cx(), cy(), remR);
        remGrad.addColorStop(0, "rgba(255,240,200,0.9)");
        remGrad.addColorStop(1, "rgba(220,160,50,0.7)");
        ctx.fillStyle = remGrad;
        for(var f=0;f<6;f++){
          var fa2 = f*(Math.PI/3) + stEase*2;
          var fr = remR * (0.4 + 0.6*(1-stEase*0.5));
          ctx.beginPath();
          ctx.arc(cx()+Math.cos(fa2)*remR*0.2*stEase, cy()+Math.sin(fa2)*remR*0.2*stEase, fr*0.55, fa2, fa2+Math.PI/3);
          ctx.arc(cx(), cy(), remR*0.3, fa2+Math.PI/3, fa2, true);
          ctx.fill();
        }
        ctx.restore();
      }
      // When t>=0.4: nothing to draw, just let particles finish

    } else {
      // Phase 5: fade out
      var t = Math.min(1, (frame - 415) / 40);
      if(screen) screen.style.opacity = 1 - t;
      if(t >= 1){
        finishLoading();
        return;
      }
    }

    tickP();
    drawP();

    frame++;
    setTimeout(loop, SPD);
  }

  setTimeout(loop, 100);
})();

// ========== INDEXEDDB HELPERS ==========
var mediaDB = null;
function openMediaDB() {
  if (mediaDB) return Promise.resolve(mediaDB);
  return new Promise(function(resolve, reject) {
    var req = indexedDB.open('lifeCheckinMedia', 1);
    req.onupgradeneeded = function(e) {
      var db = e.target.result;
      if (!db.objectStoreNames.contains('media')) {
        db.createObjectStore('media', { keyPath: 'id', autoIncrement: true });
      }
    };
    req.onsuccess = function(e) { mediaDB = e.target.result; resolve(mediaDB); };
    req.onerror = function() { reject(req.error); };
  });
}

function saveMediaToDB(eventId, callback) {
  openMediaDB().then(function(db) {
    var tx = db.transaction(['media'], 'readwrite');
    var store = tx.objectStore('media');
    // 收集该 eventId 的现有记录（按 type 分类）
    var existing = {};
    store.openCursor().onsuccess = function(e) {
      var cursor = e.target.result;
      if (cursor) {
        if (cursor.value.eventId === eventId) {
          existing[cursor.value.type] = cursor.value;
        }
        cursor.continue();
      } else {
        // 删除事务完成后，开始写入新数据
        var tx2 = db.transaction(['media'], 'readwrite');
        var store2 = tx2.objectStore('media');

        // Photo：有新版则更新，为 null 则删除已有记录
        if (tempPhotoData) {
          if (existing.photo) store2.delete(existing.photo.id);
          store2.add({ eventId: eventId, type: 'photo', data: tempPhotoData, timestamp: Date.now() });
        } else {
          // tempPhotoData 为 null，删除已有照片
          if (existing.photo) store2.delete(existing.photo.id);
        }

        // Audio
        if (tempAudioData) {
          if (existing.audio) store2.delete(existing.audio.id);
          store2.add({ eventId: eventId, type: 'audio', data: tempAudioData, timestamp: Date.now() });
        } else if (tempRemoveAudio) {
          if (existing.audio) store2.delete(existing.audio.id);
        }
        // 两者都不满足：不动已有音频记录

        // Video
        if (tempVideoData) {
          if (existing.video) store2.delete(existing.video.id);
          store2.add({ eventId: eventId, type: 'video', data: tempVideoData, timestamp: Date.now() });
        } else if (tempRemoveVideo) {
          if (existing.video) store2.delete(existing.video.id);
        }
        // 两者都不满足：不动已有视频记录

        tx2.oncomplete = function() { if (callback) callback(); };
        tx2.onerror = function() { if (callback) callback(); };
      }
    };
  }).catch(function() { if (callback) callback(); });
}

function getMediaForEvent(eventId, callback) {
  openMediaDB().then(function(db) {
    var tx = db.transaction(['media'], 'readonly');
    var store = tx.objectStore('media');
    var result = { photo: null, audio: null, video: null };
    store.openCursor().onsuccess = function(e) {
      var cursor = e.target.result;
      if (cursor) {
        if (cursor.value.eventId === eventId) {
          result[cursor.value.type] = cursor.value.data;
        }
        cursor.continue();
      } else {
        callback(result);
      }
    };
  }).catch(function() { callback({ photo: null, audio: null, video: null }); });
}

function deleteMediaForEvent(eventId, callback) {
  openMediaDB().then(function(db) {
    var tx = db.transaction(['media'], 'readwrite');
    var store = tx.objectStore('media');
    store.openCursor().onsuccess = function(e) {
      var cursor = e.target.result;
      if (cursor) {
        if (cursor.value.eventId === eventId) store.delete(cursor.primaryKey);
        cursor.continue();
      } else {
        if (callback) callback();
      }
    };
  }).catch(function() { if (callback) callback(); });
}

function getStorageUsage(callback) {
  if (navigator.storage && navigator.storage.estimate) {
    navigator.storage.estimate().then(function(estimate) {
      callback({
        localStorage: JSON.stringify(checkinData).length,
        indexedDB: estimate.usage || 0,
        quota: estimate.quota || 0
      });
    });
  } else {
    var size = JSON.stringify(checkinData).length;
    callback({ localStorage: size, indexedDB: 0, quota: 0 });
  }
}

// ========== CUSTOM EVENTS STATE ==========
var customEvents = [];

function loadCustomEvents() {
  try {
    var raw = localStorage.getItem('lifeCustomEvents');
    if (raw) customEvents = JSON.parse(raw);
    else customEvents = [];
  } catch(e) { customEvents = []; }
  rebuildAllEvents();
}

function saveCustomEvents() {
  localStorage.setItem('lifeCustomEvents', JSON.stringify(customEvents));
}

function rebuildAllEvents() {
  ALL_EVENTS = [];
  CHAPTERS.forEach(function(ch, ci) {
    ch.events.forEach(function(ev, ei) {
      ALL_EVENTS.push({ id: ci + '-' + ei, chapter: ci, name: ev });
    });
  });
  customEvents.forEach(function(ce) {
    ALL_EVENTS.push({ id: ce.id, chapter: ce.chapterIndex, name: ce.name, custom: true });
  });
  TOTAL = ALL_EVENTS.length;
}

function openCustomEventModal() {
  var select = document.getElementById('customEventChapter');
  select.innerHTML = '';
  CHAPTERS.forEach(function(ch, ci) {

  });

}

function closeCustomEventModal() {
  document.getElementById('customEventModal').classList.remove('show');
}

function submitCustomEvent() {
  var name = document.getElementById('customEventName').value.trim();
  var chapterIndex = parseInt(document.getElementById('customEventChapter').value);
  if (!name) {
    showToast('请输入事件名称');
    return;
  }
  if (isNaN(chapterIndex) || chapterIndex < 0 || chapterIndex >= CHAPTERS.length) {
    showToast('请选择所属章节');
    return;
  }
  var id = 'custom_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7);
  customEvents.push({ id: id, chapterIndex: chapterIndex, name: name });
  saveCustomEvents();
  rebuildAllEvents();
  closeCustomEventModal();
  renderList();
  updateProgress();
  showToast('自定义打卡已添加 ✨');
}

function deleteCustomEvent(eventId, event) {
  if (event) { event.stopPropagation(); event.preventDefault(); }
  if (!confirm('确定删除该自定义打卡事件？已打卡的记录也会被删除。')) return;
  // 从 customEvents 中移除
  customEvents = customEvents.filter(function(ce) { return ce.id !== eventId; });
  // 从 checkinData 中移除
  delete checkinData[eventId];
  saveData();
  saveCustomEvents();
  rebuildAllEvents();
  renderList();
  updateProgress();
  showToast('自定义打卡已删除');
}

// ========== RENDER LIST ==========
function renderList() {
  var container = document.getElementById('mainList');
  container.innerHTML = '';

  // 每日推荐卡片（氛围感升级）
  var recId = pickDailyRecommend();
  if (recId) {
    var recEv = ALL_EVENTS.find(function(e) { return e.id === recId; });
    if (recEv) {
      var atm = getRecommendAtmosphere();
      var ch = CHAPTERS[recEv.chapter];
      var recDiv = document.createElement('div');
      recDiv.className = 'daily-recommend';
      if (checkinData[recId]) {
        recDiv.innerHTML =
          '<div class="daily-recommend-label">' + atm.label + ' · 已完成</div>' +
          '<div class="daily-recommend-name">' + escapeHtml(recEv.name) + '</div>' +
          '<div class="daily-recommend-done">✅ 今日已完成打卡</div>';
      } else {
        recDiv.innerHTML =
          '<div class="daily-recommend-label">' + atm.label + '</div>' +
          '<div class="daily-recommend-name">' + escapeHtml(recEv.name) + '</div>' +
          '<div class="daily-recommend-hint">' + atm.hint + '</div>' +
          '<button class="daily-recommend-btn" onclick="confirmMediaUpload(\'' + recId + '\')">去打卡 ✨</button>';
      }
      container.appendChild(recDiv);
    }
  }

  CHAPTERS.forEach(function(ch, ci) {
    // 判断该章节是否所有默认事件都已完成打卡
    var allDone = ch.events.every(function(_, ei) { return !!checkinData[ci + '-' + ei]; });
    var chapterDiv = document.createElement('div');
    chapterDiv.className = 'chapter' + (allDone ? '' : ' open');
    chapterDiv.id = 'chapter-' + ci;

    // 统计默认事件
    var checkedCount = 0;
    ch.events.forEach(function(_, ei) {
      if (checkinData[ci + '-' + ei]) checkedCount++;
    });
    // 统计自定义事件
    var customInChapter = customEvents.filter(function(ce) { return ce.chapterIndex === ci; });
    var customCount = customInChapter.length;
    var customCheckedCount = 0;
    customInChapter.forEach(function(ce) {
      if (checkinData[ce.id]) customCheckedCount++;
    });
    var totalCount = ch.events.length + customCount;
    var totalChecked = checkedCount + customCheckedCount;

    // 构建默认事件 HTML
    var defaultEventsHtml = ch.events.map(function(ev, ei) {
      var id = ci + '-' + ei;
      var checked = checkinData[id];
      var metaHtml = checked ? renderMeta(checked) : '';
      return '' +
        '<div class="event-item' + (checked ? ' checked' : '') + '" onclick="confirmMediaUpload(\'' + id + '\')">' +
          '<div class="event-check">' + (checked ? '✓' : '') + '</div>' +
          '<div class="event-info">' +
            '<div class="event-name">' + escapeHtml(ev) + '</div>' +
            metaHtml +
          '</div>' +
        '</div>';
    }).join('');

    // 构建自定义事件 HTML
    var customEventsHtml = customEvents.filter(function(ce) {
      return ce.chapterIndex === ci;
    }).map(function(ce) {
      var checked = checkinData[ce.id];
      var metaHtml = checked ? renderMeta(checked) : '';
      return '' +
        '<div class="event-item custom-event' + (checked ? ' checked' : '') + '" onclick="confirmMediaUpload(\'' + ce.id + '\')">' +
          '<div class="event-check">' + (checked ? '✓' : '') + '</div>' +
          '<div class="event-info">' +
            '<div class="event-name">' + escapeHtml(ce.name) + '<span class="custom-badge">自定义</span></div>' +
            metaHtml +
          '</div>' +
          '<button class="custom-delete-btn" onclick="deleteCustomEvent(\'' + ce.id + '\', event)">✕</button>' +
        '</div>';
    }).join('');

    chapterDiv.innerHTML =
      '<div class="chapter-header" onclick="toggleChapter(' + ci + ')">' +
        '<span class="chapter-icon">' + ch.icon + '</span>' +
        '<div class="chapter-body">' +
          '<div class="chapter-title">' + escapeHtml(ch.title) + '</div>' +
          '<div class="chapter-sub">' + escapeHtml(ch.subtitle) + '</div>' +
        '</div>' +
        '<div class="chapter-right">' +
          '<span class="chapter-count">' + totalChecked + '/' + totalCount + '</span>' +
          '<span class="chapter-arrow">▼</span>' +
        '</div>' +
      '</div>' +
      '<div class="chapter-items">' +
        defaultEventsHtml +
        customEventsHtml +
      '</div>';

    container.appendChild(chapterDiv);
  });
}

function renderMeta(data) {
  var parts = [];
  if (data.date) parts.push('📅 ' + data.date);
  if (data.photo) parts.push('📷 有照片');
  if (data.note) parts.push('💬 ' + escapeHtml(data.note.substring(0, 15)) + (data.note.length > 15 ? '…' : ''));
  if (parts.length === 0) return '';
  return '<div class="event-meta"><span>' + parts.join('</span><span>·</span><span>') + '</span></div>';
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.appendChild(document.createTextNode(str));
  return div.innerHTML;
}

function toggleChapter(ci) {
  var el = document.getElementById('chapter-' + ci);
  el.classList.toggle('open');
}

// ========== SEARCH ==========
function handleSearch() {
  var input = document.getElementById('searchInput');
  var clearBtn = document.getElementById('searchClear');
  var resultDiv = document.getElementById('searchResult');
  var term = input.value.trim().toLowerCase();
  
  if (term) {
    clearBtn.classList.add('show');
    resultDiv.classList.add('show');
  } else {
    clearBtn.classList.remove('show');
    resultDiv.classList.remove('show');
  }
  
  // 遍历所有章节和事件
  var totalVisible = 0;
  var totalMatched = 0;
  
  CHAPTERS.forEach(function(ch, ci) {
    var chapterEl = document.getElementById('chapter-' + ci);
    var items = chapterEl ? chapterEl.querySelectorAll('.event-item') : [];
    var chapterMatched = 0;
    
    items.forEach(function(item) {
      var nameEl = item.querySelector('.event-name');
      if (!nameEl) return;
      
      var name = nameEl.textContent.toLowerCase();
      var match = name.indexOf(term) !== -1;
      
      if (match) {
        item.classList.remove('hidden-event');
        chapterMatched++;
        totalMatched++;
      } else {
        item.classList.add('hidden-event');
      }
    });
    
    // 显示/隐藏章节
    if (chapterMatched > 0 || !term) {
      chapterEl.classList.remove('hidden-chapter');
      totalVisible++;
    } else {
      chapterEl.classList.add('hidden-chapter');
    }
  });
  
  // 显示搜索结果统计
  if (term) {
    resultDiv.textContent = '找到 ' + totalMatched + ' 个匹配结果（共 ' + totalVisible + ' 个章节）';
  }
}

function clearSearch() {
  var input = document.getElementById('searchInput');
  var clearBtn = document.getElementById('searchClear');
  var resultDiv = document.getElementById('searchResult');
  
  input.value = '';
  clearBtn.classList.remove('show');
  resultDiv.classList.remove('show');
  resultDiv.textContent = '';
  
  // 显示所有章节和事件
  CHAPTERS.forEach(function(ch, ci) {
    var chapterEl = document.getElementById('chapter-' + ci);
    if (chapterEl) {
      chapterEl.classList.remove('hidden-chapter');
      var items = chapterEl.querySelectorAll('.event-item');
      items.forEach(function(item) {
        item.classList.remove('hidden-event');
      });
    }
  });
}
// ========== PROGRESS ==========
var PROGRESS_CIRC = 2 * Math.PI * 64; // 圆周长 ≈ 402.124
function updateProgress() {
  var done = Object.keys(checkinData).length;
  var pct = TOTAL > 0 ? Math.round(done / TOTAL * 100) : 0;
  var offset = PROGRESS_CIRC * (1 - pct / 100);
  document.getElementById('progressRing').style.strokeDashoffset = offset;

  // 更新中心文字
  var pctEl = document.querySelector('#progressText .pct');
  var countEl = document.querySelector('#progressText .pct-count');
  if (pctEl) pctEl.textContent = pct + '%';
  if (countEl) countEl.textContent = done + ' / ' + TOTAL + ' 经历';

  // 更新顶部统计栏
  var remain = TOTAL - done;
  // 修复：统计章节完成数时，也要考虑自定义事件
  var completedChapters = 0;
  var chapterDoneCount = {}; // 每章已打卡数
  var chapterTotalCount = {}; // 每章总事件数
  // 初始化
  for (var ci = 0; ci < CHAPTERS.length; ci++) {
    chapterDoneCount[ci] = 0;
    chapterTotalCount[ci] = CHAPTERS[ci].events.length;
  }
  // 统计自定义事件
  customEvents.forEach(function(ce) {
    if (!chapterTotalCount[ce.chapterIndex]) chapterTotalCount[ce.chapterIndex] = 0;
    chapterTotalCount[ce.chapterIndex]++;
  });
  // 统计已打卡
  ALL_EVENTS.forEach(function(ev) {
    if (checkinData[ev.id]) {
      chapterDoneCount[ev.chapter]++;
    }
  });
  // 计算完成的章节
  for (var ci2 = 0; ci2 < CHAPTERS.length; ci2++) {
    if (chapterTotalCount[ci2] > 0 && chapterDoneCount[ci2] >= chapterTotalCount[ci2]) {
      completedChapters++;
    }
  }

  var statDone = document.getElementById('statDone');
  var statRemain = document.getElementById('statRemain');
  var statChapters = document.getElementById('statChapters');
  if (statDone) statDone.textContent = done;
  if (statRemain) statRemain.textContent = remain;
  if (statChapters) statChapters.textContent = completedChapters;
}

// ========== PHOTO ==========
function handlePhoto(e) {
  var file = e.target.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) {
    showToast('⚠️ 照片不能超过 5MB');
    return;
  }
  var reader = new FileReader();
  reader.onload = function(ev) {
    compressImage(ev.target.result, 600, 0.65).then(function(compressed) {
      tempPhotoData = compressed;
      showPhotoPreview(compressed);
    });
  };
  reader.readAsDataURL(file);
}

function compressImage(dataUrl, maxW, quality) {
  return new Promise(function(resolve) {
    var img = new Image();
    img.onload = function() {
      var w = img.width, h = img.height;
      if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = dataUrl;
  });
}

// ========== TABS ==========
function switchTab(tab) {
  try {
    var mainList = document.getElementById('mainList');
    var timelineView = document.getElementById('timelineView');
    var statsView = document.getElementById('statsView');

    // 显式设置 display 确保互斥显示（内联样式优先级最高，不受CSS解析错误影响）
    if (mainList) mainList.style.display = tab === 'list' ? 'block' : 'none';
    if (timelineView) timelineView.style.display = tab === 'timeline' ? 'block' : 'none';
    if (statsView) statsView.style.display = tab === 'stats' ? 'block' : 'none';

    // 同时更新类名保持样式一致性
    if (mainList) mainList.classList.toggle('hidden', tab !== 'list');
    if (timelineView) timelineView.classList.toggle('show', tab === 'timeline');
    if (statsView) statsView.classList.toggle('show', tab === 'stats');

    document.getElementById('tabList').classList.toggle('active', tab === 'list');
    document.getElementById('tabTimeline').classList.toggle('active', tab === 'timeline');
    document.getElementById('tabStats').classList.toggle('active', tab === 'stats');
    document.getElementById('tabData').classList.toggle('active', false);

    if (tab === 'timeline') renderTimeline();
    if (tab === 'stats') renderStats();

    // 设置 header 氛围属性，驱动不同 Tab 的背景变化
    var header = document.getElementById('mainHeader');

}


// ========== TIMELINE ==========
var timelineObserver = null;
var allTimelineEntries = []; // 存储所有时间线条目
var currentTimelineYear = ''; // 当前查看的年份

function setupTimelineObserver() {
  if (timelineObserver) return;
  timelineObserver = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      var el = entry.target;
      var mediaWrap = el.querySelector('.tl-media-wrap');
      if (!mediaWrap) return;
      var audios = mediaWrap.querySelectorAll('audio');
      var videos = mediaWrap.querySelectorAll('video');
      
      if (entry.isIntersecting) {
        // 条目进入视口
        el.classList.add('playing');
        el.style.transform = 'scale(1.01)';
        el.style.boxShadow = '0 8px 30px rgba(196,122,94,0.2)';
        
        // 更新当前查看的年份
        var dateEl = el.querySelector('.tl-date');
        if (dateEl) {
          var year = dateEl.textContent.split('.')[0];
          if (year !== currentTimelineYear) {
            currentTimelineYear = year;
            updateTimelineYearIndicator(year);
          }
        }
        
        // 暂停其他音频，只播放当前条目的音频
        document.querySelectorAll('.tl-item.playing').forEach(function(item) {
          if (item !== el) {
            var otherAudios = item.querySelectorAll('.tl-media-wrap audio');
            otherAudios.forEach(function(a) { a.pause(); });
          }
        });
        
        // 播放当前条目的音频（如果需要）
        audios.forEach(function(a) { 
          // 不自动播放，让用户点击
        });
        videos.forEach(function(v) { 
          // 不自动播放，让用户点击
        });
      } else {
        // 条目离开视口
        el.classList.remove('playing');
        el.style.transform = '';
        el.style.boxShadow = '';
        
        audios.forEach(function(a) { a.pause(); });
        videos.forEach(function(v) { v.pause(); });
      }
    });
  }, { threshold: 0.3, rootMargin: '-10% 0px -10% 0px' });
}

// 图片懒加载观察器
var lazyImageObserver = null;
function setupImageLazyLoad() {
  if (lazyImageObserver) return;
  lazyImageObserver = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        var img = entry.target;
        var dataSrc = img.getAttribute('data-src');
        if (dataSrc && !img.src) {
          img.src = dataSrc;
          img.removeAttribute('data-src');
          img.removeAttribute('data-lazy');
          img.classList.add('loaded');
        }
        lazyImageObserver.unobserve(img);
      }
    });
  }, { rootMargin: '100px' });
}

function renderTimeline() {
  var container = document.getElementById('timelineView');
  var river = container.querySelector('.timeline-river');
  // 清空容器但保留河流
  var children = Array.from(container.children);
  children.forEach(function(c) {
    if (!c.classList.contains('timeline-river') && !c.classList.contains('timeline-year-indicator')) c.remove();
  });
  
  // 清空年份指示器
  var indicator = document.getElementById('timelineYearIndicator');
  if (indicator) indicator.classList.remove('show');
  currentTimelineYear = '';

  // 准备所有条目
  allTimelineEntries = [];
  ALL_EVENTS.forEach(function(ev) {
    var data = checkinData[ev.id];
    if (data && data.date) {
      allTimelineEntries.push({ id: ev.id, chapter: ev.chapter, name: ev.name, date: data.date, note: data.note, hasPhoto: !!data.photo, hasAudio: !!data.hasAudio, hasVideo: !!data.hasVideo });
    }
  });

  allTimelineEntries.sort(function(a, b) {
    if (a.date > b.date) return -1;
    if (a.date < b.date) return 1;

  });

  if (allTimelineEntries.length === 0) {

    container.appendChild(emptyDiv);

  // 直接渲染所有条目（简化版本）
  var htmlParts = [];
  
  allTimelineEntries.forEach(function(ev, idx) {
    var year = ev.date.split('-')[0];

    var fleetingMsg = (!hasMedia) ? '<div class="fleeting-msg">「这一刻，只存在于记忆里」<br><span style="font-size:10px;opacity:0.5;">谁的人生没点遗憾呢</span></div>' : '';
    var mediaDivId = 'tl-media-' + ev.id;
    
    htmlParts.push(
      '<div class="tl-item ' + side + ' ' + mediaClass + '" id="tl-item-' + ev.id + '" data-year="' + year + '">' +
        '<div class="tl-card">' +
          '<div class="tl-date">' + dateParts[0] + '.' + parseInt(dateParts[1]) + '.' + parseInt(dateParts[2]) + '</div>' +
          '<div class="tl-chapter">' + ch.icon + ' ' + ch.title + '</div>' +
          '<div class="tl-name">' + escapeHtml(ev.name) + '</div>' +

    );

// 加载时光轴中的所有媒体
function loadTimelineMedia() {

  allTimelineEntries.forEach(function(ev, idx) {

          if (mediaDiv) {

            audio.controls = true;
            audio.src = URL.createObjectURL(media.audio);

            console.log('条目', ev.id, '的音频已加载');
          }
        }
        
        // 处理视频
        if (media.video) {
          var mediaDiv = document.getElementById('tl-media-' + ev.id);
          if (mediaDiv) {
            var video = document.createElement('video');
            video.controls = true;
            video.src = URL.createObjectURL(media.video);
            mediaDiv.appendChild(video);
            console.log('条目', ev.id, '的视频已加载');
          }
        }
        
        // 设置 IntersectionObserver
        setupTimelineObserver();

        if (el && timelineObserver) {
          timelineObserver.observe(el);
        }
      });
    } else {

      setupTimelineObserver();
      var el = document.getElementById('tl-item-' + ev.id);
      if (el && timelineObserver) {
        timelineObserver.observe(el);
      }
    }
  });
  
  console.log('媒体加载请求已发送');
}

function renderTimelineBatch(container) {
  if (isLoadingTimeline || renderedTimelineCount >= allTimelineEntries.length) return;
  
  isLoadingTimeline = true;
  var end = Math.min(renderedTimelineCount + TIMELINE_BATCH_SIZE, allTimelineEntries.length);
  var htmlParts = [];
  
  for (var i = renderedTimelineCount; i < end; i++) {
    var ev = allTimelineEntries[i];
    var year = ev.date.split('-')[0];
    var lastYear = i > 0 ? allTimelineEntries[i-1].date.split('-')[0] : '';
    
    if (year !== lastYear) {
      htmlParts.push('<div class="timeline-year-marker" style="top:auto;position:relative;display:inline-block;left:50%;transform:translateX(-50%);margin:18px auto;">' + year + ' 年</div>');
    }
    
    var ch = CHAPTERS[ev.chapter];
    var dateParts = ev.date.split('-');
    var side = (i % 2 === 0) ? 'left' : 'right';
    var hasMedia = ev.hasPhoto || ev.hasAudio || ev.hasVideo;
    var mediaClass = hasMedia ? 'has-media' : 'no-media';
    
    var noteHtml = ev.note ? '<div class="tl-note">💬 ' + escapeHtml(ev.note) + '</div>' : '';
    // 照片先显示占位符，异步从 IndexedDB 加载
    var photoHtml = ev.hasPhoto ? '<div class="tl-photo-container" id="tl-photo-' + ev.id + '"><div class="tl-photo-placeholder">📷 加载中...</div></div>' : '';
    var fleetingMsg = (!hasMedia) ? '<div class="fleeting-msg">「这一刻，只存在于记忆里」<br><span style="font-size:10px;opacity:0.5;">谁的人生没点遗憾呢</span></div>' : '';
    var mediaDivId = 'tl-media-' + ev.id;
    
    htmlParts.push(
      '<div class="tl-item ' + side + ' ' + mediaClass + '" id="tl-item-' + ev.id + '">' +
        '<div class="tl-card">' +
          '<div class="tl-date">' + dateParts[0] + '.' + parseInt(dateParts[1]) + '.' + parseInt(dateParts[2]) + '</div>' +
          '<div class="tl-chapter">' + ch.icon + ' ' + ch.title + '</div>' +
          '<div class="tl-name">' + escapeHtml(ev.name) + '</div>' +
          noteHtml +
          photoHtml +
          '<div class="tl-media-wrap" id="' + mediaDivId + '"></div>' +
          fleetingMsg +
        '</div>' +
      '</div>'
    );
  }
  
  container.insertAdjacentHTML('beforeend', htmlParts.join('\n'));
  renderedTimelineCount = end;
  isLoadingTimeline = false;
  
  // 设置图片懒加载
  setupImageLazyLoad();
  container.querySelectorAll('.tl-photo[data-lazy="true"]').forEach(function(img) {
    if (lazyImageObserver) lazyImageObserver.observe(img);
  });
  
  // 照片点击查看大图
  container.querySelectorAll('.tl-photo').forEach(function(img) {
    img.addEventListener('click', function() {
      viewPhoto(this.getAttribute('data-event-id'));
    });
  });
  
  // 异步加载 IndexedDB 中的照片、音频和视频
  for (var j = renderedTimelineCount - TIMELINE_BATCH_SIZE; j < end; j++) {
    (function(batchEv) {
      var ev = batchEv;
      
      // 加载照片
      if (ev.hasPhoto) {
        getMediaForEvent(ev.id, function(media) {
          var photoContainer = document.getElementById('tl-photo-' + ev.id);
          if (!photoContainer) return;
          
          if (media.photo) {
            // 照片是 base64 字符串，直接使用
            var img = document.createElement('img');
            img.className = 'tl-photo';
            img.dataset.eventId = ev.id;
            img.alt = ev.name;
            img.src = media.photo; // base64 字符串直接使用
            img.onclick = function() { viewPhoto(this.dataset.eventId); };
            
            // 替换占位符
            photoContainer.innerHTML = '';
            photoContainer.appendChild(img);
          }
          
          // 加载音频和视频
          var mediaDiv = document.getElementById('tl-media-' + ev.id);
          if (!mediaDiv) return;
          
          if (media.audio) {
            var audio = document.createElement('audio');
            audio.controls = true;
            audio.preload = 'metadata';
            audio.src = URL.createObjectURL(media.audio);
            mediaDiv.appendChild(audio);
          }
          if (media.video) {
            var video = document.createElement('video');
            video.controls = true;
            video.preload = 'metadata';
            video.src = URL.createObjectURL(media.video);
            mediaDiv.appendChild(video);
          }
          
          setupTimelineObserver();
          var el = document.getElementById('tl-item-' + ev.id);
          if (el && timelineObserver) timelineObserver.observe(el);
        });
      } else if (ev.hasAudio || ev.hasVideo) {
        // 没有照片，只有音频/视频
        getMediaForEvent(ev.id, function(media) {
          var mediaDiv = document.getElementById('tl-media-' + ev.id);
          if (!mediaDiv) return;
          
          if (media.audio) {
            var audio = document.createElement('audio');
            audio.controls = true;
            audio.preload = 'metadata';
            audio.src = URL.createObjectURL(media.audio);
            mediaDiv.appendChild(audio);
          }
          if (media.video) {
            var video = document.createElement('video');
            video.controls = true;
            video.preload = 'metadata';
            video.src = URL.createObjectURL(media.video);
            mediaDiv.appendChild(video);
          }
          
          setupTimelineObserver();
          var el = document.getElementById('tl-item-' + ev.id);
          if (el && timelineObserver) timelineObserver.observe(el);
        });
      } else {
        // 没有媒体
        setupTimelineObserver();
        var el = document.getElementById('tl-item-' + ev.id);
        if (el && timelineObserver) timelineObserver.observe(el);
      }
    })(allTimelineEntries[j]);
  }
  
  // 如果还有更多条目，添加哨兵元素
  if (renderedTimelineCount < allTimelineEntries.length) {
    addTimelineSentinel(container);
  }
}

function addTimelineSentinel(container) {
  // 移除旧的哨兵
  var oldSentinel = document.getElementById('timeline-sentinel');
  if (oldSentinel) oldSentinel.remove();
  
  // 添加新哨兵
  var sentinel = document.createElement('div');
  sentinel.id = 'timeline-sentinel';
  sentinel.style.height = '1px';
  container.appendChild(sentinel);
  
  if (window.timelineSentinelObserver) window.timelineSentinelObserver.disconnect();
  
  window.timelineSentinelObserver = new IntersectionObserver(function(entries) {
    if (entries[0].isIntersecting) {
      renderTimelineBatch(container);
    }
  }, { rootMargin: '200px' });
  
  window.timelineSentinelObserver.observe(sentinel);
}

function buildHeatmap(container) {
  var today = new Date();
  var startDate = new Date(today);
  startDate.setDate(startDate.getDate() - 364); // 一年前
  startDate = new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate());

  // 按日期索引打卡次数
  var countMap = {};
  Object.keys(checkinData).forEach(function(k) {
    var d = checkinData[k].date;
    if (!d) return;
    countMap[d] = (countMap[d] || 0) + 1;
  });

  // 构建按周的网格 (53列 x 7行)
  var weeks = [];
  var current = new Date(startDate);
  // 调整到本周的周日
  while (current.getDay() !== 0) {
    current.setDate(current.getDate() - 1);
  }

  var week = [];
  while (current <= today) {
    var ds = current.getFullYear() + '-' + String(current.getMonth()+1).padStart(2,'0') + '-' + String(current.getDate()).padStart(2,'0');
    week.push({ date: ds, dow: current.getDay() });
    if (current.getDay() === 6) {
      weeks.push(week);
      week = [];
    }
    current.setDate(current.getDate() + 1);
  }
  if (week.length > 0) weeks.push(week);

  // 生成网格 HTML
  var gridEl = document.getElementById('heatmapGrid');
  if (!gridEl) {
    // 还没渲染到DOM，需要在渲染后调用
    setTimeout(function() { buildHeatmap(null); }, 100);
    return;
  }

  gridEl.innerHTML = '';
  weeks.forEach(function(week) {
    for (var d=0; d<7; d++) {
      var cell = week.find(function(w) { return w.dow === d; });
      var level = 0;
      if (cell) {
        var cnt = countMap[cell.date] || 0;
        if (cnt >= 4) level = 4;
        else if (cnt >= 3) level = 3;
        else if (cnt >= 2) level = 2;
        else if (cnt >= 1) level = 1;
      }
      var div = document.createElement('div');
      div.className = 'heatmap-cell level-' + level + (cell && cell.date === (today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0')) ? ' today' : '');
      if (cell) div.title = cell.date + '：' + (countMap[cell.date]||0) + ' 个打卡';
      gridEl.appendChild(div);
    }
  });

  // 月份标签
  var monthsEl = document.getElementById('heatmapMonths');
  if (monthsEl) {
    monthsEl.innerHTML = '';
    var lastMonth = -1;
    weeks.forEach(function(week, wi) {
      if (week.length === 0) return;
      var m = new Date(week[0].date).getMonth();
      if (m !== lastMonth) {
        var span = document.createElement('span');
        span.textContent = (m+1) + '月';
        span.style.gridColumn = wi + 1;
        monthsEl.appendChild(span);
        lastMonth = m;
      }
    });
  }

  var titleEl = document.getElementById('heatmapTitle');
  if (titleEl) {
    titleEl.textContent = '过去一年（' + startDate.getFullYear() + '.' + (startDate.getMonth()+1) + '.' + startDate.getDate() + ' - ' + (today.getMonth()+1) + '.' + today.getDate() + '）';
  }
}

function importData(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    try {
      var imported = JSON.parse(ev.target.result);
      var isNewFormat = imported && imported.__lifeCheckinExport === true;
      var checkinImported, customImported = null;
      if (isNewFormat) {
        checkinImported = imported.checkinData || {};
        customImported = imported.customEvents || [];
      } else {
        checkinImported = imported;
        customImported = [];
      }
      var count = Object.keys(checkinImported).length;
      if (confirm('即将导入 ' + count + ' 条打卡记录\n\n确定 = 覆盖当前数据\n取消 = 合并数据')) {
        checkinData = checkinImported;
        if (isNewFormat) customEvents = customImported;
      } else {
        Object.keys(checkinImported).forEach(function(k) { checkinData[k] = checkinImported[k]; });
        if (isNewFormat) {
          // 合并自定义事件（去重 by id）
          var existingIds = {};
          customEvents.forEach(function(ce) { existingIds[ce.id] = true; });
          customImported.forEach(function(ce) {
            if (!existingIds[ce.id]) customEvents.push(ce);
          });
        }
      }
      saveData();
      saveCustomEvents();
      rebuildAllEvents();
      renderList();
      updateProgress();
      showToast('📥 数据导入成功！');
    } catch(err) {
      showToast('⚠️ 文件格式不正确');
    }
  };
  reader.readAsText(file);
  document.getElementById('importInput').value = '';
  closeDataPanel();
}

function confirmClearData() {
  if (confirm('确定要清除所有打卡数据吗？\n\n此操作不可恢复！')) {
    checkinData = {};

function confirmResetApp() {

// 按季节/节气氛围推荐，不只是随机
function getSeasonalBoost() {
  var m = new Date().getMonth() + 1; // 1-12
  // 返回各章节的加权系数（章节下标 → 权重倍数）
  // Spring 3-5: 成长/求学章节加权
  if (m >= 3 && m <= 5) return { 0:2, 1:2, 5:1.5 };
  // Summer 6-8: 体验/冒险章节加权
  if (m >= 6 && m <= 8) return { 5:2.5, 0:1.3, 7:1.3 };
  // Autumn 9-11: 感情/家庭/收获感章节加权
  if (m >= 9 && m <= 11) return { 3:2.5, 4:2, 6:1.5 };
  // Winter 12-2: 家庭/成长接纳章节加权
  return { 4:2.5, 3:1.5, 7:2, 2:1.3 };
}

function pickDailyRecommend() {
  var today = new Date().toISOString().split('T')[0];
  var saved = localStorage.getItem('lifeCheckinDaily');
  if (saved) {
    try {
      var obj = JSON.parse(saved);
      if (obj.date === today && ALL_EVENTS.some(function(e) { return e.id === obj.id; })) {
        if (!checkinData[obj.id]) return obj.id;
      }
    } catch(e) {}
  }
  // 季节加权随机选取
  var pool = ALL_EVENTS.filter(function(e) { return !checkinData[e.id]; });
  if (pool.length === 0) return null;
  var boost = getSeasonalBoost();
  var weighted = [];
  pool.forEach(function(e) {
    var w = boost[e.chapter] || 1;
    for (var i = 0; i < w; i++) weighted.push(e);
  });
  var pick = weighted[Math.floor(Math.random() * weighted.length)];
  localStorage.setItem('lifeCheckinDaily', JSON.stringify({ date: today, id: pick.id }));
  return pick.id;
}

  { name:'暖阳陶土', bg:['#c47a5e','#b86248','#a05038','#8a4030'], glow:[255,200,140] },
  { name:'深海蔚蓝', bg:['#2a6a8f','#1f5a7a','#154a65','#0d3a50'], glow:[100,200,255] },
  { name:'森林墨绿', bg:['#2d6a4f','#1f5a3f','#144a30','#0a3a22'], glow:[100,255,180] },
